<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L I A R — каталог анкет</title>

<style>
:root{
  --bg:#0b0b0e;--surface:#121218;--surface2:#191920;--surface3:#202029;
  --tx:#f4f2f7;--mut:#92909b;--mut2:#6f6d78;--ac:#9b8cff;
  --ac-soft:rgba(155,140,255,.13);--bd:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(0,0,0,.38);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(900px 420px at 50% -120px,rgba(155,140,255,.12),transparent 70%),
  var(--bg);
  color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--ac)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 52px}

.hero{
  min-height:190px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;
  padding:48px 0 28px;border-bottom:1px solid var(--bd);
}
.brand-kicker{font-size:11px;letter-spacing:.28em;color:var(--ac);font-weight:750;text-transform:uppercase;margin-bottom:8px}
.brand-title{font-size:clamp(38px,7vw,72px);line-height:.92;letter-spacing:.12em;margin:0;font-weight:800}
.brand-sub{margin:12px 0 0;color:var(--mut);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.hero-side{text-align:right;min-width:230px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.statsline{margin-top:12px;color:var(--tx);font-size:13px}
.statsline span{color:var(--mut)}

.controls-shell{
  position:sticky;top:0;z-index:20;margin:0 -20px 24px;padding:14px 20px 12px;
  background:linear-gradient(to bottom,rgba(11,11,14,.98),rgba(11,11,14,.92));
  backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);
}
.controls{max-width:1180px;margin:0 auto}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px}
.search-wrap{position:relative}
.search-wrap:before{
  content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-53%);
  color:var(--mut);font-size:22px;pointer-events:none;
}
#q{
  width:100%;height:44px;padding:0 14px 0 42px;border:1px solid var(--bd);border-radius:12px;
  background:var(--surface);color:var(--tx);outline:none;transition:border-color .18s,box-shadow .18s;
}
#q:focus{border-color:rgba(155,140,255,.55);box-shadow:0 0 0 3px rgba(155,140,255,.09)}
#sort{
  width:100%;height:44px;padding:0 34px 0 12px;border:1px solid var(--bd);border-radius:12px;
  background:var(--surface);color:var(--tx);outline:none;cursor:pointer;
}
.tags{
  display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none
}
.tags::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--bd);background:transparent;color:var(--mut);
  border-radius:999px;padding:6px 11px;font-size:11px;letter-spacing:.045em;cursor:pointer;
  transition:.16s ease;text-transform:uppercase;
}
.chip:hover{color:var(--tx);border-color:rgba(255,255,255,.18)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0d0c11;font-weight:800}
.chip.fav-chip:before{content:"♡ ";font-size:13px}
.chip.archive-chip{margin-left:auto;color:#74727c}
.chip.archive-chip.on{color:#0d0c11}
.resultsline{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;color:var(--mut);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{
  position:relative;display:block;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--bd);
  border-radius:16px;padding:0;cursor:pointer;background:linear-gradient(150deg,#292831,#101014);
  color:#fff;text-align:left;isolation:isolate;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:rgba(155,140,255,.5);transform:translateY(-4px);box-shadow:0 20px 45px rgba(0,0,0,.28)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.card-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease,filter .25s ease;z-index:0}
.card:hover .card-photo{transform:scale(1.045)}
.card-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 50% 35%,#33313f,#111116 70%);color:rgba(255,255,255,.75);
  font-size:42px;font-weight:800;letter-spacing:.06em;text-align:center;z-index:0
}
.card-shade{position:absolute;inset:32% 0 0;background:linear-gradient(to bottom,transparent,rgba(5,5,8,.12) 14%,rgba(5,5,8,.92) 100%);z-index:1;pointer-events:none}
.division-badge{
  position:absolute;left:11px;top:11px;z-index:3;max-width:72%;
  padding:5px 8px;border:1px solid rgba(255,255,255,.16);border-radius:999px;
  background:rgba(10,10,14,.55);backdrop-filter:blur(8px);color:rgba(255,255,255,.82);
  font-size:9px;line-height:1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.card-info{position:absolute;left:0;right:0;bottom:0;padding:48px 76px 13px 13px;z-index:2}
.card-name{display:block;font-size:17px;line-height:1.15;font-weight:780;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.card-meta{display:block;margin-top:5px;color:rgba(255,255,255,.65);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.like-box{position:absolute;right:13px;bottom:12px;z-index:4;display:none;align-items:center;gap:5px;filter:drop-shadow(0 2px 7px rgba(0,0,0,.42))}
.card-heart{width:21px;height:21px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;cursor:pointer}
.card-heart svg{width:100%;height:100%;display:block;fill:transparent;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.18s ease;opacity:.94}
.card-heart:hover svg{transform:scale(1.08)}
.card-heart.on svg{fill:var(--ac);stroke:var(--ac)}
.like-count{display:block;color:#fff;font-size:13px;font-weight:650;line-height:1}

.card.archived-card .card-photo{filter:grayscale(.65) brightness(.72)}
.card.archived-card .division-badge{color:#c4c1cb}

.empty{
  grid-column:1/-1;padding:70px 20px;text-align:center;border:1px dashed var(--bd);
  border-radius:16px;color:var(--mut);background:rgba(255,255,255,.015)
}

/* profile */
.ov{
  position:fixed;inset:0;background:rgba(3,3,6,.78);display:none;align-items:flex-end;justify-content:center;
  z-index:50;padding:22px;backdrop-filter:blur(8px)
}
.ov.show{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:800px;max-height:92vh;overflow:auto;
  border:1px solid var(--bd);border-radius:22px;padding:0 20px 22px;box-shadow:var(--shadow)
}
.sheet::-webkit-scrollbar{width:8px}.sheet::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:20px}
.profile-hero{
  position:relative;margin:0 -20px 20px;height:330px;overflow:hidden;border-radius:21px 21px 0 0;
  background:linear-gradient(150deg,#2b2935,#111116)
}
.profile-photo{width:100%;height:100%;object-fit:cover;display:block}
.profile-hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(to bottom,transparent,rgba(10,9,14,.92))}
.profile-head{position:absolute;z-index:2;left:22px;right:22px;bottom:19px}
.profile-head h2{font-size:30px;line-height:1.05;margin:0 0 6px}
.profile-alias{color:rgba(255,255,255,.7);font-size:13px}
.profile-tags{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px}
.t{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(155,140,255,.25);border-radius:999px;padding:4px 9px;color:#c9c1ff;background:var(--ac-soft)}

.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 18px}
.info-item{padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.018)}
.info-label{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.info-value{display:block;color:var(--tx);font-size:13px;line-height:1.4}
.info-value a{text-decoration:none}

.profile-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:22px 0 9px;padding-left:9px;border-left:2px solid var(--ac)}
.st{display:grid;grid-template-columns:96px 1fr 22px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar{height:7px;border-radius:5px;background:var(--surface3);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b9adff)}

.section-block{border-top:1px solid var(--bd);padding:0}
.section-block:last-of-type{border-bottom:1px solid var(--bd)}
.section-block summary{
  list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 2px;cursor:pointer;color:var(--tx);font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700
}
.section-block summary::-webkit-details-marker{display:none}
.section-block summary:after{content:"+";color:var(--mut);font-size:18px;font-weight:400}
.section-block[open] summary:after{content:"−";color:var(--ac)}
.section-content{padding:0 2px 10px;color:#d8d6de}
.section-content p{margin:0 0 10px;font-size:14px;line-height:1.65}

.note{border:1px dashed var(--bd);border-radius:12px;padding:11px 13px;color:var(--mut);font-size:12px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
.btn{
  padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--mut);
  font:inherit;font-size:12px;cursor:pointer;text-decoration:none;transition:.16s ease
}
.btn:hover{color:var(--tx);border-color:rgba(255,255,255,.18)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#0d0c11;font-weight:750}

@media(max-width:720px){
  .hero{min-height:155px;padding:32px 0 22px}.hero-side{display:none}
  .search-row{grid-template-columns:1fr 140px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{border-radius:13px}.card-info{padding:42px 64px 10px 10px}.card-name{font-size:14px}.card-meta{font-size:10px}
  .division-badge{left:8px;top:8px;padding:4px 7px;font-size:8px}
  .like-box{right:10px;bottom:10px}.like-count{font-size:12px}
  .ov{padding:0;align-items:flex-end}.sheet{max-height:94vh;border-radius:18px 18px 0 0;border-bottom:0}
  .profile-hero{height:285px}.profile-head h2{font-size:25px}
  .info-grid{grid-template-columns:1fr}
}
@media(max-width:420px){
  .wrap{padding-left:12px;padding-right:12px}.controls-shell{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .search-row{grid-template-columns:1fr}.brand-title{font-size:38px}
}
</style>
</head><body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="brand-kicker">private character registry</div>
      <h1 class="brand-title">LIAR</h1>
      <p class="brand-sub">character database</p>
    </div>
    <div class="hero-side">
      <div class="live">database online</div>
      <div class="statsline" id="heroStats">—</div>
    </div>
  </header>

  <div class="controls-shell">
    <div class="controls">
      <div class="search-row">
        <div class="search-wrap">
          <input type="search" id="q" placeholder="Поиск по имени, роли или тексту анкеты…" autocomplete="off">
        </div>
        <select id="sort" aria-label="Сортировка">
          <option value="name">по имени</option>
          <option value="popular">по популярности</option>
          <option value="date">по дате анкеты</option>
        </select>
      </div>
      <div class="tags" id="tags"></div>
    </div>
  </div>

  <div class="resultsline">
    <span id="cnt"></span>
    <span id="sectionLabel">ALL CHARACTERS</span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
/* ДАННЫЕ: собраны из сохранённой страницы обсуждения; метки (tags) можно править */
const TOPIC="https://vk.ru/topic-236728131_57553286";
// Общий счётчик лайков работает через Firebase Realtime Database.
// Вставьте сюда адрес вашей базы, например:
// https://your-project-default-rtdb.europe-west1.firebasedatabase.app
const FIREBASE_DB_URL="https://clan-of-liars-default-rtdb.europe-west1.firebasedatabase.app";
const C=[{"id":"archie","name":"Аарон Тейлор-Джонсон","aka":["Archie Johnson","Арчи"],"age":["35 лет."],"role":["Генеральный партнер Клана LIAR | CEO и основатель «THE LAB» (промышленный синтез, сбыт и поставка психотропных веществ)."],"orient":["Натурал. ( Латентный к мужскому полу, но не признает )."],"tags":["ADMINISTRATION"],"player":{"name":"Archie Jonson","url":"https://vk.ru/archie_liar"},"date":"19 мар в 13:01","epigraph":null,"sections":{"character":["— Характер Аарона — это монолит из ледяного стоицизма и расчетливой жестокости. Он подобен тени в углу комнаты, чье присутствие ощущается кожей раньше, чем фиксируется взглядом. Агрессия для него — не импульс, а инструмент; он препарирует собеседника, выискивая фальшь в мимике и жестах. Прямолинеен, циничен и лишен иллюзий, считая людей самыми опасными животными. Он не ищет союзников, но мастерски находит подход к любому индивиду, если того требуют интересы Клана. Его внутренний закон — это жесткая дисциплина и эффективность, не допускающая слабостей или «добродетели», которые он считает масками лжецов. В компаниях сговорчив, но всегда сохраняет дистанцию, наблюдая за миром сквозь призму «черной правды».","/ Disclaimer: Быдловат. Болен на голову.","| Not Alpha. Just normal guy with strong character |"],"biography":["—  Немец по происхождению. Жизнь Аарона — это методичное превращение живого человека в функциональный механизм власти. Выросший под жесткой рукой отца-охотника, он с юности впитывал философию «выживает сильнейший», подрабатывая заказными убийствами. До 2021 года он оттачивал навыки в наемных группировках, пройдя путь до оперативника мафии «Malen». Финальная служба итальянцам обернулась критическим долгом перед Синдикатом, что вынудило Арчи инсценировать свою смерть. С этого момента старый Аарон перестал существовать: он прошел через ряд пластических операций, изменил цвет волос и стал использовать линзы, скрывая настоящий цвет глаз.","Залегши на дно в Юго-Восточной Азии, он конвертировал свои знания в наркобизнесе в реальную власть: наладил производство в штате Шан (Мьянма), а затем закрепился в Камбодже, контролируя трафик людей и элитной химии. Используя связи в South Asia Pacific, он выстроил логистические «мосты» с Китаем, что позволило ему вернуться на Запад игроком. По официальным данным он мертв, а его паспорта и имена меняются в зависимости от страны визита.","Обосновавшись в Монако, Арчи возвел виллу-лабораторию THE LAB. Финальным аккордом стало партнерство с Лиардом Эдером: слияние производственных мощностей Арчи и эскорт-индустрии Лиарда породило Клан LIAR — корпорацию, где Арчи занимает место генерального партнера и главного карателя."],"ability":["— Выдающийся аналитический ум. Мастер ближнего боя с использованием холодного оружия и анатомических уязвимостей. Эксперт в области инженерных «закладок» и взлома систем безопасности. Обладает высоким болевым порогом и талантом манипулятора, способного к полной мимикрии."],"weaknesses":["— Острая физическая неприязнь к тактильному контакту; любое прикосновение воспринимается как агрессия. Психологический отпечаток «бывшего наркомана» — гиперфиксация на контроле. Левая нога заменена функциональным протезом, требующим техобслуживания."],"hobby":["— Коллекционирование античных трактатов по стоицизму. Утренний бег для калибровки протеза. Изучение психологии девиаций в Секторе Испытаний."],"features":["— Лично отслеживает караваны в Андаманском море. Постоянно носит маску на пол-лица, чтобы скрыть шрам и результаты вмешательств. Много курит, предпочитает тишину и жесткую субординацию. Официально признан мертвым во всех базах данных.","Знает 4 языка: Немецкий, Китайский, Корейский, Английский."],"appearance":["— Рост: 185 см | Вес: 90 кг. Усиленная физическая форма, мощная мускулатура. Крашенный, цвет глаз изменен линзами. Узнать его практически невозможно из-за пластики лица и маски, которую он носит на пол-лица постоянно. Изменил внешность путем вмешательств, когда скрывался в Азии.","— Есть приемный сын."]},"stats":{"Сила":8,"Ловкость":5,"Интеллект":4,"Восприятие":3,"Харизма":0},"tracks":["Flickers (Zeds Dead Remix)[bassbosted by RellaX] — Son Lux"],"photo":"images/archie.jpg","archived":false},{"id":"konig","name":"Август Кёниг","aka":["August König"],"age":["34"],"role":["роль в клане - ИО Вивисектора","является ли наемником - нет."],"orient":["пансексуал"],"tags":["HORTUS","THE LAB"],"player":{"name":"K Ö N I G","url":"https://vk.ru/august__konig"},"date":"2 авг в 15:43","epigraph":null,"sections":{"character":["— Производит впечатление спокойного и даже ленивого человека, пока ситуация не требует действий. Редко суетится, не любит лишние слова и предпочитает наблюдать. В обычной жизни расслаблен, что не сказать окритической ситуации. Эмоции не мешают ему действовать, но догоняют после.","Не стремится к лидерству и власти, хотя без проблем берет командование на себя, если это необходимо. Может быть и просто исполнителем. Не имеет потребности что-то доказывать окружающим.","Негативно относится к манипуляторам, пустословам и тем, чьи действия расходятся со словами. Лоялен к переменам и умеет подстаиваться, хотя бесится, когда его планы нарушаются.","Плохо понимает эмоции и намеки. Бывает груб не от того, что хочет кого-то оскорбить или задеть, просто плохо видит границы.","Имеет внутренний кодекс, что хорошо, а что плохо и часто это несколько разнится с общим представлением о морали.","Физическую боль переносит значительно легче большинства людей. Обучен игнорировать любой дискомфорт. Хорошо переносит страх и способен сохранять работоспособность даже в опасной для жизни обстановке.","Раньше имел проблеммы с агрессией, но научился перенаправлять это в иное русло."],"biography":["— Родился в Австрии в семье кадрового военного. Уже в юнности он отличался внушительными физическими данными и вспыльчивостью, поэтому был отправлен в военное училище. По окончанию, служил в подразделениях специального назначения, где получил подготовку по тактике боя, разведке, контртеррористическим операциям, работе в городской среде и сопровождению особо важных лиц. За годы службы неоднократно участвовал в боевых операциях.","Позже покинул государственную службу и перешел в частную военную компанию. Работа привела его в разные страны, где приходилось выполнять самые разные задачи: сопровождение гуманитарных и коммерческих конвоев, эвакуация гражданских лиц, охрана стратегических объектов, борьба с воорженными группировками и обусение местных подразделений.","Во время одной из операций, получил задание, которое шло наперекор с его мировоззрением, поэтому он намеренно, или по трагическому стечению обстоятельст, получил серьезную травму левой ноги. Несмотря на успешное лечение, последствия остались с ним навсегда, поэтому может прихрамывать и избегает чрезмерных нагрузок на поврежденную конечность. Однако травма практически не скащалась на его профессиональных навыках.","Покинул службу по договоренности с руководством, решив переехать и оборвать контакты с его прошлой жизнью, хотя мало кому это удается до конца."],"ability":["- Чемпион по уличным боям. Несколько лет, чтобы сбросить пар, участвовал в подпольных поединках.","- Профессиональный снайпер, но из-за габаритов его взяли в группу захвата.","- Мастер рукопашного боя. Владеет несколькими системами ближнего боя, борьбой, боксом и приемами обездвиживания.","- Хорошо разбирается и любит оружие. Как огнестрелы, так и холодное.","- Высокий болевой порог.","- Хорошо и с удовольствием готовит. (Как и ест).","- Преданный, как собака.","- Не имеет предрассутков.","- Любит и отлично ладит с животными.","- Имеет талант к медицине и, если бы не военное дело, выбрал бы этот путь. Прошел курс тактической медицины, курс полевой хирургии и подготовку по экстренным хирургическим манипуляциям."],"weaknesses":["- Плохо ощущает запахи, может их путать.","- Левая нога после продолжительной нагрузки сильно болит и усиливает хромоту. Главное физически уязвимое место.","- Быстро пьянеет, поэтому пьет крайне редко.","- Заметная внешность. Не способен затеряться в толпе.","- Большая масса. Испытывает трудности с маленькими автомобилями, не качественной мебелью, хрупкими вещами. На работе ловок, но в обычной жизни расслабляется и может выглядеть, как слон в посудной лавке.","- Страдает от вспышек агрессии, хотя учится из контролировать. Склонен к насилию, как к решению проблем.","- Не разбирается в эмоциях людей, плох в полутонах.","- Испытывает потребность в контроле всего и вся.","- Имеет тревожное расстройство.","- Клаустрофобия.","- В повседневной жизни часто забывчив. Особенно, когда тема ему не интересна."],"hobby":["- Любит свой фикус. Если где-то обживается на долго, начинает выращивать базилик, томаты и прочие полезные растения. Относится к ним неожиданно заботливо.","- Если видит бассейн или водоем - искать его надо там.","- Ремонт автомобилей. Очень любит старую технику, которую можно разобрать руками.","- Готовит ради удовольствия."],"features":["- Обожает свой собственный уют и обустраивать дом, где живет.","- Любит музыку","- Хотел бы купить дом и иметь собственную ферму.","- Носит с собой оружие и нож.","- Часто ходит в маске","- Кинестетик","- Любит дурной юмор и громко смеется.","- Сплит языка.","- Родной язык - немецкий.","- Спит где угодно и как угодно."],"appearance":["—  Рост 210см. Вес 130 кг. Тело крепкое, натренированное. Несмотря на габариты, двигается легко. Можно сказать, он отличная рабочая машина.","Глаза - серые. Волосы русые, короткие.","Носит очки для украшения.","- Прототип внешности Кёнига(из КОД)."]},"stats":{"Сила":5,"Ловкость":5,"Интеллект":4,"Харизма":2,"Восприятие":4},"tracks":[],"photo":"images/konig.jpg","archived":false},{"id":"adam","name":"Адам Ворт","aka":["Adam Wort","«Фокусник»"],"age":["37"],"role":["Аналитик-Стратег"],"orient":["Бисексуал"],"tags":["HORTUS"],"player":{"name":"Adam Wort","url":"https://vk.ru/id277736506"},"date":"1 апр в 0:45","epigraph":null,"sections":{"character":["— Выглядит Адам, как самый наивный в мире простак, яркая улыбка, наивные речи про любовь и мир во всём мире. На самом деле он «актёр» - ловко меняет маски и делает это так часто, что уже и не помнит, какая из них его настоящее лицо. Ворт строг и требователен, в первую очередь к себе. Внимателен к деталям, специализация обязывает. Ловко применяет такие методы, как: «Хороший коп, плохой коп»; «Кнута и пряника», а также «комплекс старшего брата». Конечно он Бог и не может учесть всё, однако делает всё от него зависящее, чтобы приблизиться к данному статусу. Немного нарцисс и однолюб. Плохо с чувством юмора, если Адам смеётся, это не значит, что в следующую секунду, не будет что-нибудь разбито – лицо, например. Ласковый до поры до времени. Не особо терпелив, либо сейчас, либо уже не надо. Хоть и предпочитает насилию разговоры, проскальзывают замашки садиста."],"biography":["— Адам француз с американскими корнями. Отец – военный, мать – ассистентка политика, они встретились на саммите, очередное пускание пыли в глаза людей правительством. У материи не было семьи, у отца оставалась только мать. Не мама, а та самая строгая женщина, которая заставляет сомневаться любили ли она вообще? Бабуля – Аделин Ворт, дознаватель на пенсии. Изящная Мадам, которая одним взглядом говорит красноречивей любых слов и даже пыток. Адам всё детство провёл с ней на Юге Франции. Иногда родители брали сына в командировки. Всю сознательную жизнь юный Ворт крутился в этом дерьме под названием «политика». Благодаря чему выучил – «Информация правит миром», её боятся больше, чем оружия, она опасней, чем яды, она сильнее лекарств. Слова страшнее всего, что придумало человечество. Но если «истинный Бог» - Информация, то главное «сокровище» это – люди. Ближе к шестнадцати парень понял, добывать информацию не сложно, куда сложнее правильно её использовать. Адам один из самых первых имел доступ к политической и военной информации, через родителей, кто заподозрит ребёнка? Слухи, разговоры за чашкой кофе, бывшие коллеги бабушки, приходящие за советом или привлекающие её, как консультанта к разным делам. Два года Ворт манипулировал, получал и сбывал информацию будучи информатором, так продолжалось бы и дальше, но отец поймал его на горячем. Скандала удалось избежать, однако парень отправился в армию, а по возращению поступил в полицейскую академию, пять лет он вёл себя, как добропорядочный гражданин. Пять лет держался, но вот он комиссар, информация снова в его руках. Все фигуры «на шахматной доске». Игра началась. Захватила с новой силой и сломала, как наркомана. Приятнее всего было наблюдать из тени, как твои ходы приносят плоды. Адам сотрудничал с небольшими группировками, одних продавал, других покупал, стравливал, власть вскружила ему голову, он позабыл про осторожность. Сначала умирает бабушка, костлявая добралась и до неё, по крайней мере это так выглядело. Продажный мир прогнивший насквозь никак не вписывался в понятия морали Адама. Казалось ему под силу изменить саму суть людей. Это была заранее проигранная война, он вышел один против слишком влиятельных людей.","К тридцати Ворт сломался окончательно. В теракте погибают его родители, последняя ниточка здравого смысла, что позволяла ему держаться и бороться. Семь лет работы на автопилоте, редкий сбыт информации и полное отсутствие смысла жизни, всё, что ему до сих пор интересно это – информация. В клан Адама приглашает Лиард, когда-то пересекались пару раз по работе. Та встреча изменила многое, но только стены знают, какое соглашение заключили эти двое.","— Приветствуем описание опыта в других проектах, связанных с мафией.","Сотрудничал с несколькими известными организациями пятилетней давности. Выполнял как боевые (стратегические) задания, так и политические (переговоры) и дружеские (посещение приёмом и раутов)."],"ability":["— Физические: Ближний бой; Фехтование; Гибкость.","— Умственные: Внимание; Память; Воображение; Аналитический склад ума; Внимание к деталям; Системное/критическое мышление; Коммуникабельность; Стратегическое виденье; Высокая ответственность; Гибкость (ума) и адаптивность."],"weaknesses":["— ОКР – конечно для стратега-аналитика данный диагноз звучит, как благословление, но иногда это и его проклятье. Недосмотрел, отклонились от плана на 0,0001 и всё. Адам сходит с ума, не смог, не досмотрел, это откатывает к детству, делает уязвимым и капризным, а главное напоминает: «Ничтожества Вортам не нужны». Если ты не лучший, тебя могу в любой момент бросить, как беспризорную псину.","— Одержимость – существует некий «якорь», «маяк», «свет» на который Адам ориентируется. Слабая воля к жизни лишала стимула двигаться, быть лучшим, сохранять свою и жизнь подчинённых. Сильная воля к жизни лишает азарта, не даёт свободу совершать ошибки, поэтому нужен «маяк». Та самая ахиллесова пята, ради которого нельзя ошибаться и легко творить безумства.","— Несмотря на спец подготовку плохо обращается с огнестрельным оружием, практически на 0 уровне.","— Не панически, но с брезгливой опаской относится к паукам и иглам, может перетерпеть, но лучше не надо."],"hobby":["— Адам одержим драками, ближний бой, фехтование.","— Книги. Это самый надёжный источник информации и компетенций. Конечно, мужчину нельзя назвать книжным червём, он не сидит с книгой 24/7, но, когда есть свободное время не против подискутировать и обсудить, что-нибудь философское.","— Люди. Психология личности. Опять же информация. «Если бы Адам проводил время с Евой, она бы не разговаривала со Змеем», - Ворт считает, что «люди – сокровища», тот кто может использовать других по-настоящему силён.","— Немного рисует, он конечно не метит в Пикассо, но план здания, простенький портрет или натюрморт набросать может."],"features":["— В мире множество религий. Кто-то поклоняется – Богу, кто-то – деньгам. Адам же боготворит – информацию.","— Лжецам нужна хорошая память. Ворт не врёт, считает это ниже своего достоинства, зато профессионально недоговаривает.","— Часто использует слова и фразы на французском в разговоре.","— Любит детей, но боится снова связывать себя семейными узами с кем-либо."],"appearance":["— Телосложение худощавое, атлетичное. Рост 180 см, вес 74 кг. Лицо с выразительными чертами, строгие линии, что придаёт ему особый шарм и харизму. Кожа светлая или слегка смуглая, волосы русые, волнистые до плеч, глаза голубые.","Стиль в одежде свободный, не брезгует костюмами, но также горячо любит простые джинсы с футболкой, главное правило – свобода движений.","— Прототип – Кристофер Мэйсон Браун"]},"stats":{"Сила":3,"Ловкость":5,"Интеллект":5,"Харизма":4,"Восприятие":4},"tracks":[],"photo":"images/adam.jpg","archived":false},{"id":"aktay","name":"Актай Дархад","aka":["Aktay/Aktai Darkhad","Кай, Призрачная Орхидея/Ghost Orchid"],"age":["25 лет"],"role":["В прошлом хост, the guardian (night) flower со знанием английского, немецкого, китайского: путунхуа и кантонского, японского, корейского (а также монгольского и русского) языков с учётом ведения деловых переговоров. За консультациями касательно культурных аспектов также к нему. Повышен до Призрачной Орхидеи. Повышен до Садовника. Переквалифицирован в Дилера особого назначения, оставаясь при этом высшим цветком."],"orient":["гомо, пасс; милых дам, впрочем, тоже прекрасно развлекает."],"tags":["THE LAB"],"player":{"name":"置き去った 海岸","url":"https://vk.ru/vijddbdns"},"date":"28 мая в 1:50","epigraph":null,"sections":{"character":["— На первый взгляд производит впечатление человека флегматичного, холодного и эмоционально отстранённого. Редко повышает голос, почти всегда сохраняет спокойствие и умеет выглядеть собранным даже в откровенно неприятных ситуациях. Однако, будучи интровертом, тратит много сил на поддерживание социального образа, отчего внутри клана многим кажется чересчур прямолинейным и недружелюбным. Несмотря на внешнюю холодность, обладает высоким эмоциональным интеллектом, внимателен к деталям, осоьенно, когда дело касается тех, кому он хочет угодить: легко запоминает привычки, предпочтения и особенности окружающих, старается предугадывать желания заранее. Любит тихие разговоры, взгляды мельком, двусмысленные фразы и флирт на грани дозволенного, но терпеть не может, когда это всё оказывается промтой вежливостью или фальшью — убеждён, что за «игрой» должен стоять искренний интерес.","Чувствительность и меланхолию привык скрывать за сарказмом и своенравностью; ему зачастую куда проще выстраивать и поддерживать официально-деловые отношения, нежели близкие; очень плохо переносит чувство беспомощности и зависимого положения, хотя давно привык жить именно в таких условиях и будто бы даже получает от них удовольствие. Не любит жалость к себе и старается не демонстрировать слабость окружающим. Всё, что происходит внутри него, предпочитает переживать в одиночестве."],"biography":["— Родился где-то среди монгольских степей — в месте, где люди привыкли больше полагаться на погоду, животных и собственные руки, чем на удачу. В его деле это стараются лишний раз не упоминать: если клиент захочет миловидного китайца — он будет китайцем, японца — будет японцем. Будет делать вид, что родился среди каменных джунглей, хотя на самом деле детство его прошло среди пастбищ, старых машин, запаха пыли и бесконечного горизонта. В малолетстве стал свидетелем гибели собственной матери, после чего остался жить с отчимом, злоупотреблявшим алкоголем и регулярно проявлявшим насилие, пока не сбежал с единственным, кому доверял — Дамдином: авантюристом, вырвавшимся из золотой клетки, первым и единственным другом и позже возлюбленным. Амбиции, харизма и способность заводить знакомства сделали Дина движущей силой их тандема, в то время как Актай всё это калибровал и выжимал максимум возможностей; пожалуй, если бы не необходимость практиковать языки, к которым, как оказалось, у него была склонность, он мог бы замкнуться в себе намного глубже. За довольно короткий срок они успели поучаствовать в самых разных схемах и не заметили, как привлекли внимание людей, значительно превосходивших их по влиянию и возможностям. Актай, кажется, подходил на роль хоста чуть ли не по всем параметрам; а как известно, если таким местам оказывается нужен конкретный человек, то они всегда получают его — живым или мёртвым."],"ability":["— Способен очень быстро считывать ожидания собеседника и подстраивать под них речь, темп общения, жесты. Не столько врёт, сколько позволяет увидеть в нём то, что хотят увидеть.","— Разбирается в правилах рассадки, сервировке, дресс-кодах, искусстве поддерживать разговор и незаметно направлять его в нужную сторону. В силу необходимости подкован в темах, интересных большинству гостей: юриспруденции, истории, законодательстве и кухне разных стран и, конечно… «любви».","— При необходимости способен запомнить всё, что угодно: любимые напитки; аллергии; темы, к которым человек часто возвращается; музыку; украшения; привычки; особенности почерка и речи вплоть до мельчайших подробностей. Иногда помнит людей лучше, чем они сами.","— Может часами сохранять спокойное лицо, ровный голос и собранную осанку даже при сильной усталости, тревоге или воздействии алкоголя. Потом, правда, происходит эмоциональный «откат».","— Часто на автомате отмечает входы, камеры, расположение мебели, пути отхода, кто куда смотрел и кто с кем пришёл.","— Неплохо ориентируется в критических ситуациях и обладает довольно широким спектром неожиданных умений из-за того, что часто был вынужден рассчитывать только на себя: от оставшихся с детства, таких как обращение с лошадьми и охота из самодельного лука, до оказания первой помощи.","— Недавно был обучен стрельбе."],"weaknesses":["— Страдает от недиагностированных высокофункциональной депрессии и кптср.","— Зависимости: сигареты, алкоголь, наркотики, секс. Старается контролировать дозировки, но срывы случаются.","— Склонен эмоционально закрываться и избегать настоящей близости даже с теми, к кому привязывается.","— Крайне плохо переносит потерю контроля над ситуацией или собственным телом.","— Из-за хронического напряжения страдает бессонницей; несколько раз доходило до провалов в памяти."],"hobby":["— Каллиграфия.","— Чайное действо: китайское, японское, корейское.","— Чтение литературы и старых путевых заметок.","— Ночные поездки и прогулки, часто в одиночестве в силу обстоятельств.","— Коллекционирование впечатлений: фотографий и мелочей, связанных с разными местами и людьми."],"features":["— Не особо распространяется о своём реальном происхождении. Не любит, когда обращаются по настоящему имени.","— При сильной усталости может незаметно переходить с одного языка на другой прямо во время разговора.","— Любит фотографировать, но не фотографироваться.","— Цветочное имя получил от стоп-слова, о котором жоговорился с одним из своих клиентов.","— Не переносит запах лаванды.","— Любимый цветок — ирис."],"appearance":["— Юноша восточной внешности с изящным гибким телом. Актуальные данные: рост — 1.71 см, вес — 54 кг. Бледная кожа, миловидные черты лица и спокойный, часто несколько тяжёлый взгляд. Есть родинка на правом крыле носа. Носит пирсинг в ушах. В одежде предпочитает минимализм, тёмные оттенки и аккуратность, однако работа нередко требует более откровенных и провокационных образов. Не так давно осветлился в блонд. Также раньше носил длинные волосы.","- Kim Hyung Kwon."]},"stats":{"Сила":0,"Ловкость":4,"Интеллект":6,"Харизма":5,"Восприятие":5},"tracks":[],"photo":"images/aktay.jpg","archived":false},{"id":"estelle","name":"Алан","aka":["Эдвард Эванс | Edward Evans — настоящее имя, но лжёт, потому что может","Луч, Лучик, Ласточка","Маленький крупье"],"age":["Двадцать один год ⁞ 21 год."],"role":["Крупье."],"orient":["Гомосексуал."],"tags":["HORTUS"],"player":{"name":"Estelle Libertas","url":"https://vk.ru/shenjiu"},"date":"4 июл в 13:23","epigraph":null,"sections":{"character":["— Нервный, не особо хорошо сходится с людьми, в людях привередлив, часто раздражается, нередко утаивает что-то, в целом патологический лжец. Вспыльчивый, за языком следить не любит. Учитывая это, не гнушается двуличием при необходимости, ведь фильтровать речь в его деле очень важно, однако чем ближе ему человек, тем он раскованнее в своих язвительных фразах.","— Не афиширует предпочтения, но несмотря на это вступал в отношения, что чудо, ибо первый он не признаётся, а догадаться не то, чтобы просто. Любит элитный флирт, иногда идущий на грани ссоры. На самом деле тот ещё романтик.","— Некую симпатию к людям обычно проявляет через сарказм, издёвки и прочее. Неприязнь отражается в основном игнорированием, высокомерием, пренебрежением.","— Склонен осознанно и не осознанно вступать в нездоровые отношения, тянуться к сомнительным личностям, в целом хорошо справляется влипать в странные ситуации.","— Очень склонен к зависимостями. Сигареты, выпивка. Старается избегать того, что их вызывает. С курением просчитался и до сих пор решает проблему. Или не решает.","— Не извиняется прямо, не благодарит словами, предпочитая действия. Дотошный, душный, педантичный, имеет ряд крайне радикальных взглядом.","— Склонен уходить в свои мысли, быть излишне мечтательным. Сейчас, будучи более мрачным человеком, всё ещё нуждается во внимании и обществе, на самом деле любит общаться с людьми. Однако наоборот большую часть времени старается не привлекать внимания,","— Шаткие моральные принципы. Иногда изменяет своим принципам и ищет этому оправдания.","— Своенравный, горделивый, считает себя очень красивым. Но его гордость весьма гибка местами, слишком многое в поведении этого человека зависит от ситуации."],"biography":["— Ты их видишь? — вопрос, который он больше всего боялся услышать, но однажды услышал.","Но обо всём по порядку. Эта история весьма типична, не так ли? У нас тут солнечная Калифорния. Эдвард Эванс родился почти в самой обычной, немного зажиточной семье. Они жили всего лишь в фамильной усадьбе, держала пару-тройку лошадей, заодно конюшню, поле для стрельбы, а сам Эдвард и его брат-близнец ходили в элитную гимназию. Самая обычная семья.","Любящая мать-домохозяйка, не оставляющая быт даже учитывая прислугу, и отец. Отец? Простой блюститель закона, высокий чин в правоохранительных органах. Он занимался лицензированной охотой на дичь и любил стрелковое оружие: луки, арбалеты, пистолеты, ружья. Мальчик разделял любовь к конной езде, стрельбе из лука и фехтованию, а в гимназии часто ждал походов в тир. Эдвард проводил много времени с отцом на почве этого, а брат обычно присоединялся только если речь заходила о стрельбе, в редком случае о верховой езде. Хотя и без того совместного досуга у детей было немало.","Но даже самые ответственный взрослые, кажется, порой… Отключают голову. Иногда законы этому способствуют. Так два юных Эванса и получили охотничьи лицензии, чтобы выезжать на охоту с отцом. Конечно, всё не могло и дальше продолжаться хорошо. У любой банальной истории есть переломный момент. Самый обычный несчастный случай. Один из братьев пристрелил отца. Кто? Да какая разница, какой из, если винил себя каждый, словно он виновник?","Выяснить правду так и не удалось, при даче показаний оба мальчика брали ответственность на себя, желая отгородить от беды другого. Пусть Эвансы и были разными по характеру, они дружны и привязаны. Казалось, так и должно было быть дальше.","Отец скончался весьма удачно, ведь спустя пару дней вскрылось, что он работал на мафиозную группировку и торговал органами преступников, наркотиками, оружием и информацией прямо под носом полиции. Фальшивка. Более того, их мать думала, что выходит за богатого человека, но вся эта роскошь совсем не благодаря тому бизнесу, о котором она думала. И как можно было не заметить за столько лет в браке… Имущество изъяли, осталась мать да парочка близнецов, которым только стукнуло 12. И что теперь ей оставалось? Делать нечего, однушка, две работы, многие ведь так и живут. Вот только после джакузи к узкому душу привыкаешь с трудом. Из элитной гимназии в простую школу.","Ещё лет с пяти брат Эдварда вёл себя странно, сравнивая с другими детьми. Пока Эд познавал прелести социума, брат постоянно лепетал про какие-то голоса, образы, был нелюдимым, тихим. Пугало. И стало их общим секретом. Который вскоре они перестали обсуждать даже между собой, потому что Эдварда это слишком пугало. Всё обострилось после переезда, но они и дальше скрывали это от матери, не зная, что делать. Брату приходилось тяжелее, он часто был нестабилен, в школе так и не завёл близких знакомств, хотя их и в прежней было всего пару. Однажды на занятии брат вскочил, начав кричать на голоса в своей голове, отбиваться от кого-то, и его увели в мед. пункт. А следом приехала белая машина скорой помощи. Мама много и горько плакала.","Братья, будучи до этого учениками элитной гимназии, плохо вписывались в коллектив, иногда подвергались травле, но Эд вывозил благодаря своей харизме. Он был ярким, открытым. Хотя после был заклеймён братом психопата и отношение в коллективе к нему изменилось, однако ничего примечательного. С кем такого не случалось? Так в 14 лет Эдвард остался без самого близкого человека, брата, который в этом же году скончался в психиатрической лечебнице. У матери случился инсульт. Неврологические последствия для ног. Потеря ещё одного члена семьи была большим ударом для них обоих. Эдвард винил себя за трусость, за то, что не говорил об этом должным образом с братом.","И что дальше? Подработки. С пятнадцати лет юноша подрабатывал, с трудом убедив матушку дать согласие. Она шла на поправку, стала выглядеть лучше. Ненадолго. Лейкемия. Даже не на ранней стадии. Нужны были деньги, и срочно. Даже работая в чёрную куда больше отведённого максимума для школьников, этого было мало. Мало, мало… Долго.","Эдвард Эванс, 16 лет. Расходный материал группировки, рискуя своей свободой, раскидывал закладки. Он не мог позволить потерять связь с последним, кто у него остался. На друзей ведь времени больше не было. Даже мыслей. Центром жизни стало только получение денег и уход за матерью. Она начинала идти на поправку.","Эдвард Эванс, 17 лет, бармен в сети Падшая Ласточка, сирота с эмансипацией.","На деле же Лучик — незаменимый информатор Зари, преступной организации с размытыми целями, на которые ему было всё равно, пока сохраняется анонимность и хорошо платят. В деньгах больше не было такой нужды, но он остался работать там. Ведь их цели так же размыты, как и жизненный смысл после потери всего. Зачем это продолжается? На кой хер ему эти деньги? Эта жизнь? Время не лечит. Не притупляет боль. Но даёт немного возможности свыкнуться с мыслями.","Теперь и на личную жизнь нашлось время. Ещё одна череда банальных невезений, которые он предпочёл, как и все свои проблемы, всунуть в фразу «экая оказия». Яркая харизма, в юности затмевающая всех, добивала небесными глазами, но после смерти матери она постепенна тухла. Или начала тухнуть ещё после пропажи брата? Или же он сам желал померкнуть, затеряться в толпе, став лишь фоном для других? Фон это стены, и даже у стен есть уши.","На этом бурная история Ласточки из Зари только началась. Впереди было слишком много всего, что не уместиться на листах этой записной книжки. Неудачные отношения, появившиеся и теряющиеся близкие люди, душевное состояние, работа барменом, информатором и крупье. Четыре года бурной деятельности в Заре, финалом которых стал полный крах организации, конечно, без вины Луча.","Однако, стоит упомянуть ещё одно важное событие в его жизни. Брат-близнец увлекался политикой и трукрайм, тогда как сам Эдвард был от этого далёк. Однако брат иногда упоминал одну конкретную фигуру. Фокусник. Семь лет назад брата не стало, а после пропал и этот Фокусник. Тогда-то, в свои 14, пытаясь пережить потерю близкого человека, юноша хотел чуть лучше его понять. Но эта личность, его биография и слухи сильно завлекли юного Эда, сподвигнув на то, что в группировке он стал именно информатором. Стоило просто верить в свои способности, и они не подвели юнца. Зари не стало, и Эванс переехал в Монако четыре месяца назад. Лишь из-за слухов, что Фокусник здесь. Можно сказать, что парень им восхищался, в некотором роде. Так, как был способен проявлять восхищение. Пока он искал работу, появилось новое место. Думая о том, стоило ли в это ввязываться, Эдвард провёл немало ночей с мыслями над блокнотам. Но в итоге решил не испытывать судьбу и не ввязываться в группировку, у которой даже нет никакой репутации. Зато зарплата крупье его вполне устроила. Так спустя около месяца после открытия появился новый крупье. Старый почему-то уволился.","Новый рыжий крупье с бейджиком «Алан» чуть отличался от остальных. В этом мире фальши, блёсток, натянутых улыбок и лести он открывал небольшое окошко в «честность». Этот парень мог привлечь внимание и составить хорошую атмосферу ведущего игры своей серьёзностью, спокойность или уверенностью, от чего редкие шутки или что-то выбивающееся из привычного образа имели куда больший эмоциональный эффект. Словно он тот самый, кто не пытается обмануть, лишь бы вытянуть из гостей больше денег. Не забалтывает, но поддерживает умеренно диалоги. Была у этого Алана некоторая харизма, хотя если не приглядываться, его просто счесть с фоном.","Эдварда все эти года мучает один вопрос... Ответ на который ему никогда не сужено узнать. Что. Видел. Брат."],"ability":["— Прекрасно стреляет из лука, пистолета, АК-47, знаком с техниками фехтования, но не углублялся, отдав предпочтения самообороне при поножовщинах.","— Хорошо знает болевые точки, имеет отлично поставленный удар, действует техникой, а не силой. Концентрация не на сражение, а на самообороне и обезвреживание противника.","— Изучает на досуге китайский, сейчас его уровень криво-разговорный.","— Умён, хитёр, превосходный актёр, пусть иногда в силу юного возраста бывают осечки. Практикуется в манипулировании, результат его удовлетворяет.","— Идеальная кратковременная фотографическая память. На прочтённый текст, длинные комбинации цифр. Но от минуты до нескольких минут. Потом воспоминания притупляются. К примеру, один раз прочитав 12 цифр, сможет разом спокойно их повторить.","— Очень быстро бегает, а если побег на адреналине, то бежать можно долго; ловкий. Особенно ловкие руки, пальцы натренированы, у них очень сильный хват. Спасибо бытности барменом, крупье и владельца собаки.","— Имеет ловкий не только ум и физически, но и пальцы. Прекрасно тасует карты, может подтасовать хорошие или плохие карты по желанию, но никому не раскрывает этого, действует осторожно."],"weaknesses":["— Хорошо помнит давние события, но свежие быстро ускользают, если не записать, за исключением особо важного. Выборочная память.","— Физически никуда не годится, если речь идёт о силе.","— Совмещает в себе много противоречий, так что он не только ловкий, но и неуклюжий. Это друг друга компенсирует: часто роняет вещи, но почти не разбивает, нередко спотыкается, но умудряется не падать.","— Проблемы с вестибулярным аппаратом, очень укачивает в транспортах, иногда может терять равновесие.","— В некоторых аспектах может быть очень ведомым, всё зависит от ситуации.","— Пониженное давление, анемия, никотиновая зависимость, пристрастия к алкоголю.","— Есть немалый спектр фобий."],"hobby":["— Ведёт подробный личный дневник с шифром, который придумал сам: цифры, буквы, иероглифы, рисунки и разные символы для сторонних не сложатся в целостную картину. Шуршание грифа карандаша по бумаге успокаивает.","— Иногда изучает китайский, пишет стихи, занимается живописью или слушает музыку.","— Стрельба, конная езда.","— Чтение. Именно печатных книг"],"features":["— Гей, но любит женщин. Они привлекают его визуально и своим эстетичным видом. В целом сильно лучше относится к девушкам и готов им многое позволить, как будто его гордость работает в основном на мужчин. Хотя зависит от ситуации.","— Не силён в психологии, мало её изучал, часто действует по наитию и попадает в цель.","— Каждый — потенциальный враг, угроза, в теории способная на что угодно. Но может легко сложится впечатление, что Эдвард об этом не думает.","— Не чурается переспать с кем-то симпатичным ради личной выгоды, если не брезгует человеком. А иногда и без выгоды. Секс это вам не доверительные партнёрские отношения строить, с ним всё проще. Однако без образа недотроги жизнь была бы уже не та.","— Старается не выделяться, но каким-то образом обычно это работает в обратную сторону. Так же из желания привлекать меньше внимания обычно ходит с небольшой «маскировкой».","— Обычно носит просторную, мешковатую одежду, не подчёркивающую фигуру, майки не носит вообще. Не стесняется своего тела, но не хочет его показывать лишним людям. В целом к своей внешности относится серытно и интимно, словно это что-то для него и малого круг лиц. Что-то сокровенное, что хочется выставить напоказ лишь изредко. Вместе с любовью к худи, в которых можно уютно утонуть, обожаю всевозможные цацки, а так же строгие костюмы. Без ума от рубашек, галстуков, пиджаков, брюк, ремней и этих строгих классических туфель. Считает это до крайнего эстетичным и куда более привлекательным, чем иная одежда. Хотя женщины в роскошных платьях, вечерних, бальных или с рюшами и бантами ему тоже страсть как нравятся. Тот ещё любитель визуала, эстет, в целом просвечивается натура аристократа.","— Всегда на руках хотя бы одно кольцо и какой-то браслет, меньше точно нет. За исключением нахождения на работе, крупье он без колец.","— Старательно следит за здоровьем, имеет хороший иммунитет, крепкие кости, но физической активностью часто пренебрегает, старается быть осторожен, ибо в зоне риска случайных вывихов из-за того, что не уделяет время мышцам.","— Проблемы со сном. Не может нормально спать по ночам если он один, пёс не в счёт. Быстро засыпает в любом месте и положении, если это не намеренно.","— На виллу переехал с золотым ретривером по имени Рэки. Крайне умный пёс, знающий очень много команд.","— С детства любит животных, часто подкармливал и втягивал в это брата. Сейчас питает к животным больше симпатии, чем к людям."],"appearance":["171 см. | 51 кг.","Имеет густые, прямые, непослушные волосы цвета ведьмовского, рыжего, но неопрятно это не смотрится; чёлка часто прикрывает лицо. Густотой ресниц тоже не обделили. Брови не тонкие, но смотрятся гармонично. Карие глаза. Резкие, но красивые черты лица. Немного вздёрнутый нос, чуть пухлая нижняя губа. Светлая, чистая кожа. Губы часто сухие, в мелких ранках, ибо не может перестать их кусать.","За этой внешностью скрываются благородные кудри, небесные яркие глаза и россыпь веснушек по светлой коже. Худощавое тело на вид кажется хрупким, но тонкие кисти рук и пальцы не смотрятся женственно. На бледной коже, особенно на руках, ярко видно синеватые вены. Иногда кожа рук может переливаться голубоватым оттенком, если уровень железа резко падает или на дворе зима. Кожа очень холодная из-за анемии, особенно руки. Иногда они ни чем не теплее бутылки их холодильника. Россыпь веснушек покрывает нос, скулы, щёки, немного переходя к низу челюсти и на лоб. Так же спину, особенно плечи и ниже, спускаясь плавно к району лопаток. Немного веснушек есть от плеча до локтя, на бёдрах, на ягодицах чуть больше.","Бледная кожа очень быстро пигментируется. На солнце не загорает, а сразу сгорает. При проявлении эмоций, например радости или смущении лицо быстро наливается краской, даже если стыд не велик. Под глазами синяки оформили постоянную прописку. Но и румянец, и синяки, и веснушки надёжно прикрыты хорошим тональным кремом. В целом заметить, что он накрашен, это задача со звёздочкой. Косметика хорошая, без умывашек стереть или смыть её трудно, дождь и прикосновения не помеха.","—Oliver Hayes. Только частично, только в представленном в анкете варианте."]},"stats":{"Сила":1,"Ловкость":4,"Интеллект":5,"Харизма":6,"Восприятие":4},"tracks":["Тревога — DenDerty, МОЛОДОСТЬ ВНУТРИ","Каждый справляется сам — Asper X","Скоро узнаешь — Asper X","The Phoenix — Fall Out Boy","Courtesy Call — Thousand Foot Krutch","Leave It All Behind — Cult to Follow","Антидепрессант — FIZICA","I Can't Decide — Scissor Sisters","Teeth — 5 Seconds of Summer","Чего хотел добиться ты — ADDicted!"],"ageShort":"21 год","photo":"images/estelle.jpg","archived":false},{"id":"koller","name":"Александр Коллер","aka":["Alexander Koller — имя, фигурирующее во всех поддельных документах и информационном поле клана","Алессандро Джованни — настоящее, тщательно скрываемое от любопытных ушей","Алекс, Алек, Лекс"],"age":["32 года, крайне хорошо сохранился для своего возраста – чудеса богатства"],"role":["один из партнеров клана и крупный поставщик всего самого разного – контрабанда"],"orient":["всеяден | женатый мужчина, ориентация – кольцо на пальце"],"tags":["THE BASE"],"player":{"name":"'silvery 'moon","url":"https://vk.ru/meowwaf"},"date":"7 авг в 2:43","epigraph":null,"sections":{"character":["« где мое сердце? »","это зеркальный лабиринт с сотней отражений одного и того же в бесчисленных зеркалах, искажающих правду с каждой новой гладью, отчего конечный образ кажется совершенно иным, нежели тот первый, считающийся давно утерянным даже самим хозяином, потерявшимся в самых дебрях своих же масок и ролей, став лишь отражением себя какого-то-там-тысяча-первого.","бесконечный круговорот лжи – вот весь алекс, пропитанный отравленными смутой словами до каждой косточки бренного тела. а отсюда и грехи, захлестнувшие его когда-то очень давно, и сейчас сопровождая потерянную душу до самих врат своего дома. гордыня в тиши шепчет на ухо все, что только пожелает, превознося мужчину над всеми на какие-то жалкие мгновения, а после спуститься с небес боле невозможно, остается лишь и дальше поддерживать свой наигранный статус, призрачную веру в лучший-из-лучших. кто говорил, что чем старше, тем мудрее? глупости, алекс стал только еще наивнее, веря в непоколебимые силу и власть, данные ему благодаря очередному прожитому году в прогнившем криминальном мире.","вера — лишь в себя, самого и любимого, ведь люди предают. предают все вокруг, а он себя — нет. идеалы, похожие на хорошую сказку — вот что имеет вес для него. сколько опыта он получил на грязных улицах и в грязных сделках, дабы вынести эту простую истину для себя? бесчисленное множество, от которого пора было бы сойти с ума — может, лекс давно это и сделал, просто упустил из виду, все продолжая играть роль .нормального. по меркам слепого общества.","он — обложка, пустая оболочка, как красивая цветастая конфета, манящая людей своей яркостью, будто свет ночных мотыльков, вот только в фантике они находят свое первое разочарование в жизни — пустоту, а мотыльки — конец этой самой жизни. алек и есть обе составляющие: пленительная пустота, дарящая лишь погибель сразу же, как наивные глупцы поведутся на глубину и честность действий. обман самое привычное для него, настолько, что уже и сам понять не может где ложь, а где истина. от всего ли сердца, как он говорит, желает помочь, или вновь, где-то на затворках сознания, уже анализирует всю выгоду от и до, получаемую из-за энергозатрат на определенного человека.","«просто так» не бывает, точно не у коллера, который после возьмет цену в два раза больше, чем стоила его услуга. еще один неприятный порок, с которым он не то, что не хочет справляться, наоборот, считает своим достоинством — манипулятор до мозга костей, играющий на чужих нервах и чувствах будто те были струнами от арфы, перебирая пальцами столь искусно и легко, чаруя окружающих, что никто и не видит всего того зла, что свершается прямо у них на глазах. но разве все так плохо, как может показаться? алекс не знает, вообще, полностью и безоговорочно, иногда находя в своей пустоте странный отклик то на одно, то на другое, заставляющее губы растягиваться в еще более ядовитой улыбке. яд — его оружие, а добрая улыбка — щит, прячущая слабые места за собой. панцирь, пробить который, казалось, было уже невозможно, если бы не одно но. «но» в виде новой слабости, привязанности, которую коллер так старательно пытался избежать, зная, как легко конкуренты могут сыграть на этом в нужную им игру. доигрался до такой степени, что стал зависим, продолжая отрицать то и плеваться ядом во всех, кто попытается хотя бы приблизиться к нему ;"],"biography":["[ из финансового обозрения «il sole 24 ore», турин ]","«...династия джованни — европейская банковская элита. старинный род, ведущий свои дела с незапамятных времен в самом сердце италии. семейное дело, тесно переплетающиеся с бескрайними водами венеции и звона золота в банковских ячейках. династия славится количеством выдающихся личностей и их стартом: блестящее образование в старейших заведениях европы делает из них выдающихся политиков, дипломатов и ученых...»","[ из оперативного досье dea (департамент по борьбе с наркотиками), майами ]","« имя «александр коллер» появилось меньше двух лет назад. малец впервые попался на крючок еще в стенах своего же университета – дело замяли, все забыли, никому нет дела до этих богатых снобов, живущих по собственным законам. »","« второй раз мелькнуло в делах куда более крупных: груз нашли на одном из кораблей при случайной проверке. тогда и стало ясно: прошлое было пробным взмахом пера, сейчас же некто ввязывается в дела поприбыльнее – контрабанду между ведущими штатами сша. »","« все долго праздновали, когда обороты незаконной деятельности по штатам резко сократились – огромная тонна информации, поступившая от неизвестного отправителя, быстро разошлась по законодательным органам, помогая отловить всех неугодных.","имени «александр коллер» там не имелось. поверили слухам, списали: кто-то говорил сбежал, как крыса с тонущего корабля; кто-то говорил не пережил покушения, о котором медленно ползли шепотки меж темных переулков; кто-то вовсе предположил, что посадили на цепь, вписав имя в без вести провашие. »","[ вырезка из светской хроники «vogue italia», светский прием в риме ]","«...помолвка года! член старинного рода джованни вернулся из штатов в италию, дабы попросить благословения семьи на брак с наследницей востока, одной из принцесс черного золота. роман, вспыхнувший еще в стенах лиги плюща, завершился пышной свадьбой. »","[ из вырезок частных детективов семей ]","«…во время его прибытия в италию был установлен контакт с опасным субьектом. кажется, это их первое знакомство(и последнее, есть надежда) с лиардом эдером. не ясно, знают ли они о том, кто кем является, но на первый взгляд нашли общий язык. вот уже на протяжении нескольких вечеров ведут беседы в одном из мишленовских ресторанов. будем продолжать наблюдение. »","« это деловой обмен: пять на пять процентов. теперь его жена имеет свою долю в банковском бизнесе семьи джованни, а он – пять процентов в нефтедобывающем ее семьи. залог успешного брака. не любовь – только количество нулей на счетах. и вес на политической арене. »","«…она уже, кажется, ждет первенца. а свадьба была всего-то полгода назад. да, их семьи пойдут на все, чтобы как можно быстрее и крепче укрепить этот союз. интересно, ребенок тоже входил в пакет документов и договоренностей или…? »","[ случайный разговор охраны порта, монако ]","«…ага, тот одноглазый часто ошивается на во-он той яхте, видишь? по ощущениям единственный гость на этой ласточке, не считая иногда самой команды. но они с владельцем странно выглядят: этот одноглазый больно несчастный, а второй слишком богатый. будь у меня такие друзья: светился бы от счастья. как думаешь, этот работает на него или что-то другое? »","[ из разговоров детективов полиции, монако ]","«…да-да, уже понятно, что это наш потеряшка. и он снова, кажется, во что-то ввязался. контрабанда? как предсказуемо. хотя если верить тем материалам, у него там знакомец, да? связи? у человека есть все и дальше больше, чего уж не сидит на месте? нет, не заводи дело. заводили уже – это бесполезно. есть сила посильнее наручников и деревянного молотка – деньги. »"],"ability":["— прекрасный аналитик: что в ситуациях бизнеса, что в самой жизни. умеет взвешивать все риски за секунды и быстро принимать определенные решения для разрешения возникших ситуаций","— большой набор прав(и человеческих в том числе): начиная от транспорта наземного, заканчивая водным и даже немного воздушным","— невероятный ораторские способности не оставляют ни одного партнера по бизнесу равнодушным","— полиглот. в совершенстве владеет французским, итальянским и их времен испытывает на прочность всю финансовую систему клана, в том числе и уважаемого финансиста, привнося в скучные счет-фактуры невероятно интересные цифры – в свою пользу, разумеется","— и все же отыгранное в финансах возвращается с совершенно иной стороны – частый гость лабораторных исследований, не так давно пришедший на консультацию к главному химику и оставшись в сия рядах в качестве частного пациента. что надобно – врачебная тайна","— обитает на своей белоснежной яхте в прибрежных водах монако; зачастую собственное отсутствие описывает просто, с налетом шутки: на сушу позволено выходить лишь раз в десять лет"],"appearance":["— метр восемьдесят четыре на семьдесят кило. самое отличающееся и яркое в нем – глаза; ярко-голубые, смотрящие всегда с особой хитринкой, не сулящей ничего хорошего собеседнику. да и сохранился для своих лет хорошо, чем определенно гордится.","— maxence danet-fauvel"]},"stats":{"Ловкость":6,"Интеллект":8,"Харизма":6},"tracks":["Let It Bleed (feat. Cristina Gatti) — Unlike Pluto feat. Cristina Gatti","Everybody Gets High — MISSIO","The Devil You Know — Kovacs","Me and the Devil — Soap&Skin"],"ageShort":"32 года","photo":"images/koller.jpg","archived":false},{"id":"alexandra-ptichkina","name":"Александра Николаевна Птичкина","aka":["Sasha Fogel","Фогель","«Хайзенберг»","«безумная русская»","«харли квин»","«мисс смирнофф»"],"tags":["THE LAB"],"age":["32"],"role":["Не то чтобы гениальный... Хотя, да! Химик-художник, она работает с элементами, производными и соединениями, как с произведением искусства. В трудовой у нее записи нет, поэтому ее должность знает только тот, кто ведет учет кадров и платит кэш. Она вообще против каких либо отметок в паспорте, документах, на венах и прочее. Избегающий тип привязанности пшнх."],"orient":["По степени опьянения и на спор. Нас так воспитывали, кто слабее, тот и девочка, ебаш хардкор."],"player":{"name":"Sasha Fogel","url":"https://vk.ru/id300593099"},"date":"9 сен в 17:17","epigraph":null,"sections":{"character":["Характер скверный. Не женат.","Саша либо нравится и цепляет сразу, либо вы достаете ствол, но тут тоже два варианта.","Говорит то, что думает, чувство страха на уровне между медоедом и атомным ледоколом. Ей нахой не нужен этот мир, а вот мир в ней нуждается, поэтому семь невротичных-тревожников ангелов-хранителей берегут эту суицидницу от бед. Она трудоголик, ебейший трудоголик. Заеби весь мир, задрочи отдел снабжения, но принеси боссу очередную конфэту с видом кошки-добытчитцы и фирменным \"я сделяль\". Может вести себя прилично, если босс очень попросит и грядет проверка какая-то или бугры какие важные приезжают, тогда она все по форме, такая лапа платье-футляр, шпильки, прическа, томный взгляд. Так ее пару раз путали с эскортом и потом самому начальнику приходилось оттаскивать Сашу от обидчика.","Друзья... Ну, тут как бы, как в детском садике: \"о, у тебя футболка с дикаприо, давай дружить\". Отношения старается дополнительно не усложнять да-да, нет-нет, хоть и отбитая, но, если человек дорог, она фильтрует сквозь промышленные фильтры и бережет отношения.","Начальству не подлизывает, но и не борзеет, понимает, что можно и что нельзя.","Умеет признавать свои ошибки и учиться на них."],"biography":["Олимпиадница и медалистка МГУ, которая выиграла гринкарту ба-дум-тсс!","Приехала в Америку такая Александра Николаевна, а разговоров то было! Вместо вкусного куска пирога, как в фильмах — говна кусок. Бесячая страна бездарей и жопоруков, но да, заработать можно. Быстро поняла, что ее фарм и биохимический талант  интересен большим нехорошим дядям, которые платят много денег. Сашка не алчная, деньги для нее способ помощи родным в Подольске, которые искренне думают, что она ебашит за троих в этой своей Америке.","Ну ебашит, положим, она за троих — это да. Искренне считает, что мусор выносит сам себя и абсолютно не стесняется и не чувствует угрызений совести по поводу своей деятельности. Спит, как младенец, только сопит из-за кривой перегородки.","Максимально селфмейд персон, еще и харизматичная сука, которая умеет себя преподать и продать. Ну вы видите, да (пизда) ?","И да, из грязи в князи, ведь пребывает мисс Птичкина в качестве мяса для пополнения клеток. Бойцы накрыли левую лабораторию по варке мета, где работала ваша (не) покорная слуга."],"ability":["Кто на что учился. Я на пятерки, а ты хорош в физкультуре. Из всех спортов предпочитает: литрболл, секс и плавание. Иногда делает эти виды спорта командными. Обожает видеоигры, но это тоже не спорт... Ладно. Я старалась.","170 см — единственный параметр, который вам нужно знать. Рост. Все."],"weaknesses":["Шейно-воротниковый отдел, спина, поясница, колени... Ну это база. У всех они сбоят при сидяче-пердячей работе. На нее не действует обезбол и пьянеет она медленно или вообще не берет из-за монструозных ферментов печени, которые расщепляют, блять, даже грехи. Оззи Осборн гордился бы ей.","И лекарства тоже не все берут или лошадиными дозами, поэтому, если болеет, то это мед, лимон, водка и Каневский."],"hobby":["Что за пункт, вообще? Я взрослая женщина, которая ебашит 24/7, какое хобби, кроме спать, жрать и срать вы от меня хотите?","Ладно, люблю залипнуть в сериал и погамать — это хобби или способ не убивать людей?"],"features":["По фактам:","— не водит автомобиль (не умеет и не хочет учиться) ;","— укачивает в этой ебучей машине;","— не то, чтобы экономит, но просто мало тратит: ее базовый минимум очень минимум и очень базовый;","— обожает интровертов;","— юмор, да, если ты умеешь клево шутить, то это пропуск в трусики;","— пить пиво, смотреть тв, тусить в баре — это база;","— не мастер боевых единоборств, но борзая и может втащить, она дитя 90х в зарождающейся РФ, пфуле;","— намеки не любит, сама не намекает;","— в бытовом плане очень подкована, может поменять кран, починить розетку, сварить борщ, заштопать одежду — заводские настройки."],"appearance":["Прототип внешности Лорен Джерман."]},"stats":{"Сила":1,"Ловкость":1,"Интеллект":8,"Харизма":6,"Восприятие":4},"tracks":["Танцуй! — Ляпис Трубецкой"],"photo":"images/alexandra-ptichkina.jpg","archived":false},{"id":"aron","name":"Арон Крик","aka":["Aron Krik","Пак Ён-Джин | Park Young-Jin — настоящее имя, предпочитает никому не называть и забыть о нём"],"age":["24."],"role":["член группировки ШАН: наёмник, убийца и делаетель всякой грязной работы."],"orient":["бисексуал."],"tags":["TARGET ELIMINATION"],"player":{"name":"Aron Krik","url":"https://vk.ru/id1115789716"},"date":"21 мая в 18:22","epigraph":null,"sections":{"character":["— Изначально достаточно недисциплинированный, нетерпеливый и импульсивный. Рискованное поведение, частые драки, невозможность наладить социальные контакты без конфликтов - таким ребенком он был. Арону всегда говорили: \"Тебе не хватает дисциплины. Тебе следует больше слушать взрослых\". И конечно же он на хую вертел эти блядские советы. После того, как попал в группировку, он научился выполнять приказы и сдерживать свою неуёмную натуру (на какое-то время). Периодически нуждается в эмоциональной разгрузке, из-за чего может злоупотреблять алкоголем, но сторонится накротических веществ. Склонен к саморазрушению из-за скуки, но благодаря работе на группировку понял, что можно разрушать других за деньги и отъебаться от себя. Именно так он нашёл собственный баланс, который помогает ему не упасть на самое дно. Сейчас он вполне может сойти за нормального члена общества, пусть и немного быдловатого. Не доверяет людям."],"biography":["— Ён-Джин - имя, которым он больше никогда себя не назовёт - родился в небольшом корейском городке, название которого с удовольствием забыл. Он держался на одном градообразующем предприятии, которое со времнем схлопнулось. Тут-то и начался самый пиздец. Лишившийся работы отец запил, в его поведении всё чаще наблюдалась агрессия, рукоприкладство. Мать же не могла никуда деться, не в силах вытащить на себе сразу четырёх детей, хотя надо было думать головой, прежде чем планировать большую семью. Нищета и проблемы в семье стали ещё одной отправной точкой. Арона, как самого старшего, отправили к родственнику в Мьянму, где его приютил дядя по отцовской линии. Родители не знали, что он занимается не вполне легальными делишками, куда постепенно втянулось и их чадо. Откровенно говоря, поебать им было на то, во что втягивается их тринадцатилетний сын. Минус одна проблема. Они ни разу не приехали в гости и звонили только по праздникам, а позже забили даже на поздравление с днем рождения.","Сначала он был кем-то вроде курьера. Пару раз участвовал в показательных дебошах банды. Арон правда старался. Он хотел быть своим хоть где-то, если его собственная семья решила выкинуть его, как сраного отброса. И его усилия не были напрасны. Он рос, учился отстаивать себя, вливался в банду, доказывал свою верность и наконец из странной хаотичной массы слепили е г о.","Арон тот, кто приходил за должниками с оружием наперевес. Тот, кого не интересовало, у кого он отбирает жизнь. Однажды он убил собаку владельца закусочной, который не хотел платить ренту, и подбросил её трупик ему в качестве придверного коврика. Никто точно не знает точно, сколько людских жизней на его счету. Может, две? Или двенадцать? Или больше...","Наконец он где-то стал своим. Почувствовал себя дома, где его принимают таким, какой он есть и платил за это верностью, готов был отдать собственную жизнь. Именно поэтому он был среди тех, кто отправился в Монако."],"ability":["— Не обладает большими умственными способностями, но компенсирует это отличными инстинктами выживания в любых ситуациях, базовыми знаниями о том, что делать при пулевых, ножевых и других ранениях. Отличный боец. Владеет техниками рукопашного боя, неплохо управляется с огнестрелом, но в ближнем бою предпочитает использовать небольшой нож.","Считает, что самый безопасный носитель ценной информации - его собственный мозг, поэтому имеет достаточно хорошую память."],"weaknesses":["— Не умеет выстраивать близкий контакт с людьми, просто не научившись этому с детства.","— Плохо переносит одиночество, называя его \"скукой\".","— Алкоголь и сигареты. Боится однажды пересесть на наркотики.","— Не любит (читать как \"боится\") детей.","— Всё ещё импульсивен время от времени."],"hobby":["— Обожает мотоциклы и скорость.","— Коллекционирует зажигалки.","— Научился неплохо готовить корейскую уличную еду."],"features":["— Имеет несколько шрамов после особенно трудных вылазок, но кое-какие из них селфхарм. Придаёт символизм каждой своей татуировке, но не любит говорить об этом.","— Несколько раз просыпался в неизвестных местах. Акоголь до хорошего не доведет."],"appearance":["— Рост 181 см. Вес около 75 кг. Предпочитает удобную, но по настроению может напялить рубашку и брюки. Питает слабость к небольшим украшениям в виде цепочек, колец, иногда носит серьги.","— DPR IAN."]},"stats":{"Сила":6,"Ловкость":5,"Интеллект":2,"Харизма":3,"Восприятие":4},"tracks":[],"photo":"images/aron.jpg","archived":false},{"id":"artur","name":"Артур Станкевич","aka":["Artur Stankevich"],"age":["28 лет"],"role":["Консул Target"],"orient":["Бисексуал"],"tags":["ADMINISTRATION"],"player":{"name":"Артур Станкевич","url":"https://vk.ru/id_moriarty5ex"},"date":"24 мар в 17:25","epigraph":null,"sections":{"character":["Уверенный, одержимый контролем: ошибки для него недопустимы, каждое действие просчитано заранее. Он внимательно анализирует всё вокруг, разбирая ситуацию на детали, считая что слабость ведёт к провалу. Дисциплинированный и исполнительный, не задает вопросов. Его харизма сочетает силу и холодный расчёт, внутренний огонь скрыт за спокойной маской. Не любит хаос в голове, предпочитает держаться в тени, наблюдать, собирать информацию, находить слабые места и действовать только тогда, когда уверен. Лоялен к близкому кругу общения, эти люди для него уже предсказуемы, но эмпатии от него не дождешься: редко поддерживает словами, полагаясь на дела. Не любит оставаться в долгу, предпочитая справляться самостоятельно. Артур не мечтает о троне — контроль над хаосом его единственная страсть, а мафия идеальная арена для этого."],"biography":["Родился в промышленном районе, в семье, где отец работал охранником на заводе, а мать шила на дому. С детства он видел, как слабость приводит к нищете: отец терпел унижения от начальства, пока не сломался от алкоголя. В 14 лет прошёл боевое крещение улицы и ввязался в первую драку за защиту младшего брата, заработав первый шрам и уважение шпаны. К 18 годам он уже вкалывал вышибалой в подпольных клубах, где научился читать людей по взгляду и жестам, оттачивая инстинкт выживания.","В 22 года переломный момент, спасение жизни мелкого мафиози от группировки. Не из лояльности, а потому что увидел выгоду. Тот ввел его в структуру семьи под контролем босса, где Артур быстро поднялся от рядового бойца до главы безопасности, заработав репутацию участвуя, не только в операциях по захвату, но и боях без правил. Его татуировки — метки побед, шея для предателей, руки для тех, кто пал от его кулаков. Он анализировал маршруты, слабости телохранителей врагов.","Через 5 лет его семья раздробилась из-за смерти главы и на данный момент предоставлен самому себе, только лишь получая по старым связям заказы на устранение и год избегал чего-то стабильного, будь то жилье или работа. Несколько стран было объезженно, и репутация уже начала работать на него. Через связи с Мьянмой, перепала пара заказов на перевоз грузов с обеспечением безопасности. Во время заказов пару раз пересекался с Аароном и только после рекомендаций со стороны, от него поступило предложение вновь закрепить пристанище."],"ability":["Физические способности на уверенном уровне, не видит смысла в надутых мышцах, тело всегда затачивал на мобильность, выносливость и функциональность.","Умственные способности среднестаститические, в гении не метит."],"weaknesses":["Из слабостей: с левой руки стреляет паршиво. Уязвимость, которую он скрывает за двойной бдительностью. Оратор из него так себе — лаконичен, без лишних слов, собеседник, полагающийся на взгляд и паузы, а не на красноречие.","К новым технологиями приспосабливается крайне не уверенно."],"hobby":["Сбор информации и досье о людях","Рыбалка","Участие в боях без правил"],"appearance":["Внешность его непритязательна и гармонична: рост 183 см, вес 86 кг. В одежде он отдает предпочтение практичной элегантности — берцы с надежной фиксацией голени, преобладающие темные тона, спортивная куртка поверх майки или лонгслива, а также штаны с множеством вместительных карманов.","Прототип: Чхве Сан"]},"stats":{"Сила":6,"Ловкость":6,"Интеллект":2,"Харизма":5,"Восприятие":1},"tracks":[],"photo":"images/artur.jpg","archived":false},{"id":"astor-moreau","name":"Астор Готье Моро","aka":["Astor Gautier Moreau","Колетт"],"tags":["THE LAB"],"age":["41 год"],"role":["психоаналитик / психиатр","возможно персональная головная боль"],"orient":["грейсексуален."],"player":{"name":"'dr 'mengele","url":"https://vk.ru/margoth_white"},"date":"28 сен в 0:06","epigraph":null,"sections":{"character":["Среди остальных членов семьи он действительно выглядит частично отстраненным и молчаливым, но все равно всех слышит. И если надо сыграть роль, то это сделает. Главное доказать более старшим, тем, кто на должности давно, что он оказался среди профессионалов не просто за красивые глазки, а ради собственных амбиций.","Выходит так, что мужчина спокоен. Можно также его назвать меланхоликом, интровертом, сидящим среди своей противоположности и наблюдающим. Улыбается он из-за уважения к каждому человеку, даже незнакомцу. В виду, возможно, профессиональной этики, потому как не разграничивает людей ни по какому признаку. Слушать нужно каждого, но слышать вот...","В моменты, когда стараются всячески надавить на больную мозоль прошлого, может злиться, но всегда будет это выглядить аккуратным изгибом губ и речью, давящей своей добротой. Самые внимательные могут поймать эту смену эмоций и желаний прибить через жесты. Обычно это или касание большим пальцем до губы и потирание, или перестукивание по поверхности.","Немного может фантазер. Без подобного сойти с ума куда быстрее, потому в моменты апатичности Готье как будто меняют, а он сам уже едет или к морю, или куда-то ещё. С фотоаппаратом и термосом. Безумные поступки имеют место быть, чтобы не сойти с ума.","Ставит разум выше чувств, но не всегда выходит. Точнее, не выходило, пока не стало семьи. И есть страх перед новыми отношениями, о котором не будет открыто выражаться. Терпит, улыбается, а потом в тишине и одиночестве корит себя за слабость.","Суровость, жестокость, чётко поставленный голос. И это может быть как раз не актёрской игрой ради спасения знаний и тех тайн, которые не должны выползти наружу. Астор имеет две стороны : невинность в справедливости и противоположное - дьявольская мания разрушать чужие ходы. Из-за этого вылезает циничность.","Мировоззрение чаще всего сохраняется нейтралитетом, выгораживая себя от чужих мнений. Есть лично его мнение, а если от других слышит нечто навязываемое, то старается не прислушиваться. И не делает, особенно если сказали в приказном тоне. Может выступить в роли защитника или агрессора, если того требует ситуация. Немного сангвиник, немного холерик. Амбиверт, хотя большей частью преобладает интровертность.","Привычка работать в тишине, ну или почти в ней. Его беспорядок — его личный. У Астора свой принцип систематики в вещах, так что лучше не трогать хаотичный беспорядок. Также привык к тому, что хотя бы за сутки до назначенного времени предупреждали о событиях, об их назначении или об отмене."],"biography":["Франция, Марсель. Мама — Мари Дюбуа, художница. Отец, Венсан, был хирургом. Есть еще бабушка, писатель, потому кем могут стать близнецы, уже было известно. В таком союзе рождение ребёнка и воспитание в сдержанной строгости — стандартная практика. Одно но: родились близнецы. Уникальные мальчики, сиамские. Кто-то принял даже за уродов в первые минуты появления на свет, только это удержит от родительского шага и выбора? Первые года оказались тяжёлыми, особенно из-за вечных поисков нужных
