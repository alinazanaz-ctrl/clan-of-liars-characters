ку, если не понимаешь, что он испытывает. Отец в течение многих лет вёл закрытый исследовательский дневник, посвящённый зависимостям. В рамках этих записей он сознательно и под строгим контролем экспериментировал с различными психоактивными веществами, фиксируя изменения восприятия, мышления и эмоционального состояния. Хантер случайно обнаружил эти записи ещё подростком. Вместо шока он испытал восхищение точностью наблюдений. Дневники оказали на него огромное влияние: именно тогда у него сформировалось убеждение, что человеческий опыт можно изучать как биологическое явление, не прибегая к моральным оценкам. Позже он неоднократно перечитывал эти материалы, называя их наиболее честным медицинским исследованием, которое ему доводилось видеть.","США, Луизиана. Детство Хантера прошло среди контрастов американского Юга: религиозные общины, уличная преступность, наркотики, бездомные животные и люди, которым не помогали ни полиция, ни медицина. С ранних лет Хантер видел, насколько хрупким является человеческое тело и насколько легко ломается человеческая психика. Работы у родителей всегда было много, денег — не особо: большинство пациентов просто не способны были заплатить столько, сколько просят в других штатах и в целом по стране; иногда, входя в положение, они могли взять так мало, что это справедливее было бы назвать волонтёрством.","Получил медицинское образование значительно раньше большинства коллег. Во время обучения заработал репутацию блестящего хирурга и крайне неприятного человека. Несколько лет работал в травматологии и экстренной хирургии, но позже исчез из официальной медицинской системы; тогда же его имя начало всплывать рядом с подпольными клиниками, незаконными исследованиями и случаями, которые предпочитали не расследовать.","В Клан попал, очевидно, благодаря своим навыкам. Некоторые старые документы содержат следы раннего периода жизни, который сам Хантер предпочитает не обсуждать. Он относится к собственному прошлому как к неудачному черновику, давно уничтоженному и не представляющему практической ценности."],"ability":["— энциклопедические знания анатомии человека, огромный медицинский и хирургический опыт для своего возраста. Широко известен в узких кругах и чаще это его пытается заинтересовать работой, нежели он сам её ищет.","— способен диагностировать многие травмы и заболевания по визуальным признакам.","— исключительно высокая стрессоустойчивость, точные и уверенные движения рук даже в экстремальных условиях.","— навыки психологического давления и профессионального допроса.","— высокая сопротивляемость шоку, виду крови и насилию. Несколько раз оперировал сам себя.","— как саранча может пожирать сама себя, так и он, бывает, ставит эксперименты на самом себе."],"weaknesses":["— крайне устал понимать человеческие эмоции и сталкиваться с их последствиями, потому клал на это и закономерно далеко не везде задерживается надолго из-за отсутствия эмоциональных связей. Всякие иерархические социальные писькомерения его тоже не интересуют. Кому-то нужны его навыки и этот кто-то готов платить? Ну и отлично, со всем остальным отвалите.","— любопытство иногда перевешивает здравый смысл.","— может недооценивать людей без специального образования.","— плохо переносит длительное бездействие, в связи с чем боится лишь одной вещи: перспективы однажды полностью утратить интерес к исследованиям, остаться наедине с внутренней пустотой и не суметь убить себя.","— за пределами медицины и науки интересуется очень немногим, иногда может не знать относительно общеизвестных вещей."],"hobby":["— практическая стрельба и высокоточная стрельба. Не ради оружия или адреналина. Считает её тренировкой зрения, концентрации и контроля мелкой моторики. Особенно ценит упражнения на дальние дистанции, где результат зависит от дыхания, сердечного ритма и способности сохранять неподвижность.","— йога. Начинал как часть реабилитации после многочасовых операций. Со временем превратил её в инструмент контроля над телом и нервной системой.","— айкидо. Единственное боевое искусство, которое действительно заинтересовало его благодаря составляющей биомеханики — рассматривает техники как практическое применение анатомии: рычаги, суставы, центр тяжести, распределение нагрузки. Для него это набор методов, позволяющих быстро обездвижить человека с минимальными затратами энергии и максимальным контролем над последствиями."],"features":["— неизвестно, знает ли он какие-либо языки, кроме английского; из-за неразговорчивости и нежелания реагировать на разговоры, которые его не интересует, многим вообще кажется глухонемым.","— может не покидать лабораторию несколько суток подряд. Часто забывает есть и спать во время работы.","— не испытывает интереса к развлечениям, искусству, политике, религии или романтическим отношениям.","— поддерживает тело в отличной форме исключительно из профессиональной необходимости. Убеждён, что хирург, который не способен контролировать собственное тело, не имеет права работать с чужим."],"appearance":["— Высокий, худощавость почти всегда скрывает под мешковатой одеждой; выглядит значительно моложе своего возраста. Тёмная кожа с ровным холодным подтоном; узкое лицо с выраженными скулами и острым подбородком; миндалевидные тёмно-карие глаза с тяжёлым, оценивающим взглядом; «хирургически» длинные тонкие пальцы. Волосы обычно заплетены в аккуратные брейды или локсы со строгой геометрией проборов. Они длинные, но это и удобно: тратится минимум драгоценного времени на уход, можно не стричься годами. Своего стиля не имеет, носит всё, что придётся. Двигается тихо и плавно, из-за чего его появление часто замечают лишь в последний момент, если вообще замечают.","- Fathermariyuh.","Разумеется."]},"stats":{"Сила":0,"Ловкость":8,"Интеллект":9,"Харизма":0,"Восприятие":3},"tracks":["Pitbull Terrier — Die Antwoord"],"photo":"images/hunter.jpg","archived":false},{"id":"hugo","name":"Хьюго Ларсон","aka":["Хьюи","Нарцисс"],"age":["25 лет"],"role":["цветок в HORTUS со знанием японского языка =>","секретарь Артура Станкевича, блок TARGET"],"orient":["гомосексуал, пассив"],"tags":["TARGET ELIMINATION"],"player":{"name":"Hugo Larson","url":"https://vk.ru/ivokeller"},"date":"29 мая в 15:57","epigraph":null,"sections":{"character":["— Ларсон болтун. Но не из тех, которые, не думая, расскажут все важное и не важное, не отдавая себе отчета. Нет, Ларсон тот самый болтун, который схватится за фразу, а потом за другую, а потом за третью, доводя собеседника до белого каления. Причем делает он это с превеликим удовольствием, отдавая себе отчет в том, что это хобби делает мир лучше. Его собственный мир.","Хью мимикрирует под окружение. В зависимости от того, кто с ним рядом, может либо говорить без умолку, создавая впечатление ветренного дурочка, либо молчать и задумчиво смотреть вдаль, будто больше всего его волнуют проблемы глобального потепления и вымирание китов. С кем-то шутлив, с кем-то услужлив, с кем-то послушен до раболепия, кого-то ни во что не ставит. Все зависит от того, кто именно его собеседник.","Изворотливый. Хитрый. Подлый. Внимательный. Расчетливый. Не сказать, чтоб очень уж преданный — за идею рвать задницу на американский флаг он не будет, но за силой пойдет, рассчитав, что ему подобное будет более выгодно и безопасно."],"biography":["— Типичный мальчик из полной семьи: мама, папа, старший брат, младшая сестра и джек-рассел терьер Споки. Собственный дом, две машины на семью, одна из которых вместительный минивен для выездов всей оравой, бассейн на заднем участке и баскетбольное кольцо перед домом. Жаловаться было не на что. Буквально. Хьюго ходил в обычную школу, учился весьма недурно, занимался спортом, порой представляя школу на спортивных соревнованиях по округу в прыжках в длину. В 16 лет получил права на автомобиль, в 17 — на вождение мотоцикла. Правда, железный конь прожил бок о бок с Ларсоном не так долго: через пару лет Хью въехал в фонарный столб, чудом отделавшись лишь травмой колена. Жить она не мешает, парень даже не хромает, но вот погоду предсказывать он научился покруче любых синоптиков по телеку.","С детства увлекается японской культурой — настолько, что, поступив в колледж, начал изучать японский язык, полностью забив на остальные дисциплины. Экзамены он, конечно, кое-как сдавал — к кому подмажется, кому поплачется, к кому придет с нарисованными кругами под глазами (сестренка всегда придет на помощь), но японский он учил и сдавал без единой хитрости. На третьем курсе полгода жил в Японии по обмену, воспылав к Стране Восходящего Солнца нескончаемой любовью.","Когда-то он мечтал туда переехать и зажить жизнью типичного офисного воротничка, но судьба повела его куда-то совершенно не туда, приведя в один из тех баров, где за закрытыми дверями VIP-комнат творится то, на что копы закрывают себе глаза парой увесистых пачек долларов. Пара коктейлей, бесконечный флирт как обещание незабываемого вечера. Только вот после — помутневшее сознание, провалы в памяти, вспышки, в которых мелькает незнакомое лицо восточной внешности, и какая-то бесконечная дорога, отмеченная лишь сменой транспортов.","Оказаться не в то время не в том месте под руку не с тем человеком, чтобы по итогу, оказавшись в клане узнать, что его продал за какие-то смешные деньги тот, кого Хью видел в том баре в первый раз в жизни.","Это называется либо судьбой, либо катастрофическим невезением, но Хью предпочитает думать, что первое — так легче живется. С тех пор Ларсон категорически не потребляет наркотики, да и к алкоголю относится с максимальным подозрением."],"ability":["— высокая способность к запоминанию. За годы изучения и полировки иностранного языка научился все схватывать налету.","— благодаря тому же японскому и насмотренности на иероглифы может замечать малейшие нюансы. К примеру, способен с точностью в 80% определить, поддельная ли подпись, имея перед собой подпись-оригинал","— физически вынослив","— обостренный слух. Скорее всего из-за любопытства, а не из-за физических бонусов организма.","— устойчивая психика и никаких психологических отклонений."],"weaknesses":["— ненавидит холод","— плохое зрение (астигматизм), носит линзы. Без линз даже собственная ладонь — сплошное нелепое бежевое пятно.","— держит весь негатив в себе, и порой это отражается на самочувствии.","— ненавидит до трясучки гусениц, сколопендр и всех этих «длинных многоножчатых ползучих тварей, фу, убери!»","— когда забывается, может перейти с вежливой речи на низменные «че-каво».","— спит до победного, хрен разбудишь","— боится уколов.","— ужасно готовит все, кроме омлета"],"hobby":["— ни дня без кофе","— залипает в ютубе","— супер-про в ритм-игре «Вокалоиды»","— обожает музыку","— почему-то кое-как умеет вязать крючком"],"features":["— ненавидит полнометражные фильмы. Не может объяснить, почему","— обожает вишню, лимоны, помело и юдзу. Терпеть не может апельсины и грейпфруты.","— собачник","— когда думает, хрустит суставами на пальцах","— когда волнуется, кусает щеку изнутри","— капризничает на публику","— не азартен от слова совсем","— парфюм всегда с нотами цитруса","— считает, что причина его ориентации — просмотры рестлинга в детстве в компании бабушки"],"appearance":["Рост 178, вес 62. Подтянутый, жилистый. Темные, вьющиеся волосы, зелено-голубые глаза, кустистые, выделяющиеся брови, острые скулы. Под правым глазом чуть сбоку родинка (Ларс зовет ее «кОкетливой»). Нет татуировок. Проколото ухо.","Саша Шторм"]},"stats":{"Сила":3,"Ловкость":3,"Интеллект":6,"Харизма":5,"Восприятие":3},"tracks":[],"photo":"images/hugo.jpg","archived":false},{"id":"sean","name":"Шон Берсерк","aka":["Sean Berserk","Папочка"],"tags":["THE LAB"],"age":["16 лет"],"role":["Секретарь Основателя HORTUS | Ученик пилота LAB"],"orient":["Бисексуал"],"player":{"name":"Sean Berserk","url":"https://vk.ru/cerberus_berserk"},"date":"19 авг в 2:11","epigraph":null,"sections":{"character":["Самоуверенный, язвительный подросток, который привык считать себя умнее большинства окружающих. Любит цепляться к людям, намеренно выводить их из себя и с удовольствием наблюдать за реакцией. Практически на любую фразу у него найдется едкий комментарий. Не боится авторитетов и может позволить себе дерзость даже по отношению к тем, с кем благоразумнее было бы промолчать. Из всех окружающих по-настоящему уважает только Эдера. Его мнение для Шона имеет значение, поэтому рядом с ним подросток старается держать себя в руках и произвести впечатление. При этом Шон никогда не признается напрямую, насколько сильно ценит Лиарда. За показной наглостью скрывается расчетливый ум и хорошая наблюдательность. Быстро замечает чужие слабости и без особых угрызений совести использует их в споре. При этом не любит открыто показывать собственную уязвимость и скорее переведет серьезный разговор в шутку или издевку. Несмотря на свой характер, способен быть полезным и собранным, когда ситуация действительно этого требует."],"biography":["С детства рос самостоятельным ребенком и рано научился полагаться в первую очередь на себя. В один из самых тяжелых периодов своей жизни он оказался в ситуации, из которой самостоятельно выбраться не смог, однако тогда его спас Эдер. Для Шона это стало переломным моментом: впервые появился человек, которому он действительно смог доверять и которого впоследствии начал уважать. С тех пор Эдер занял особое место в его жизни, хотя сам Шон предпочитал не говорить об этом вслух. С тринадцати лет начал всерьез увлекаться самолетами. Он мог часами изучать их устройство, разбирать технические схемы, запоминать характеристики различных моделей и наблюдать за взлетами. Самолетами его привлекала не только техника — Шон был уверен, что только в небе человек действительно свободен. Чем больше он узнавал об авиации, тем сильнее хотел однажды подняться в небо самостоятельно. Со временем он не забыл человека, который когда-то спас ему жизнь. Эдер, в свою очередь, заметил его способности и преданность, и со временем решил взять Шона к себе в качестве помощника. Так он стал секретарем Основателя HORTUS, совмещая эту работу с обучением на пилота."],"ability":["Быстро обучается, обладает хорошей памятью и развитой наблюдательностью. Умеет замечать мелкие детали в поведении людей и довольно быстро определяет, на какие темы человек реагирует болезненно. Хорошо владеет речью и умеет провоцировать собеседника, заставляя его терять самообладание. Обладает базовыми навыками пилотирования. Благодаря худощавому телосложению достаточно ловкий и быстрый, хотя физической силой не отличается. Умеет сохранять концентрацию во время стрессовых ситуаций."],"weaknesses":["Слишком высокая самоуверенность часто мешает ему вовремя остановиться. Склонен недооценивать людей, которые кажутся ему глупыми или неинтересными. Любит провокации и иногда продолжает издеваться даже тогда, когда ситуация уже становится серьезной. Плохо воспринимает критику в свой адрес и особенно не любит, когда его публично выставляют глупым. Ему трудно признавать собственные ошибки и еще труднее просить о помощи. Не обладает большой физической силой. Может действовать импульсивно, если задеты его самолюбие или гордость."],"hobby":["Издевательства над людьми, наблюдение за чужими реакциями, авиация, коллекционирование необычных вещей."],"features":["Может заснуть в любом положении. Обладает привычкой ухмыляться, когда понимает, что собеседник начинает злиться. Часто дает людям раздражающие прозвища. Любит демонстративно поправлять одежду или волосы после особенно удачной колкости."],"appearance":["Рост 167 см, вес 50 кг. Худощавое, стройное телосложение с заметной юношеской худобой. Обладает выразительными чертами лица: овальная форма, аккуратная челюсть, нос с горбинкой и заметные скулы. Темные, густые брови, светло-карие глаза с зеленоватым отливом, темно-каштановые, жесткие волосы. Черты в целом еще сохраняют подростковую мягкость, несмотря на уже довольно выразительный профиль. В одежде предпочитает рубашки, пиджаки, шорты, брюки и джинсы.","Эйдан Галлахер"]},"stats":{"Сила":3,"Ловкость":5,"Интеллект":7,"Харизма":2,"Восприятие":4},"tracks":[],"photo":"images/sean.jpg","archived":false},{"id":"elmer","name":"Элмер Вандервелд","aka":["Elmer Vanderveld","Прозвища: Шиз, Побыстрее"],"age":["23"],"role":["В клане занимает роль тени. Уборщик, чистильщик — в общем, вы поняли. Пилот OUTKAST — вторая должность."],"orient":["Скорее бисексуален, потому что не трогал ни женщин, ни мужчин."],"tags":["TARGET ELIMINATION"],"player":{"name":"Selen More","url":"https://vk.ru/hikki27"},"date":"3 июн в 23:44","epigraph":null,"sections":{"character":["В силу обстоятельств, сложившихся в раннем детстве, обладает оптимистичным настроем. Что бы ни случилось — всё на благо, для сюжета жизни, для черт возьми чего ещё, но точно на благо.","Благодаря воспитанию в католической воскресной школе обращение к Господу, католические традиции и обязательная молитва на грядущий сон стали частью его рутины. Однако в ситуациях, когда бежать некуда, предпочитает сначала советоваться с собой, а уже потом — с кем-то извне. Правда, внутренний голос у него своеобразен.","Из-за психического отклонения склонен к монотонной, однотипной работе, но плох в социализации и работе с людьми. И при этом не позволяет себе оставлять попытки каждый раз заново наладить полноценный, адекватный диалог.","Уверен, что полностью здоров, а голоса и галлюцинации — всего лишь изюминка, черта характера и не более. Из-за болезни часто оторван от реального мира. Увлечённость конспиралогией только способствовала заболеванию. Полосы от самолётов - яд, правительство - пьёт кровь детей по ночам и прочие байки что вешают блоггеры в фольговых шапочках становятся его новой религией каждый раз. Сарказм примет за правду, а честную реакцию — за шутку.","Из основных плюсов, подходящих этой организации, можно отметить: исполнительность, неумение врать, дружелюбие и умение реагировать на просьбы и приказы помолчать."],"biography":["Ах, Висконсин — как вкусны твои сыры и как жестки детские кроватки в приюте при ордене Святого Георгия.","Элмер не знал, что родился от неудавшейся чешской мигрантки и подростка-немца. Первой повезло больше: алкоголь, трава и роды забрали её душу на новое колесо перерождения. А подросток даже не узнал, чем кончилась та весёлая вписка со взрослыми дамами, заказанными на день окончания средней школы.","Элмер — так звали юношу, породившего младенца. Казалось бы, его ожидает грустная судьба, полная разрухи, горя и слёз, но… что-то пошло не так: Элмер находил радость в каждом вдохе, повод для улыбки. Любимые игрушки — шнурок от кроссовок и платок одной из нянечек, подаренный ему на день рождения. Даже имея большее, он всегда выбирал их. Но то лишь поощрялось в местах, где за стеной — пристанище Господне. Ребёнок-аскет, прилежно выполняющий ритуалы. Мечта, а не ребёнок, если бы не отвлекался от уроков на игры лучей в окне, на разговоры с самим собой, на попытки увидеть что-то за учительской доской.","Инаковость стала причиной многих разборок за школой. Но Элмер не был агнцем Божьим в привычном понимании — ритуалы просто нравились, а молитва была «спасибо» Богу за приют. Тогда же он познакомился с доктором Мортом. Психиатр не слушал мальчика, только выписывал горсть таблеток, которые позволяли лучше отличать реальность от галлюцинаций.","И когда он впервые дал отпор и увидел кровь на своей ладони, то не испугался. Вытер о штаны. Взглянул пустыми глазами на обидчика и сказал:","— Кровь идёт только хищникам. Я не хищник. Но и не жертва.","А быть хищником стоило. Побои не прекратились, но, давая отпор, Элмер всё меньше получал по голове. Он рос, слыша наставления голосов в своей голове.","Кровь, к слову, ему помогла вывести перекисью уже пожилая нянечка. Так и зародился интерес к химии. Вечера в библиотеке, первые несмелые прогулки по интернету и знакомство неокрепшего ума с конспиралогией.","Но учёба не шла. Тяжело учиться, когда в одно ухо поют французскую Марсельезу, а в другое — американский гимн. Элмер бросил учёбу, выпускаясь из приюта и школы одновременно. Помощь и пособия помогали первое время, а переезд в город побольше помог найти постоянную работу.","Уборка мест преступлений шла хорошо и просто ровно до тех пор, пока Элмер не решил забыть о таблетках. Он же здоров, а здоровым пилюли не нужны. Тогда-то и начались проблемы: не каждый коллега будет слушать чужой философский бубнёж, наблюдать, как крутится голова в поисках собеседника, или как Элмер дёргается в страхе, а потом смеётся.","Оставшись без работы, а затем и без жилья, оказавшись на улице, юноше пришлось выкручиваться. Но, как он верит, если ты нужен где-то, то обязательно там и окажешься. Увидев работу банды, Элмер был готов к смерти в тот же час, но то оказались не просто головорезы, а настоящая мафия. Худощавого юношу запихнули в фургон как заложника, а выпустили уже как работника.","Долгий сытый год подошёл к концу из-за зачистки преступного мира. Юношу не тронули благодаря отметкам о психическом здоровье, но… психиатрическая больница. Это место до сих пор вызывает у него дрожь и неопределённую реакцию.","Сбежав оттуда, Элмер решил больше никогда не возвращаться в Америку. И вновь волей случая, упав на чужой корабль, в чужую грузовую коробку и оказавшись в Монако, юноша прознал о работе на LIAR."],"ability":["— Сила, ловкость и прочее — на уровне обычного молодого человека. Выносливость в силу работы выше средней.","— Из умственного — наблюдательность. Часто ключевые моменты подаются через галлюцинации, а не напрямую. Из-за этого может делать неожиданные, внезапные выводы, которые оказываются верными."],"weaknesses":["— Физически обычный молодой человек.","— Умственно имеет ряд особенностей:","· Не всегда может быстро реагировать из-за диалогов со своими голосами.","· Рассеян сам по себе: не всегда может уловить детали, если не сработает галлюцинация.","· Плох в социализации: не понимает людей от слова совсем."],"hobby":["— Молитва, отмечание некоторых католических праздников.","— Любит цветы больше, чем людей. Любые: срезанные, в горшке.","— Любит наблюдать за людьми, ведя внутренний диалог, но без фанатизма.","— Попытка проверить конспирологических теорий переодически."],"features":["— Не брезглив и аккуратен.","— Боится докторов и «hortus сектора», за исключением эскорта и цветов.","— Когда впервые услышал о «Саде цветов», подумал не о людях. А увидев — разочаровался, чем вызвал смех коллег.","— Не даст себя в обиду. Носит в кармане всегда кусок фольги аккуратно свернутый для защиты собственных мыслей.","— Галлюцинации после лечения в больнице стали чаще слуховыми, чем визуальными. Имеет два постоянных голоса в голове, но имён или номеров им не даёт. Ведь имён достойны только те, кто может не только говорить.","— Пуглив. Но за испугом идёт истерический смех.","— Татуировки и отметины на теле оставила работа в мафии: чернила под кожей — плата за наивность."],"appearance":["— Всё как на фото. Длинные волосы убирает в пучок во время работы. В остальном точь-в-точь. В свободной форме предпочитает берцы, тёмную одежду и иногда футболки оставленные ему бандой приютившей когда то. После зачистки они им все равно не нужны! Рост около 180, вес около 80. Аудио для вайба.","Прототип внешности — 20TOKENS."]},"stats":{"Сила":5,"Ловкость":8,"Интеллект":3,"Харизма":3,"Восприятие":2},"tracks":["Alarm! Red Light! — LAZZY2WICE"],"photo":"images/elmer.jpg","archived":false},{"id":"emily","name":"Эмили Диксон","aka":["Emily Dixon","мышка, фрик"],"tags":["THE LAB"],"age":["19 y.o.","из-за baby face выглядит значительно моложе"],"role":["THE LAB | алхимик (старший лаборант)"],"orient":["в силу небольшого опыта определить невозможно"],"player":{"name":"Emily Dixon","url":"https://vk.ru/id200001300519"},"date":"15 авг в 23:12","epigraph":null,"sections":{"character":["Эмили всегда была достаточно спокойным ребёнком, даже немного отстранённым. Она легко делает рутинные задачи, даже любит это. Чаще опирается на логику, нежели на собственные чувства. Осторожная, может показаться с виду тихой, но на самом деле просто открывается не всем. Любит порядок, иногда даже слишком. Не влюбчивая. За все свои девятнадцать лет ощущала что-то похожее на влюблённость всего единожды, но так и не разобралась, что с этим делать."],"biography":["Детство Эмили прошло в закрытом, утопающем в зелени особняке на побережье Сиднея. Огромное богатство семьи казалось незыблемым, но за фасадом легального импорта элитного алкоголя скрывался опасный криминальный бизнес. Ее отец был главным связным и эксклюзивным дистрибьютором европейского клана мафии Liar в Австралии. Через свои каналы он годами выстраивал масштабную сеть сбыта их элитных синтетических наркотиков по всему континенту.","В ранние годы Эмили не вызывала у родителей подозрений: она была тихой, не по годам развитой девочкой с идеальной речью. Родители списывали ее замкнутость, педантизм и странную привычку часами раскладывать игрушки по спектру на «просто сложный характер» и гениальность. Единственной ее страстью с малых лет стала химия. Пока сверстники играли в куклы, семилетняя Эмили завороженно наблюдала, как фиолетовый раствор марганцовки обесцвечивается в кислой среде, и наизусть заучивала латинские названия элементов.","Настоящие проблемы начались в средней школе, когда социальные правила усложнились, а детская маскировка Эмили перестала работать. Она не понимала намеков, говорила слишком академично и монотонно, избегала визуального контакта и впадала в ступор от школьного шума. После тяжелейшего нервного срыва в двенадцать лет, спровоцированного обычной контрольной работой, испуганные родители обратились к ведущим частным психиатрам Австралии. Комплексное тестирование выявило синдром Аспергера. Семья наняла высококлассных специалистов по поведенческой терапии, которые учили Эмили буквально по учебникам распознавать чужие эмоции, считывать микромимику и контролировать свои сенсорные триггеры. Но это не сделало ее «своей» — мир людей все еще оставался для нее чуждым и пугающим механизмом, в отличие от предсказуемой и стройной химии.","В элитной сиднейской школе Эмили мгновенно получила статус фрика. Ее отрешенный взгляд и нежелание участвовать в пустых девичьих разговорах раздражали одноклассников. Единственным человеком, пробившим эту стену, стал тихий мальчик по имени Лиам — такой же аутсайдер, с которым они могли часами молча сидеть на пирсе. Но Лиам переехал, и Эмили осталась один на один с жестокостью подросткового мира. Буллинг становился изощреннее с каждым днем: от украденных и сожженных лабораторных тетрадей до публичных унижений, когда ее судороги во время сенсорной перегрузки сняли на видео и выложили в сеть.","Тогда Эмили решила восстановить порядок. Наказание должно было стать математически выверенным и неотвратимым. Используя реактивы из секретных запасов отца, она тайно синтезировала в своей комнате жидкий, термостабильный нейротоксин «Психея» без цвета, вкуса и запаха. Вещество действовало через желудочно-кишечный тракт: оно мгновенно всасывалось в кровь, блокировало префронтальную кору головного мозга и перегружало миндалевидное тело. Человек полностью терял контроль над неокортексом, впадая в первобытное, неконтролируемое бешенство, заставляющее уничтожать любое живое существо рядом.","Эмили хладнокровно рассчитала время. Пробравшись на школьную кухню перед самым большим перерывом, она ввела токсин в общие чаны с заправкой для главного блюда дня. Через полчаса после начала обеда школьная столовая превратилась в безмолвный ад, который быстро перерос в кровавую бойню: вчерашние обидчики с остекленевшими глазами рвали друг друга на части голы","и столовыми приборами, не чувствуя боли.","Ее расчет подвела лишь слепая случайность. Эмили заложила идеальное время для действия яда, но не учла, что одна из поварих снимет пробу за десять минут до официального открытия столовой. Женщина сошла с ума прямо на кухне, успев разгромить стеллажи и привлечь внимание охраны. Прибывшая полиция и медики заблокировали часть еды, а внутренние камеры наблюдения зафиксировали, как Эмили незадолго до этого заходила в пустой пищеблок. Девушку арестовали прямо в классе до того, как она успела уничтожить жесткие диски с формулами. Учитывая тяжесть преступления, богатство отца не спасло — ее приговорили к максимальному сроку в закрытой колонии строгого режима.","Громкий арест Эмили и жуткие подробности «школьной бойни» спровоцировали колоссальный медийный шум. Полиция и спецслужбы перевернули вверх дном всю изъятую технику девушки, начав масштабное расследование происхождения редких компонентов для «Психеи». Из-за поднявшейся шумихи вся конспирация отца рухнула: его легальный бизнес оказался под микроскопом федералов, а секретные логистические каналы и склады обнажились.","Этой фатальной уязвимостью мгновенно воспользовались заклятые враги клана Liar — конкурирующий азиатский синдикат, давно мечтавший выбить европейцев с австралийского рынка. Поняв, что отец Эмили остался без прикрытия и потерял контроль, наемники конкурентов выследили его. Во время делового ужина в сиднейском ресторане, где он в панике пытался спасти остатки бизнеса, люди вражеского клана подстроили профессиональное покушение, замаскировав его под сердечный приступ с помощью редкого кардиотоксина. Он умер за три минуты на глазах у испуганных партнеров. Вся сеть сбыта клана Liar на континенте была окончательно уничтожена конкурентами, а европейский синдикат понес колоссальные миллиардные убытки из-за халатности своего погибшего дистрибьютора.","Клан Liar не прощал таких потерь, но выбивать долг из мертвеца было бессмысленно. Тогда боссы синдиката поняли, что единственный способ вернуть упущенное — заполучить гениальный мозг, создавший «Психею». Коррумпированные связи мафии позволили инсценировать смерть Эмили в австралийской колонии во время вспыхнувшего бунта. С поддельными документами, в полубессознательном состоянии от седативных препаратов, девятнадцатилетнюю девушку переправили на частном джете в Европу."],"ability":["Мозг Эмили устроен как безупречно откалиброванный хроматограф. Ее интеллект обладает феноменальной избирательностью, концентрируясь на структурах, связях и реакциях. Она способна удерживать в памяти сложные трехмерные модели органических соединений, мгновенно просчитывая стехиометрические уравнения без единой записи. Там, где обычный химик видит хаос формул, Эмили замечает безупречную геометрию. Ее мышление полностью лишено когнитивных искажений: она не опирается на интуицию, только на строгие алгоритмы и абсолютную логику. Она способна синтезировать новые вещества, комбинируя компоненты на стыке фармакологии и токсикологии, предсказывая их влияние на нервную систему с пугающей точностью.","Физически Эмили кажется хрупкой, почти прозрачной, но в ее теле скрыта удивительная, застывшая статика. У нее невероятно развита мелкая моторика: пальцы не дрожат, даже когда она отмеряет микрограммы смертоносных веществ. Она способна часами сохранять абсолютную неподвижность, наблюдая за выпадением осадка в пробирке. Однако ее движения со стороны кажутся угловатыми, немного механическими."],"weaknesses":["Главная уязвимость Эмили — это сенсорная перегрузка. Яркий люминесцентный свет, переполненное людьми помещение с громкой музыкой или резкий запах дешевого парфюма погружают девочку в стресс, от которого сложно оправиться.","Она совершенно не умеет распознавать ложь, сарказм или скрытые мотивы людей. Если правила игры не озвучены прямо, Эмили теряется.","Кроме того, ей чужда эмпатия в ее привычном понимании: страдания живых существ не вызывают у нее эмоционального отклика, если они логически обоснованы или являются частью контролируемого процесса."],"hobby":["Помимо химии, Эмили заворажи","завораживает энтомология — а именно изучение ядов и защитных механизмов насекомых. Она собирает сухие срезы растений, содержащих редкие алкалоиды, и ведет безупречно оформленные дневники с чертежами старинной лабораторной посуды. В редкие минуты отдыха она слушает белый шум или монотонные, циклические эмбиент-композиции, которые помогают ее разуму замедлить безумный бег мыслей."],"features":["По стечению обстоятельств все её животные скоропостижно умирали. Дольше всего прожил котёнок по имени Скот, практически полтора года радуя девочку своей любовью.","В ее личной лаборатории все реактивы расставлены строго по шкале кислотности pH, и если кто-то сдвинет флакон хотя бы на сантиметр, она не сможет продолжить работу, пока вернет все на свои места.","Эмили никогда не носит одежду с бирками. Трение шершавой ткани об кожу приносит ей сильный дискомфорт."],"appearance":["девочка часто носит одежду oversize, любит разные цвета в одежде. Для неё главное - удобство. Волосы слегка вьтются. Рост: 164 см.","Emma Mayers."]},"stats":{"Сила":2,"Ловкость":3,"Интеллект":9,"Харизма":2,"Восприятие":4},"tracks":[],"photo":"images/emily.jpg","archived":false},{"id":"efraim","name":"Эфраим Лоренцо Мария дель Аквила дельи Альбикастро","aka":["Efraim Lorenzo Maria dell'Aquila degli Albicastro","дон Эфраим (для коллег и начальников)","Преподобный дон Эфраим (для коллег ниже по должности)","Лоренцо (для членов семьи)","Падре (для прихожан и прочих)"],"age":["32 года."],"role":["Информатор из Ватикана."],"orient":["Как Бог даст. А Он обычно даёт прекрасных и несчастных девочек в возрасте от 14 до 16 лет."],"tags":["HORTUS"],"player":{"name":"Efraim Lorenzo Maria Dell Aquila","url":"https://vk.ru/etquaesuntdeideo"},"date":"1 июн в 18:44","epigraph":"«В девятом часу возопил Иисус громким голосом: Элои́! Элои́! ламма́ савахфани́? — что значит: Боже Мой! Боже Мой! для чего Ты Меня оставил?» — От Марка святое благовествование 15:34","sections":{"character":["«Возьмите иго Мое на себя и научитесь от Меня, ибо Я кроток и смирен сердцем, и найдете покой душам вашим.» — От Матфея святое благовествование 11:29","На первый взгляд Эфраим кажется идеальным смиренным праведником. Он не повышает голоса, не делает резких движений, идеально контролирует каждую микромимику. Его почти круглосуточная мягкая, учтивая улыбка - плод многолетней дрессуры - никогда не достигает глаз, которые остаются пронзительным, оценивающими, глубоко печальными. Он невероятно, сверхъестественно терпелив: может ждать месяцами, вести человека к нужному состоянию, не торопясь ни на секунду, полагая, что на всё \"воля Божья\".","Может искренне и честно помогать ближним, а может иметь за этой помощью какую-то скрытую мотивацию. С ним никогда не угадаешь, что стоит за его добротой, альтруизмом и предложением выслушать. У него всегда найдётся какой-либо совет, понимающее слово или тёплые объятия для нуждающихся. Он щедр и милосерден, не ведётся на провокации и оскорбления. Он идеально балансирует между выверенным безразличием к негативу, грязи, ненависти и искренней филантропией, принятием, готовностью помочь.","При этом всём Эфраим крайне требователен к себе и склонен к внутренним терзаниям. Он в вечной борьбе с самим собой, со своим отношением к окружающему миру, к своим деяниям. Он ментально распят между догмами и своей истинной натурой. Эфраим - волк в овечьей шкуре, причём шкура приросла к хищнику с корнями. Свою \"волчью\" часть, дикую и ненасытную, он ненавидит жгучей, слезливой ненавистью, но признаёт её необходимость для выживания. Эта внутренняя тварь вечно голодна - голодна до дрожи, до холода в сердце, до состояния, когда единственными ясными импульсами остаются защититься и насытиться. В нормальном состоянии он удерживает её цепями догм и самобичевания. Но когда напряжение между маской праведника и реальными желаниями становится невыносимым, когда трещины в душе расходятся и грозят расколоть рассудок, Эфраим может взорваться. Такой срыв — это не ярость маньяка, а страшный, полный слёз и боли припадок, где он обнажает своё отчаяние, ненависть к себе и к девушке из прошлого. Он может разбить до крови кулак о мрамор алтаря, а потом часами, стоя на коленях, смывать кровь, плача и шепча \"mea culpa, mea culpa, mea maxima culpa...\", и в этот момент он будет абсолютно, чудовищно искренен. После таких срывов он может днями истязать себя постом и горячными молитвами, почти не выходя из комнаты, чтобы вновь сковать внутреннего зверя цепями самобичеваний и замаливаний своих грехов."],"biography":["«И на челе ее написано имя: тайна, Вавилон великий, мать блудницам и мерзостям земным.» — Откровение ап. Иоанна Богослова 17:5","Эфраим Лоренцо Мария - старший сын Джузеппе дель Аквила, светского юриста, и Анны-Марии дельи Альбикастро, последней прямой наследницы рода, подарившего Церкви трёх кардиналов, одного апостольского нунция и бессчётное множество каноников. Брак этот был не столько союзом сердец, сколько соглашением династий: юристу дель Аквила требовались связи, семейству дельи Альбикастро - надёжный и образованный зять, способный обеспечить будущее их дочери и будущих внуков. Эфраим стал первым плодом этого союза - и с самого первого вздоха на него легла тяжесть всех надежд, возложенных двумя фамилиями на одного ребёнка.","Детство его прошло в римском палаццо, где каждый коридор был увешан портретами прелатов с фамильными чертами: тот же высокий лоб, тот же разрез глаз, та же тонкая линия губ. Мальчику не было и семи, когда двоюродный дед, кардинал-эмерит, впервые усадил его перед собой и произнёс слова, ставшие лейтмотивом всей последующей жизни:","— Ты принадлежишь не себе. Ты принадлежишь Церкви. И семье. Запомни это, Эфраим.","В тринадцать лет он поступил в малую семинарию — не потому, что ощущал призвание, и не потому, что семья принудила его силой. Просто иного пути не существовало. В мире, где он родился, вопрос выбора не стоял: ты становился священником так же естественно, как наследный принц становится королём. Эфраим принял это с тем же смиренным спокойствием, что впоследствии станет его визитной карточкой. Он не бунтовал. Он не спорил. Лишь иногда он думал о том, что где-то за стенами семинарии существует другая жизнь. Но мысль эту он гнал прочь, как неподобающую будущему клирику.","Однажды, когда ему было пятнадцать, он вернулся на каникулы в поместье семьи в Вальтеллине. Там гостила дальняя родственница со стороны матери - девушка того же возраста, с севера, живая, дерзкая, не боявшаяся ни Бога, ни людских предрассудков. Её имя он выжег из памяти, но помнит лицо, голос, запах жасмиа и пота. Она была опытнее. Или только казалась такой. Узнав, что он семинарист, она начала игру. сначала колкости, потом лесть, а в конце - манипуляция через стыд и вызов. Совесть пала в тот же вечер. Всё произошло в старой часовне, где пахло пылью и воском. Для неё это было приключение, для него - крушение вселенной. Физическое освобождение смешалось с таким ужасом, что он едва не потерял сознание. А на следующий день она сделала вид, что ничего не было.","Эфраим вернулся в семинарию сломленным. Он никому не сказал ни слова, но внутри он начал трещать по швам. Травма расщепила его: снаружи - идеальный семинарист, аскет, служитель Господа, внутри - голодное, униженное существо, мечтающее повернуть сценарий вспять. Не просто получить удовольствие, а стать хозяином того момента. Отомстить. Но не ей, а её образу, который с тех пор проецировался на всех девушек пятнадцати лет определённого типажа.","Следующие годы он провёл, выстраивая себя заново, кирпичик за кирпичиком, добродетель за добродетелью. Малая семинария сменилась большой. Философия - богословием. Юношеские метания - отточенным, почти неестественным спокойствием, которое стало его панцирем. Товарищи по семинарии находили его странным, но не могли объяснить, чем именно: он был вежлив, набожен, усерден в учёбе. Он никогда не повышал голоса. Никогда не делал резких движений. Улыбался - мягко, чуть рассеянно, - и улыбка эта не доходила до глаз, но никто не мог бы упрекнуть его в неискренности. Всё было идеально. Слишком идеально.","В восемнадцать поступил в Папский Грегорианский университет, где сначала стал бакалавром теологии, а после закончил ещё два года лиценциата канонического права. В двадцать три - поступление в докторантуру, в двадцать четыре - рукоположение в диаконы. Год спустя, уже в сане священника, блестяще защитил докторскую диссертацию. Для стороннего наблюдателя это был стремительный и безупречный взлёт, ещё одна жемчужина в короне рода Альбикастро.","Молодой доктор канонического права - такая редкость таком возрасте, что на это обращают внимание. Особенно если за плечами у доктора не только образование, но и фамилия. В двадцать шесть Эфраим получил место в Первом отделе Государственного секретариата Святого Престола практически без усилий. Вернее, усилия были, но не его: семья мягко, незаметно подтолкнула нужные двери, и они открылись.","Эфраим стал одним из тех безликих, но незаменимых сотрудников, чьи руки перебирают документы, предназначенные для глаз понтифика. Он обладал доступом к служебной переписке, к секретным досье, а его феноменальная память и способность оставаться в тени вскоре открыли ему двери в Ватиканский секретный архив - не как праздному исследователю, а как чиновнику, чья работа требовала извлечения нужных сведений из глубины веков и из самого острого современного компромата. Через его пальцы текли доклады о финансовых махинациях, о неблаговидном поведении епископов, о сомнительных счетах Института религиозных дел. Он был идеальным информатором - бесстрастным, всезнающим, невидимым.","Параллельно он окормлял приход Сант Анна деи Палафреньери, что в самом Ватикане, служил мессы и исповедовал садовников, гвардейцев, секретарей и их домочадцев. Он всегда был рядом с паствой, и паства видела в нём ангела во плоти: мягкая улыбка, которая никогда не достигала глаз, тёплые объятия для страждущих, совет, облечённый в библейскую мудрость, бесконечное терпение, неспешные жесты. Прихожане не догадывались, что за этой гладью скрывается безумный голод.","Его первой жертвой стала дочь калабрийского предпринимателя, скромная, тихая пятнадцатилетняя девушка, которую он методично обхаживал на протяжении полутора месяцев, потихоньку подменяя понятия и выстраивая из слов Писания сети, в которые жертва падала, не осознавая этого. После совращения произошёл и первый срыв, после которого он не выходил из комнаты несколько дней, стирая колени об пол и вжимая в кожу ладоней розарий.","Но охота не прекратилась.","Пять лет в Секретариате сделали его незаменимым. Он знал такие дела и имена, что его уход стал бы потерей для многих сил одновременно. Но к тридцати одному году над его головой начали сгущаться тучи - слишком много косвенных намёков, слишком много слухов, один настойчивый журналист-расследователь, неосторожная исповедь, которая могла выйти за пределы таинства. Семья и покровители в Курии сработали филигранно: ему устроили перевод. Официально - проявление пастырской заботы, направление в Монако для укрепления духовной жизни в одном из самых респектабельных приходов Европы. По документам он стал простым священником при Кафедральном соборе Святого Николая - величественном белокаменном храме в Монако-Вилль, где покоятся князья Гримальди и куда стекаются туристы и богатые прихожане.","На деле же его перемещение стало новым ходом сложной шахматной партии. Архиепархия Монако подчиняется напрямую Святому Престолу, минуя национальные конференции епископов. Следовательно, Эфраим остаётся \"глазами и ушами\" Ватикана в этом микроскопическом, но финансово насыщенном княжестве. Он всё так же числится в штате Секретариата - внештатным консультантом, специальным наблюдателем, формулировки размыты, но власть за ними стоит реальная. Его пропуски в архив до сих пор действительны, его звонки принимают на верхних этажах Апостольского дворца. Определённая доля влияния сохранилась: к его мнению прислушиваются, когда речь заходит о делах региона, а некоторые документы до сих пор проходят через его руки в зашифрованном виде. Он - тень, которая покинула центр, но не потеряла связи с ним. Скорее, теперь он стал тем кинжалом, который прячут на дальней полке, чтобы в нужный момент нанести удар.","Собор Святого Николая стал ему и убежищем, и новой сценой. Здесь он вновь предстал перед паствой: исповедует, утешает, проповедует мягким голосом, который обволакивает души. Для прихожан он - дон Эфраим, святой отец из Италии, неизменно вежливый, излучающий покой. Никто не знает, что его руки, ласково глядящие на юную девушку, пришедшую за советом, иногда видят не её, а тот размытый силуэт семнадцатилетней давности. Что слово Божье в его устах может быть и панацеей, и орудием пыток. Что за помощью, которую он так щедро раздаёт, может скрываться реконструкция его личной, мучительной драмы.","Выход на HORTUS с его связями, возможностями и потребностями был лишь вопросом времени. За нужную плату ему был дан безопасный доступ к утолению своего голода, что не могло не радовать его покровителей. Риски минимизированы, а их шестерёнка работает как надо, смазанная визитами в клуб пару раз в неделю.","И именно через HORTUS другие властные, могущественные руки опустились к нему на плечи, предлагая о договорённости, связывая Эфраима с ними великим грехом. На кону стояло многое. И пока эти руки кормят его внутреннего монстра и защищают его репутацию, Эфраим согласен быть полезным."],"ability":["«И оглянулся я на все дела мои, которые сделали руки мои, и на труд, которым трудился я, делая их: и вот, всё — суета и томление духа, и нет от них пользы под солнцем!» — Книга Екклезиаста, или Проповедника 2:11","• Эксперт в юридической системе Церкви. Понимает мельчайшие детали брачного права, процедуры наложения канонических наказаний, судопроизводства в церковных трибуналах и правил работы с конфиденциальными документами, знает уязвимые места любого церковного процесса и умеет легализовать почти любое действие. Доступ к архивам развязывает ему руки в очень многих местах.","• Из языков знает: латынь (классическая и вульгарная), итальянский (родной), французский, испанский, английский, древнегреческий и библейский иврит (читает Писание в оригинале). Немного понимает калабрийский диалект.","• Умеет выворачивать чужие признания, связывая их тайной исповеди. Даже люди далёкие от религии ловятся на его авторитет. Может построить разговор так, чтобы человек сам предложил то, что нужно Эфраиму, думая, что это его собственное решение. Умеет слушать так, что не остаётся сил скрывать. Его молчание — не пустота, а мягкая, уютная бездна, в которую хочется падать. Жертвы сами отдают ему ключи от своей души.","• Практикует умерщвление плоти: власяницы, самобичевание, из-за чего у него крайне высокий болевой порог. Мелкие царапины, ссадины и синяки не замечает вообще.","• Абсолютный контроль над телом - он не дёргается, не чешется, не поправляет волосы без необходимости. Его жесты скупы и выверены. В любой ситуации он выглядит так, словно у него в запасе вечность. Его мягкая улыбка - стандартная маска. По ней невозможно прочитать ни гнев, ни страх, ни радость.","• Может обходиться без сна до 36 часов (ночные бдения), сохраняя ясность ума. Постится так жёстко, что способен игнорировать голод пару-тройку недель, питаясь лишь просфорой и водой.","• Походка неслышная, как у тени. Движется плавно, не цепляя углы рясой. Может войти в комнату, и вы заметите его, лишь когда он заговорит у вас за спиной.","• Терпение хищника. Он умеет ждать. Месяцами, годами, если потребуется. Одержимость не торопит его — она, напротив, заставляет смаковать процесс, растягивать удовольствие от приближения к цели. Он никогда не нападёт, пока не убедится, что жертва готова и безопасность обеспечена."],"weaknesses":["• Его спокойствие стоит колоссальных энергозатрат. Когда маска трещит по швам, а внутренняя грязь наконец-то выливается наружу, он срывается, превращаясь в рыдающего, сломленного человека. В такие моменты он абсолютно беззащитен, может путать факты и имена, выдавать секреты. После подобных срывов ему нужны часы, если не дни, на восстановление образа праведника.","• Из-за постоянных поклонов и ночных бдений страдает от хронического воспаления коленных суставов. В сырую погоду прихрамывает.","• Вынослив, но не боец от слова совсем. Может выдерживать пытки и избиения, но дать отпор физически не способен.","• Триггер на запах жасмина и женский издевательский смех. Испытывает от них иррациональный холодный ужас.","• Не любит шумные места, большое скопление людей, звуков и запахов легко выбивают его из колеи и дезориентируют.","• Из-за постоянной работы при свете свечей и полутьме имеет быстро садящееся зрение. Для чтения надевает очки, в остальное время старается обходиться без них.","• Его репутация - его главный щит и главная болевая точка. Без сана и семьи Эфраим беспомощен, поэтому вынужден быть втройне осторожен, и руки его из-за этого во многом связаны."],"hobby":["• Переделал одну из комнат у себя под мини-мастерскую по реставрации книг. Он покупает рассыпающиеся молитвенники XVI-XVIII веков и возвращает их к жизни.","• Садоводство. Кажется, единственное, что действительно приносит ему только удовольствие, без стресса и подводных камней. Уход за растениями - его маленькая отдушина.","• Иногда вяжет спицами. Изделия всегда дарит, сам ничего не носит."],"features":["• Прекрасный изящный каллиграфический почерк.","• Слегка старомоден (что не удивительно, учитывая его профессию и воспитание), предпочитает бумажные документы и книги электронным.","• От него всегда пахнет ладаном, старыми книгами, воском и чуть-чуть - горьким миндалём из-за любимого крема для рук. Никакого парфюма.","• Имеет тихий, мягкий, убаюкивающий, очень приятный на слух голос.","• Жертвует огромные суммы на приюты от анонимного лица - попытка купить индульгенцию у собственной совести, финансово спасая абстрактных детей взамен тех реальных, которых он губит.","• Готов пойти на любое зверство (убийство, пытки, подрыв репутации и т. д.), если может это оправдать неким высшим замыслом, а этому он обучался всю жизнь."],"appearance":["Олицетворение аристократической хрупкости - высок (188 см), аскетично худощав (73 кг), силуэт почти болезненно вытянут. Из-за генетики и стресса рано начал седеть, на данный момент волосы полностью седые, не считая черни на затылке. На лице еле заметная россыпь веснушек. Тёмные глаза вечно глубоки и печальны.","По ощущениям он остаётся священником всегда, даже в гражданской одежде. Ключевые принципы в одежде вне работы - дорогая простота без брендовой крикливости и яркой церковной атрибутики, безупречный крой, монохромная палитра, отсутствие случайных вещей, почти полное отсутствие открытых участков тела. Из аксессуаров иногда носит часы и несколько колец, не более.","Прототип - Евгений Шварц."]},"stats":{"Сила":0,"Ловкость":3,"Интеллект":6,"Восприятие":4,"Харизма":7},"tracks":["голос — Эфраим"],"photo":"images/efraim.jpg","archived":false},{"id":"yoon-jaehyun","name":"Юн Джэхён","aka":["Yoon Jae-hyun","윤재현","Мичингэ"],"tags":["TARGET ELIMINATION"],"age":["29 лет."],"role":["Оперативник подразделения «Шан» | Наёмник."],"orient":["Демисексуал, но больше асексуал"],"player":{"name":"ديتون ميتي","url":"https://vk.ru/bolshenevorpisek"},"date":"5 окт в 10:55","epigraph":null,"sections":{"character":["Юн Джэхён производит впечатление человека с почти пугающе устойчивой психикой. На самом деле психика у него давно не особенно нормальная – просто сломалась очень удобно. В ситуации, когда остальные начинают паниковать, Джэхён становится спокойнее. Если помещение штурмуют, он вполне способен посмотреть на пробитую пулей стену и задумчиво произнести: \"Залог за квартиру нам, видимо, уже не вернут\", — а затем совершенно буднично продолжить работу.","За образом несерьёзного придурка скрывается быстрый, холодный и очень внимательный человек. Гораздо веселее позволить людям считать его идиотом. Он может вежливо спросить человека, какой ресторан тот посоветует в городе, одновременно оценивая ближайший выход. Может обсуждать новую модель телефона посреди перестрелки. Может совершенно искренне предложить противнику \"начать сначала, потому что первый раунд получился нечестным\".","Голос почти никогда не повышает. Наоборот: чем сильнее Джэхён раздражён, тем мягче он говорит."],"biography":["Джэхён родился в Пусане, Южная Корея, в обеспеченной семье. Отец занимался международной логистикой и много работал с компаниями в Юго-Восточной Азии, мать преподавала иностранные языки. Детство Джэхёна прошло между Южной Кореей, Таиландом и Сингапуром. У него было всё, что обычно считается хорошей жизнью: образование, деньги, семья, перспективы. И ему было смертельно скучно.","Очень рано стало понятно, что Джэхён обладает неприятной особенностью — опасность не пугает его настолько, насколько должна. Наоборот, она делает мир ярче. В подростковом возрасте появились драки, подпольные гонки, ставки, сомнительные знакомства и постоянные попытки проверить, насколько далеко он может зайти. Родители были уверены, что сын просто переживает сложный период.","В девятнадцать лет Джэхён исчез. Несколько лет он провёл, перемещаясь между Таиландом, Лаосом и Мьянмой. Работал охранником, проводником, посредником и выполнял задания для людей, которые предпочитали рассчитываться наличными и не задавать вопросов. Именно в Мьянме он впервые столкнулся с бойцами «Шан». Первую встречу сложно было назвать дружелюбной. Вторую — тоже. Зато после третьей несколько человек уже знали его имя.","Тогда-то его и заметил, не потому, что тот был полезен, полезных было много. Джэхён выделялся своей предсказуемой непредсказуемостью: он лез туда, куда другие не решались, и всегда возвращался живым. Арчи предложил ему работу, но не место в подразделении, а конкретное задание. Джэхён согласился, выполнил работу, получил деньги и снова исчез.","Так продолжалось несколько лет. Для Джэхёна «Шан» были не кланом, а заказчиками. Он появлялся в Мьянме, брал задания и уходил. Иногда пропадал на полгода, иногда возвращался через месяц. Никаких обязательств — только работа и деньги. Арчи не настаивал, он вообще ничего не требовал от Джэхёна. Просто каждый раз, когда тот возвращался, ему давали всё более сложные задания. А потом Джэхён сам начал возвращаться чаще, чем требовалось. Сначала потому что в Мьянме было интереснее, чем где-либо ещё. Потом, потому что там были люди, с которыми можно было работать, не оглядываясь."],"ability":["нестандартное тактическое мышление. Особенно эффективен в хаотичных ситуациях, когда первоначальный план уже разрушен.","быстро замечает выходы, укрытия, положение людей и детали окружающей среды.","отличный стрелок на ближней и средней дистанции. Предпочитает скорость и точность грубой силе.","в ближнем бою импровизирует и активно использует окружающие предметы.","высокая ловкость, хорошая реакция и выносливость.","умеет намеренно производить впечатление несерьёзного и даже немного глупого человека, чтобы противник его недооценил."],"weaknesses":["провоцирует людей даже тогда, когда это объективно плохая идея.","нетерпимость к скуке. Продолжительное бездействие переносит хуже физической боли.","Арчи. Главная эмоциональная слепая зона Джэхёна. Если ради Арчи потребуется пожертвовать собственной жизнью, он практически наверняка сделает это без долгих размышлений."],"hobby":["увлекается оригами. Эта привычка появилась во время долгих часов ожидания на заданиях. Складывает журавликов, лис, лягушек и маленькие цветы из чеков, упаковок, салфеток и ненужных документов. Иногда оставляет фигурки после себя. На вопрос зачем каждый раз придумывает новую причину.","составлять предложения на трех языка - английском, тайском, корейском.","давать людям клички собак, сопоставлять порода-внешность."],"features":["Родной язык — корейский. Свободно говорит на английском. Хорошо говорит по-тайски.","Постоянно пьёт сладкие напитки. Особая слабость — клубничное и банановое молоко, сладкий айс-кофе и газировка.","Почти всегда использует трубочку. Даже в ситуациях, когда это выглядит совершенно нелепо.","Иногда вставляет корейские обращения в речь на других языках, особенно когда раздражён.","Чем он злее, тем спокойнее становится его лицо."],"appearance":["Рост: 183 см. Жилистое, спортивное телосложение. Хорошо развитые плечи и руки, но без массивной мускулатуры. Тёмные, почти чёрные волосы. Обычно слегка отросшие и растрёпанные. Несколько прядей постоянно падают на лоб. Тёмные глаза с немного тяжёлым, ленивым взглядом. В обычном состоянии в них постоянно присутствует насмешка. На заданиях носит практичную тёмную одежду: тактические брюки, футболки, лёгкие куртки, перчатки. В обычной жизни неожиданно любит классические костюмы. Чёрный или графитовый костюм, рубашка с расстёгнутой верхней пуговицей, часы и минимум аксессуаров. И где-нибудь под всем этим обязательно находятся совершенно идиотские носки.","Прототип: Ли Су-хёк"]},"stats":{"Сила":4,"Ловкость":5,"Интеллект":4,"Харизма":3,"Восприятие":4},"tracks":["Red Sex — Vessel"],"photo":"images/yoon-jaehyun.jpg","archived":false},{"id":"ray","name":"Ray Man","aka":["Рей Ман","Рай | Отсылка, что он отправляет клиентов в Рай удовольствий |"],"age":["30 лет.","Визуально: выглядит как породистый, ухоженный молодой человек, чья холодная сосредоточенность и острые скулы добавляют ему возраста и веса в глазах собеседника."],"role":["Мясник N II: Занимается поиском Хостов для клуба | Архитектор: Занимается планом чертежей зданий клана.","Наемником не является."],"orient":["Бисексуал."],"tags":["HORTUS"],"player":{"name":"Ray Man","url":"https://vk.ru/id1114762653"},"date":"13 мая в 21:30","epigraph":null,"sections":{"character":["Спокойный, расчетливый и пугающе ответственный. Он не тратит слова впустую. В его мире нет места хаосу — всё должно подчиняться логике и цифрам. Он обладает редким даром сохранять ледяное самообладание даже в моменты, когда на него направлено дуло пистолета, считая панику самой бесполезной тратой ресурсов.","Прежде чем сделать шаг, он просчитывает десять вариантов исхода. Для него важна справедливость, но не в моральном смысле, а в деловом — каждый должен получать то, что заслужил.","Он крайне ответственен: если Рей дал слово, он его сдержит, чего бы это ни стоило. Любит деньги, видя в них единственный надежный инструмент свободы.","В общении спокоен. Эмпат. Сговорчив. Открыт к решению вопросов."],"biography":["Рей родился в Сеуле. Его семья была обычной, из тех, что тянут лямку среднего класса, пока в доме незримо присутствует тень прошлого матери — её первый сын, Арслан. Мать безумно тосковала, но под рукой отца и азиатской культуры — парень все свое время посвящал учебе.","Рей видел сводного брата лишь однажды, совсем юношей, и запомнил только ощущение потерянности.","Пока Рей рос, он слышал лишь обрывки: брат ушел в криминал, в Японию, по стопам ныне Катоку Руичи.","Талант к чертежам привел Рея в колледж, где он три года проектировал. Когда стабильность семьи пошатнулась, Рей бросил учебу.","Бедность — лучший учитель математики; он быстро понял, что в ночных клубах Сеула за его умение управлять потоками людей и «хостами» платят больше, чем в проектных бюро. В 2021 году его аналитический склад ума заметили итальянские игроки, предложив работу в Милане.","Там он и встретил Тейлора Джонсона. Пока Арчи решал вопросы силой, Рей сидел рядом с блокнотом, вычерчивая логистические петли. Их сблизила архитектура: Джонсон видел в зданиях мощь, Рей — безупречные пути отхода. В 2023-м, когда Интерпол накрыл клуб, где он работал с партнером Тейлора-Джонсона на торговле людьми и наркотиках, Рей проявил фамильную выдержку.","Он не сдал Арчи, зная, что тот вытащит его, если он промолчит. Два года в итальянской тюрьме.","В 2025-м Джонсон сдержал слово. Он вытащил Рея и дал ему карт-бланш в «LIAR». За год Рей превратил виллу Арчи в крепость, спроектировав лаборатории и ходы, о которых не догадывается даже охрана.","Сейчас он курирует Hortus под началом Эдера. Для всех он — тихий мясник с блокнотом, но через его руки проходят сложнейшие маршруты поставок клана."],"ability":["—  Рей видит здания «насквозь». Ему достаточно беглого взгляда на фасад или один этаж, чтобы с точностью до 90% определить расположение несущих стен, вентиляционных шахт и скрытых полостей. Он мастер по поиску «слепых зон» для камер видеонаблюдения и проектированию путей отхода, которые невозможно отследить по официальным планам застройки.","—  Способен выстраивать многоуровневые цепочки поставок, где груз (от цветов до оружия) проходит через десятки точек, не вызывая подозрений у таможни или Интерпола. Его схемы — это математические лабиринты, в которых любой проверяющий заходит в тупик.","—  Владеет всеми современными инструментами проектирования, но его истинная сила — в умении работать «на коленке». Может набросать точнейший план объекта карандашом на салфетке за пять минут, учитывая все технические нюансы.","— Обладает феноменальной памятью на числа, даты и лица. В стрессовых ситуациях его мозг не паникует, а переходит в режим «калькулятора», отсекая эмоции и выдавая наиболее логичный вариант действий. Способен удерживать в голове десятки переменных одновременно.","— Годы работы в ночных клубах научили его управлять людьми без криков и угроз. Он мастерски подбирает «персонал» (хостов, водителей, курьеров), безошибочно определяя их надежность и слабые места. Умеет быть невидимым, когда это нужно, сливаясь с персоналом или толпой.","— Мастерски владеет короткими клинками. Не рубит, а наносит точечные, фатальные удары в артерии и суставы.","— Жилистое тело позволяет бесшумно перемещаться по конструкциям, забираться на любые высоты и использовать архитектуру как преимущество.","— Знает уязвимые точки любого здания. Может обрушить перекрытия или заблокировать выходы."],"weaknesses":["— Проиграет в затяжной борьбе или клинче из-за нехватки мышечной массы.","— Без оптики или своего ножа боевая эффективность падает в разы.","— Критически низкое зрение. Без оптики не видит."],"hobby":["— Пить черный, горячий американо и курить.","— Чтение книг.","— Наброски чертежей.","— Коллекционирует блокноты.","— Изучение языков."],"features":["—  В кармане всегда лежит запасной футляр — это его главная страховка.","— Плохо переносит яркое солнце и резкие вспышки, из-за чего почти не снимает затемненные очки даже при тусклом свете.","— Обладает привычкой ощупывать поверхности (стены, столы), запоминая текстуру и стыки материалов.","— Говорит тихо, заставляя собеседника наклоняться ближе, что он использует для оценки дистанции и запахов."],"appearance":["Высокий (182 см) и жилистый. У него типично корейские, острые черты лица: высокая переносица, четко очерченные скулы и вечно прищуренные из-за плохого зрения глаза. Кожа бледная, на теле видны несколько минималистичных татуировок (геометрические схемы и стрелы), скрывающих старые шрамы.","Его телосложение — это сухие мышцы и стальные связки. Он не занимает много места в пространстве, двигается плавно, стараясь не привлекать внимания.","В одежде предпочитает функциональный минимализм: свободные брюки, не стесняющие движений, и майки или рубашки, которые легко скинуть, если нужно лезть в вентиляцию.","Неотъемлемая часть образа — стильные очки в тонкой оправе с диоптриями."]},"stats":{"Интеллект":7,"Ловкость":6,"Восприятие":4,"Харизма":2,"Сила":1},"tracks":["We down we go ( slow + bass ) — Kaleo","AEAO (Slowed) — Dynamicduo/DJ Premier"],"photo":"images/ray.jpg","archived":false}];
const SEC=[["character","Характер"],["biography","Биография"],["ability","Способности"],["weaknesses","Слабости"],["hobby","Увлечения"],["features","Особенности"],["appearance","Внешность"]];

 archiveState[c.id]=c.archived;
 try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archiveState))}catch(e){}

let likeCounts={},likedByMe={},likesLoaded=false;

function firebaseReady(){return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes("PASTE_FIREBASE_DATABASE_URL_HERE")}
function likesUrl(path=""){return FIREBASE_DB_URL.replace(/\/$/,"")+"/likes"+path+".json"}
function formatCount(n){
 n=Number(n)||0;
 if(n>=1000000)return (Math.round(n/100000)/10).toString().replace(".",",")+"M";
 if(n>=1000)return (Math.round(n/100)/10).toString().replace(".",",")+"K";
 return String(n)
}
function updateHeroStats(){
 const active=C.filter(c=>c.archived!==true).length;
 const divisions=5;
 const likes=Object.values(likeCounts).reduce((a,b)=>a+(Number(b)||0),0);
 $("#heroStats").innerHTML=active+' <span>characters</span> · '+divisions+' <span>divisions</span> · '+formatCount(likes)+' <span>likes</span>';
}
function refreshLikeUI(id){
 document.querySelectorAll('[data-like-id="'+id+'"]').forEach(box=>{
  const heart=box.querySelector(".card-heart"),count=box.querySelector(".like-count");
  if(!heart||!count)return;
  heart.classList.toggle("on",!!likedByMe[id]);
  heart.setAttribute("aria-label",likedByMe[id]?"Убрать лайк":"Поставить лайк");
  count.textContent=formatCount(likeCounts[id]||0);
 })
}
async function loadLikes(){
 if(!firebaseReady()){likesLoaded=true;updateHeroStats();return}
 try{
  const r=await fetch(likesUrl(),{cache:"no-store"});
  if(!r.ok)throw new Error("likes load");
  const data=await r.json()||{};likeCounts={};likedByMe={};
  Object.entries(data).forEach(([charId,visitors])=>{
   const ids=visitors&&typeof visitors==="object"?Object.keys(visitors):[];
   likeCounts[charId]=ids.length;likedByMe[charId]=ids.includes(visitorId)
  });
 }catch(e){console.warn("Не удалось загрузить лайки",e)}
 likesLoaded=true;updateHeroStats();grid()
}
async function toggleLike(c){
 const id=c.id,was=!!likedByMe[id];
 likedByMe[id]=!was;likeCounts[id]=Math.max(0,(likeCounts[id]||0)+(was?-1:1));
 refreshLikeUI(id);updateHeroStats();
 if(act==="FAVORITES"||$("#sort").value==="popular")grid();
 if(!firebaseReady())return;
 const url=likesUrl("/"+encodeURIComponent(id)+"/"+encodeURIComponent(visitorId));
 try{
  const r=await fetch(url,{method:was?"DELETE":"PUT",headers:was?{}:{"Content-Type":"application/json"},body:was?undefined:"true"});
  if(!r.ok)throw new Error("like save")
 }catch(e){
  likedByMe[id]=was;likeCounts[id]=Math.max(0,(likeCounts[id]||0)+(was?1:-1));
  updateHeroStats();grid();console.warn("Не удалось сохранить лайк",e)
 }
}

const ageS=a=>{a=a||"";const m=a.match(/^\d+(\s*(лет|года|год))?/i);return m?m[0]:a.slice(0,26)};
const hay=c=>[c.name,c.aka.join(" "),c.age.join(" "),c.role.join(" "),c.tags.join(" "),Object.values(c.sections).flat().join(" ")].join(" ").toLowerCase();
C.forEach(c=>c._h=hay(c));

const months={янв:1,фев:2,мар:3,апр:4,май:5,мая:5,июн:6,июл:7,авг:8,сен:9,сент:9,окт:10,ноя:11,дек:12};
function dateRank(c){
 const s=(c.date||"").toLowerCase(),m=s.match(/(\d{1,2})\s+([а-яё]+)/i);
 if(!m)return 0;const mon=months[m[2].slice(0,4)]||months[m[2].slice(0,3)]||0;return mon*100+Number(m[1])
}

function tagsBar(){
 const el=$("#tags");el.innerHTML="";
 const items=[
  {v:null,t:"ALL"},
  {v:"ADMINISTRATION",t:"ADMINISTRATION"},
  {v:"TARGET ELIMINATION",t:"TARGET ELIMINATION"},
  {v:"HORTUS",t:"HORTUS"},
  {v:"THE LAB",t:"THE LAB"},
  {v:"THE BASE",t:"THE BASE"},
  {v:"FAVORITES",t:"FAVORITES",cls:"fav-chip"},
  {v:"ARCHIVE",t:"ARCHIVE",cls:"archive-chip"}
 ];
 items.forEach(item=>{
  if(item.v && !["FAVORITES","ARCHIVE"].includes(item.v) && !C.some(c=>c.tags.includes(item.v)))return;
  const b=document.createElement("button");
  b.className="chip"+(act===item.v?" on":"")+(item.cls?" "+item.cls:"");
  b.textContent=item.t;
  b.onclick=()=>{act=item.v;tagsBar();grid()};
  el.appendChild(b)
 })
}

function getList(){
 const q=$("#q").value.trim().toLowerCase();
 let pool;
 if(act==="ARCHIVE")pool=C.filter(c=>c.archived===true);
 else pool=C.filter(c=>c.archived!==true);
 if(act==="FAVORITES")pool=pool.filter(c=>likedByMe[c.id]);
 else if(act && act!=="ARCHIVE")pool=pool.filter(c=>c.tags.includes(act));
 if(q)pool=pool.filter(c=>c._h.includes(q));
 const sort=$("#sort").value;
 if(sort==="popular")pool.sort((a,b)=>(likeCounts[b.id]||0)-(likeCounts[a.id]||0)||a.name.localeCompare(b.name,"ru"));
 else if(sort==="date")pool.sort((a,b)=>dateRank(b)-dateRank(a)||a.name.localeCompare(b.name,"ru"));
 else pool.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
 return pool
}

function grid(){
 const L=getList(),active=C.filter(c=>c.archived!==true).length;
 $("#cnt").textContent=L.length+" из "+(act==="ARCHIVE"?C.filter(c=>c.archived===true).length:active);
 $("#sectionLabel").textContent=act||"ALL CHARACTERS";
 const g=$("#grid");g.innerHTML="";
 if(!L.length){
  g.innerHTML='<div class="empty">'+(act==="FAVORITES"&&!likesLoaded?"Загружаем избранное…":act==="FAVORITES"?"Здесь появятся персонажи, которым вы поставили ♥":"Ничего не найдено")+'</div>';
  return
 }
 L.forEach(c=>{
  const b=document.createElement("div");b.className="card"+(c.archived===true?" archived-card":"");b.tabIndex=0;b.setAttribute("role","button");b.setAttribute("aria-label","Открыть анкету: "+c.name);
  const img=document.createElement("img");img.className="card-photo";img.src=c.photo||("images/"+c.id+".jpg");img.alt="";
  const fb=document.createElement("div");fb.className="card-fallback";fb.textContent=(c.name||"?").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();

  const badge=document.createElement("span");badge.className="division-badge";badge.textContent=c.archived===true?"ARCHIVE":(c.tags[0]||"LIAR");

  const likeBox=document.createElement("div");likeBox.className="like-box";likeBox.dataset.likeId=c.id;
  const heart=document.createElement("button");heart.className="card-heart";heart.type="button";heart.setAttribute("aria-label","Поставить лайк");
  heart.innerHTML='<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"></path></svg>';
  const count=document.createElement("span");count.className="like-count";count.textContent=formatCount(likeCounts[c.id]||0);
  if(likedByMe[c.id])heart.classList.add("on");
  heart.onclick=e=>{e.stopPropagation();toggleLike(c)};
  likeBox.append(heart,count);

  img.onload=()=>{fb.style.display="none";likeBox.style.display="flex"};
  img.onerror=()=>{img.style.display="none";fb.style.display="flex";likeBox.style.display="flex"};

  const shade=document.createElement("div");shade.className="card-shade";
  const info=document.createElement("div");info.className="card-info";
  const name=document.createElement("span");name.className="card-name";name.textContent=c.name;
  const meta=document.createElement("span");meta.className="card-meta";meta.textContent=[c.ageShort||ageS(c.age[0]),c.aka[0]].filter(Boolean).join(" · ");
  info.append(name,meta);b.append(img,fb,badge,likeBox,shade,info);
  b.onclick=()=>open(c.id);
  b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(c.id)}};
  g.appendChild(b)
 })
}

function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function infoItem(label,value,node){
 const d=el("div",null,"info-item");d.append(el("span",label,"info-label"));
 const v=el("span",null,"info-value");if(node)v.append(node);else v.textContent=value||"—";d.append(v);return d
}
function addSection(s,title,paragraphs,opened=false){
 if(!paragraphs||!paragraphs.length)return;
 const d=document.createElement("details");d.className="section-block";d.open=opened;
 const sm=document.createElement("summary");sm.textContent=title;
 const content=el("div",null,"section-content");
 paragraphs.forEach(x=>content.append(el("p",x)));
 d.append(sm,content);s.append(d)
}

function open(id){
 const c=C.find(x=>x.id===id);if(!c)return;
 const s=$("#sheet");s.innerHTML="";

 const hero=el("div",null,"profile-hero");
 const pic=document.createElement("img");pic.className="profile-photo";pic.src="images/"+c.id+"-profile.jpg";pic.alt=c.name;

 const aka=c.aka.map(a=>a.replace(/\s*\|\s*/g,", ").replace(/[,\s|]+$/,"")).join(" · ");
 if(aka)head.append(el("div",aka,"profile-alias"));
 hero.append(pic,head);s.append(hero);
 pic.onerror=()=>{pic.remove();hero.style.height="170px"};

 if(c.tags.length){

 }

 info.append(infoItem("Возраст",c.age.join(" ")));
 info.append(infoItem("Роль",c.role.join(" ")));
 info.append(infoItem("Ориентация",c.orient.join(" ")));
 const playerLink=el("a",c.player.name);playerLink.href=c.player.url;playerLink.target="_blank";playerLink.rel="noopener";
 info.append(infoItem("Игрок",null,playerLink));
 info.append(infoItem("Анкета от",c.date));
 s.append(info);

 if(c.epigraph)s.append(el("p",c.epigraph,"profile-alias"));

 }

  row.append(archive)
 }
 const o=el("a","открыть обсуждение в вк","btn p");o.href=TOPIC;o.target="_blank";o.rel="noopener";

}
