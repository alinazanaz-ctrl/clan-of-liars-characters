го. Уважает людей, которые делом доказывают свою состоятельность,  пустозвонов держит от себя на расстоянии. Являясь психопатом, чувствует настроение окружающих , но безвреден, если особь не является элементом его \"игры \". Жесток и прямолинеен к своим врагам, ко всем остальным относится нейтрально. Измеряет людей в единицах , где минус десять за пару минут является нормой. Многим не нравится, что он говорит, но это происходит в случаях, если элемент его не интересует или перед самой утилизацией. Во всех остальных случаях, люди могут быть полезны и никогда не знаешь где они пригодятся. Горо не ищет друзей, он ищет сильных напарников."],"biography":["-Биография, похоже, самое  сложное в его существовании.. - Далеко не азиатская внешность внешность и чисто японский  характер с вышедшими из строя настройками. Горо, надевая деловой костюм либо примеряя образ преклонных лет старика  в зависимости от ситуации, испытывал прилив адреналина перед очередным развлечением. Турист в очках, обычный мужик в футболке и джинсах или неприметный опрятно одетый господин с портфелем в руке. Тысяча разных образов, буквально созданных из ничего, профессиональный грим и умение мимкрировать под любую роль. Сотни личностей в одной оболочке , пока не настанет время менять  на новую и всё по старой схеме. На этот раз, очнувшись после глубокого наркоза, он долго привыкал к приглашённому свету палаты, щурясь сквозь туман перед глазами. - Нетерпится посмотреть - кривая усмешка отразилась в зеркале, и мужик долго смотрел в своё отражение время от времени проводя сухими заскорузлыми пальцами по щетинистому подбородку - ебать меня вынесло, хорошо что не до конца. - Опустившись на кровать, снова лёг, без промедления начав планирование своих действий. Через год он уже вернулся на родину, исчезнув со всех радаров. Тот же путь, проделанный много раз, исчезая бесследно и являясь   в сотне разных образов. Деньги это великая вещь, способная превратить в невидимку любого. После столкновения нескольких кланов между собой, Горо решил исчезнуть, залечь на дно, отправившись в одно надёжное место, благо внешность далёкая от японских стандартов не подвела, теперь осталось только взять японские документы и отправиться в неизвестность."],"ability":["- В совершенстве владеет многочисленными навыками синоби, их техниками ведения боя, знаниями в области ядов, самодельных взрывчатых веществ с токсичными капсулами внутри.( техники держит в секрете ) Аналитический склад ума , но нестандартный ,творческий подход ко всему. Владение огнестрелом. Быстрое и ловкое перемещение на любой местности не смотря на крепкое телосложение. Мастерски использует окружающих людей для своих целей, часто незнакомцев или малознакомых личностей. Генератор идей, мастер создавать внезапные ситуации в свою пользу или во благо цели.  Гибкий, подвижный характер, мгновенная подстройка под человека в тех же целях. В его руках любой практически любой предмет становится смертоносным оружием."],"weaknesses":["-","Иногда уходит в себя, эмоционально отключается обдумывая то или иное решение. Мстителен до кончиков пальцев, злопамятен, может увлечься странным проектом, найти непонятное для окружающих дело. Уйти в запой . Всё делает для собственного удовольствия не считаясь с кем-то, если не считает нужным или не видит выгоды.  Может не вступать в  контакт с людьми без видимой причины. Внезапная сильная головная боль, особенно после долгих стычек, привычка не обращать внимание на боль, пока можно еще обойтись обычной перевязкой и \" малой кровью\"в итоге процесс заживления тканей затягивается из-за сильных повреждений. Любит ставить на себе эксперименты с разными веществами, что приводит к тяжёлым отходнякам."],"hobby":["- собирает истории у местных жителей деревень на родине, путешествие по заброшенной местности, увлекается древними ритуалами и наукой о демонах. Собирает фигурки гейш."],"features":["- Демон."],"appearance":["-","Рост 197,вес 90 кг. Здоров как бык, тело имеет чётко выраженную мускулатуру. Покрытые чёткими венами руки с огромными ладонями и пальцами , способные задушить одним хватом за глотку. Регулярно тренируется ,уделяя особое внимание конечностям,  пресс  и спину качает как дышит и может начать тренировку в любом месте, поэтому носит лёгкую удобную одежду. Равнодушен к украшениям, дорогим вещам, но ради развлечения может нацепить на себя массивные перстни, часы, что по достоинству подчёркивает его колоритную внешность. Шрам на левой скуле и более крупные отметины по всей загорелой туше, часто полученные во время тренировок в раннем периоде жизни, несколько татух на теле с одним понятным ему значением. Чёрные как смоль волосы, часто с выбритым затылком, пристальный взгляд сероо - зелёных глаз, сканирующих простран"]},"stats":{},"tracks":[],"photo":"images/takeda.jpg","archived":false},{"id":"tim","name":"Тим Норман","aka":["Tim Norman","Прозвища: Тим, Мини-док"],"age":["25 лет.","Выглядит немного моложе своего возраста из-за мягких черт лица, спокойной манеры держаться и почти вечного уставшего взгляда."],"role":["Врач клана LIAR.","Окончил медицинский университет с отличием, однако обучение оплатил Клан. Большую часть времени оказывает первую помощь членам организации после операций, перестрелок и других происшествий. Очень редко – сопровождает выездные группы.","Наемником не является."],"orient":["Демисексуал."],"tags":["ADMINISTRATION","THE LAB"],"player":{"name":"Тим Норман","url":"https://vk.ru/id248851949"},"date":"29 июл в 4:49","epigraph":null,"sections":{"character":["Его очень сложно назвать душой компании – редко начинает разговор первым, избегает шумных сборищ, и чувствует себя куда комфортнее или за работой, или в компании книг, медицинских карт и привычного гула оборудования. Интроверт до мозга костей – быстро устает от общения. Именно из-за этого выработалась полезная привычка слушать и наблюдать, а не говорить.","Привычное состояние тревоги тоже дало неожиданные плюсы – заранее продумывает и просчитывает самые худшие варианты развития событий (пусть из-за этого и выглядит слишком осторожным, иногда даже параноиком). Но именно эта деталь позволила достичь высокого навыка в медицине – замечает те детали, которые легко можно пропустить, всегда готов к худшему (то есть, походная аптечка и кабинет забиты всем, чем только можно), редко действует необдуманно.","Несмотря на внешнюю мягкость, Тим удивительно упрям в вопросах медицины. Если речь идет о жизни пациента, он способен спорить даже с людьми, стоящими выше него по положению. Работа остается единственной сферой, где исчезают сомнения и появляется холодная уверенность.","На удивление плохо переносит необоснованную жестокость, хотя давно перестал удивляться тому, что происходит вокруг. Еще один полезный навык – не задает лишних вопросов, понимая, что некоторые ответы лучше никогда не слышать. При этом старается относиться к каждому пациенту одинаково, независимо от того, кто лежит перед ним.","Завоевать его доверие сложно, но потерять — очень легко. Тим долго помнит добро и почти не умеет прощать предательство.","Эмоциональная близость для него всегда предшествует физической. Из-за замкнутости, постоянной занятости и особенностей собственной привязанности к двадцати пяти годам остается девственником, не испытывая по этому поводу ни стыда, ни желания что-либо менять ради чужих ожиданий."],"biography":["Тим вырос в обычной семье, где всегда поощряли любознательность и любовь к учебе. С детства много читал, особенно книги по биологии и медицине, мечтая однажды стать врачом. В подростковом возрасте серьезно повредил колено, из-за чего был вынужден отказаться от спорта, который раньше занимал значительную часть его жизни. Последствия травмы остались с ним навсегда: сустав иногда подводит, особенно при больших нагрузках и перемене погоды.","Несмотря на финансовые трудности, Тим сумел поступить в медицинский университет – но радость длилась недолго. Смерть родителей в аварии подкосила его и морально, и материально. Когда стало ясно, что оплатить обучение самостоятельно он не сможет, помощь неожиданно предложили представители Клана LIAR – студент, который уже смог пробить себе место в операционных, лучший на курсе, несмотря на все события… Такие кадры не валяются на дороге, верно? Цена казалась простой — после получения диплома несколько лет работы на организацию.","Только позже он понял, что подобные долги не заканчиваются вместе с контрактом.","Теперь Тим работает в закрытом медицинском центре Клана, где ежедневно спасает людей, которых обычные больницы предпочли бы никогда не видеть. Он не разделяет идеологию организации и не испытывает иллюзий относительно ее методов, но предусмотрительно держит язык за зубами. Спустя годы появилось осознание что уйти значительно сложнее, чем однажды согласиться принять помощь. Пока его задача проста — лечить. Остальное он предпочитает оставлять за дверью операционной."],"ability":["Обладает выдающимися профессиональными знаниями в области экстренной медицины и травматологии. Быстро принимает решения в критических ситуациях, умеет сохранять самообладание даже при массовом поступлении пострадавших. Отличается феноменальной внимательностью к деталям и превосходной памятью.","Хорошо владеет навыками оказания неотложной помощи, хирургической обработки ран, реанимации и интенсивной терапии. Может работать много часов подряд практически без отдыха, если этого требует ситуация – конечно, потом его едва ли не выносить нужно из кабинета, но жизнь человека на столе превыше всего.","Физически развит умеренно. Благодаря медицинской практике обладает хорошей координацией движений и выносливостью рук, но не является бойцом."],"weaknesses":["Главная слабость Тима — хроническая тревожность. Он склонен брать ответственность за чужие жизни на себя и тяжело переживает неудачи, даже если объективно сделал все возможное.","Из-за старой травмы левое колено периодически болит и может подвести при длительном беге, подъеме по лестнице или сильных физических нагрузках.","Плохо переносит длительное недосыпание вне рабочего процесса, не умеет просить помощи и зачастую замыкается в себе, предпочитая переживать проблемы в одиночку. Практически не способен применять насилие против другого человека, если существует хоть малейшая возможность этого избежать."],"hobby":["Чтение художественной и научной литературы.","Коллекционирует старые медицинские атласы.","Любит проводить вечера с чашкой крепкого чая и книгой.","Иногда делает подробные заметки о редких клинических случаях."],"features":["Всегда носит с собой небольшую записную книжку, куда записывает наблюдения и мысли – это кажется безопаснее, чем заметки в телефоне.","Машинально поправляет очки или трет переносицу, даже если очков на нем нет.","Почти не употребляет алкоголь, но курит.","В стрессовых ситуациях становится необычайно спокойным — словно все эмоции выключаются до окончания работы.","На сменах неизменно надевает нитриловые перчатки на размер меньше, считая, что так лучше чувствует инструменты, латексные же могут вызвать контактный дерматит."],"appearance":["Рост — 170 см.","Телосложение худощавое, без выраженной мускулатуры. Кожа светлая, лицо с мягкими, почти юношескими чертами лица, часто заметны следы недосыпа.","Волосы, которые он сам считает мышиными, обычно слегка вьются, если отрастают – а он не всегда тщательно следит за тем, чтобы вовремя стричься.","Одевается просто и аккуратно; вне работы предпочитает свитера, рубашки и длинные пальто.","Прототип внешности: Герран Хауэлл"]},"stats":{"Сила":3,"Ловкость":4,"Интеллект":6,"Восприятие":5,"Харизма":2},"tracks":[],"photo":"images/tim.jpg","archived":false},{"id":"travis","name":"Трэвис Митчелл","aka":["Travis Mitchell","прозвище: Икар"],"age":["33 года."],"role":["Пилот транспортного корпуса The Lab; Мясник Hortus, наёмник."],"orient":["Бисексуал."],"tags":["HORTUS","THE LAB"],"player":{"name":"Лев Войтов","url":"https://vk.ru/ya_rykzak"},"date":"7 мая в 3:02","epigraph":null,"sections":{"character":["Трэвис хаотичная, но безобидная личность, которую носит туда-сюда, словно целлофановый пакет на ветру.","Ему физически сложно молчать: в голове полно мыслей и ни одной полезной. В основном он сдерживается, чтобы не ляпнуть какую-нибудь похабщину, и проигрывает сам себе. Общается исключительно шутками – ни одному слову лучше не верить, он всё это выдумывает у себя в голове ради забавы, и эта шутка даже не для кого-то, а для себя, через пару минут он забудет о той ахинее, что нес. Действительно добрый, хотя первое впечатление о нём буквально обратное. Не может отобрать ни леденец у ребёнка, ни жизнь у человека (теперь не может), поэтому пушка в его руке всегда скорее блеф и понты, а в нюансы своей нынешней работы он старается не вдаваться. Раздолбай тот ещё, не имеет брезгливости и дисциплины. Предпочитает всё отдавать на откуп судьбе: делать всё, что может, а дальше как выпадет карта – действовать по ситуации. С детства достаточно умён, но недостаточно терпелив, чтобы продумывать что-то наперёд, поэтому живой ум находит, как выкрутиться из почти любой ситуации, а то, что это можно было предотвратить заранее, – это уже другая история, не про Трэвиса."],"biography":["Отец Трэвиса служил в 48-й группе технического обслуживания истребительного крыла ВВС США, был идейным и по-настоящему талантливым специалистом своего дела, отдавшим авиатехнике 22 года и не раз побывавшим в командировках. После смерти матери Трэвиса (причина вполне обычная – инфаркт), оставшись с десятилетним ребёнком на руках, отец решил переехать в Детройт, где родился и вырос, и открыл там небольшую мастерскую по ремонту двигателей и восстановлению списанной техники; впрочем, там ремонтировалось почти всё. Оттуда и началась любовь сына к технике. В 11 лет он в мастерской с отцом собирал и разбирал, узнавал и щупал, в 15 попробовал сесть за руль (под присмотром, конечно). В 17 сам перебирал свою тачку и участвовал в местных нелегальных гонках. Скорость пленяла: он никогда не был усидчивым, но за рулём всё внимание наконец концентрировалось, и это было то, чем Трэвис был готов заниматься всю жизнь. Решено было поступать в технологический, как когда-то и отец, на инженера.","Со временем тяга к транспорту никуда не исчезла: ему стало не хватать машин, отцовского катера и мотоцикла. Ему хотелось забраться выше, изучать новое, поуправлять чем-то, чем он ещё не умудрился управлять. При университете он прошёл курсы подготовки офицеров резерва, подписав контракт. После выпуска его ждали 10 месяцев в учебном центре и направление в транспортный корпус ВС США. За последующие 8 лет он постоянно проходил переподготовку и повышал квалификацию, потому что мог и был доволен таким раскладом, пока его не уволили по статье за неисполнение приказа. На какое-то время Трэвис осел в мастерской отца в Детройте: тот уже не мог так шустро всем заправлять, но это все было слишком тускло для такого как Трэвис. Он вернулся в стритрейсинг, чтобы обеспечивать себя и хоть немного разнообразить жизнь. На гонках же встретил старого армейского знакомого, который какое-то время работал наёмником в Европе. По этому знакомству вышел на одних, затем на других, в итоге осев наёмником в Монако."],"ability":["— Управляет практически любым видом транспорта, а если не управляет — дайте минут десять (две на перекур), и он разберётся, как это ведро двигается;","— Довольно вынослив в силу подготовки, может выдержать без сна пару суток. Он вообще спит в любом положении, месте и состоянии, пока спать можно;","— Имеет довольно гибкий ум, подстраивается под ситуацию быстрее, чем успевает её действительно обмозговать;","— Хороший ремонтник. Всё, кроме, пожалуй, самолёта, способен разобрать и собрать, наладить, если посидит над этим чуть подольше;","– Владеет огнестрельным, но стрелять ни в кого не станет. Та же ситуация и с ближним боем: имеет какие-никакие навыки, но не сильно горит желанием бить кому-то лицо.","– Отсутствие агрессии, его в целом сложно вывести на что-то."],"weaknesses":["— Невыносим в разговорах, его нельзя отправлять договариваться даже с продавщицей в мага ить инициативу и упивается властью, но может позволить превратить себя в вещь. При этом сумеет удрать, если наскучит это развлечение.","С трудом сдерживает эмоции, может сорваться, выплеснуть их. Наученный опытом, работает над своим противоречивым нравом. В целом, оставаясь интересным собеседником, любителем хороших книг и музыки. С людьми общается из соображений выгоды своей или для семейного бизнеса. Обожает быть в центре внимания, которое принимает, как будто одолжение делает. Но может помочь кому-то, кто просто вызывает симпатию и в ком чувствует достойного «бойца»."],"biography":["— Хайден родился в семье состоятельного скандинава, владельца судов для перевозки различных грузов, и немки, дочери промышелнника. Пятый ребёнок в семье.Оттого вырос избалованным и с чувством вседозволенности. Мог бы всюжизнь жить припеваючи н ародительсткие деньги, красуясь на приёмах и светских раутах. Но природное упрямство и любознательность, а так же иногда полное отсутствие инстинкта самосохранения толкнули парня узнать что там за пределами того мира, где он родился с золотой ложкой во рту.","К восемнадцати Хайди уже был знаком с алкоголем. Родители, узнав об этом, решили перевоспитать «мальчика. Не желая пдчиняться воли кг бы т не был, парень сбежал из дма и тут же устрилс ятанцевать на пилне в нчнм клубе. Спасиб занятием танцами, которые он просто ненавидел с детства. Там же его заприметили люди из мафии. Хайден, со своей безупречной внешностью и огромными кофрами со сценическими костюмами стал идеальным контрабандистом.","Семья не отступала,решив «спасти» его. И парень попал в армию. Данные об этом отсутствуют. Но ходят слухи, что лично его родной дядя «выколачивал дерьмо из дурной башки». Вслдедствие слишком свободолюбивого характера Хайди покинул ряды военных. Но домой не вернулся. какое-то время перебивался танцами и втянулся в бои без правил.","Не так давно, поняв ценность человеческой жизни, он покинул опасый спорт. Но всё ж время от времени, ради развлечения, выходит на
