требовала холодной головы, точности, дисциплины и способности принимать решения тогда, когда времени на сомнения не было. Он был способным студентом и окончил университет с отличием, а возможностей вполне хватило бы на то, чтобы открыть собственную клинику, а то и построить целую больницу. Но этого от него и ждал отец, уже смирившийся с выбором сына развиваться именно в медицине. Поэтому Германн снова сделал то, чего от него никто не ждал — подписал военный контракт и отправился на Ближний Восток в составе сил НАТО. Молодому и своевольному Германну хотелось окончательно порвать с отцовским миром и заодно проверить себя там, где все красивые слова о долге, чести и человеческой жизни перестают что-либо значить.","И война быстро показала гораздо больше, чем он рассчитывал увидеть. Он служил в полевом госпитале, видел последствия боевых действий и довольно скоро понял, насколько хрупкой могут быть человеческая жизнь и психика. И мораль.","В какой-то момент эту последнюю грань он и переступил. Не один раз. Сперва это случилось из ярости. Потом — из мести. А после он наконец осознал, что абсолютная власть над человеческой жизнью и возможность не только спасти из долга, но и отнять ее из прихоти, приносят ему настоящее удовлетворение.","А еще оказалось, что его знания о человеческом теле прекрасно подходят и для того, чтобы причинять боль. Причем делать это точно, долго и без случайных казусов. Для человека, который привык считать себя рациональным, разница между врачом и палачом оказалась пугающе небольшой, ведь выпытывая информацию у одного врага, он спасал множество жизней союзников.","Вернувшись с войны, он обнаружил, что мирная жизнь ему больше не подходит. Его преследовали привычная настороженность, необходимость контролировать все вокруг и постоянное ожидание угрозы. Но дело было не только в последствиях войны. Он успел узнать, что такое настоящая власть над человеком и, что гораздо хуже, ему это понравилось. Безнаказанность давала ощущение свободы, которого он никогда прежде не испытывал.","Благодаря армейским связям, он довольно быстро оказался в одной из частных военных компаний. Оттуда путь в закрытый синдикат оказался уже не таким длинным. Поначалу его использовали по привычному назначению: он стал тем, кто допрашивал, пытал и карал тех, кого внутри клана считали предателями, угрозой или просто недостаточно полезными. И со своей работой он справлялся прекрасно.","Однако, его болезненная настороженность, привычка просчитывать угрозы на несколько шагов вперед и почти патологическая потребность держать под контролем все, что происходит вокруг, оказались гораздо полезнее для охраны Виллы. Так он стал Комендантом Цитадели — человеком, отвечающим не только за гарнизон и оборону, но фактически за то, чтобы в его доме все происходило именно так, как должно.","Финансово он никогда не нуждался в клане, да и деньги никогда не были для него главным. Но в клане он неожиданно нашел то, чего не смогли дать ни семья, ни университет, ни армия: место, где его не пытались переделать. Здесь его жестокость оказалась не пороком, который необходимо скрывать, а инструментом. Потребность в контроле — не паранойей, а бесценным качеством. А верность — не обязанностью перед фамилией, а собственным выбором. Поэтому клан он действительно ценит. Не сентиментально и не слепо, ведь он вообще не слишком способен на подобные чувства, но глубоко и искренне. Расчетливо. Для него это дом. А Вилла — его территория, его ответственность и, в каком-то смысле, продолжение его самого. Он охраняет ее не потому, что так написано в должностной инструкции. Он охраняет ее потому, что если кто-то угрожает Цитадели, тот угрожает его Дому. А подобного он никогда не позволит и не простит."],"ability":["Имеет медицинское образование и большой практический опыт, включая навыки военной медицины и работы с тяжелыми травмами. Хорошо знает анатомию человека, способен быстро оценить состояние пострадавшего и оказать экстренную помощь.","Имеет военную подготовку, умеет обращаться с оружием и организовывать оборону объекта. Хорошо ориентируется в вопросах безопасности, контроля периметра, пропускного режима и внутренней дисциплины.","Отличается высокой стрессоустойчивостью. В критических ситуациях практически не подвержен панике и способен принимать рациональные решения при дефиците времени.","Хорошо читает людей, наблюдателен, умеет замечать слабости собеседника и использовать их при необходимости. Умен и способен производить впечатление совершенно нормального, благоразумного и даже приятного человека.","Меткий стрелок. Занимался боксом в студенческие годы.","Помимо основных европейских языков, немного знает латынь и еще меньше понимает арабскую речь."],"weaknesses":["Главная его слабость — убежденность в собственной правоте. Он способен рационализировать и оправдать практически любое свое решение, если считает его необходимым или справедливым.","Ему трудно отказаться от контроля. Потеря влияния над ситуацией раздражает его значительно сильнее, чем открытая угроза физической расправы.","С возрастом все чаще проявляется неспособность воспринимать мир без постоянной оценки угроз и рисков.","Уверенность в справедливости личного морального кодекса делает его уязвимым перед людьми, способными заставить его усомниться в собственных принципах.","Недооценивает людей, которыми руководит. Привыкнув быть тем, кто принимает решения, он иногда забывает, что подчиненные могут обладать собственными интересами, страхами и скрытыми мотивами.","Из-за эмоциональной холодности и отсутствия потребности в дружеском общении, порою может не замечать подковерные игры, возникшие из-за нерациональных межличностных конфликтов."],"hobby":["Медицина как область знаний до сих пор остается его интеллектуальным увлечением. Он читает профессиональную литературу и поддерживает знания, которые уже давно не обязан использовать ежедневно.","Коллекционирует холодное оружие.","Вырезает небольшие фигурки из дерева."],"features":["Чем серьезнее ситуация, тем тише и спокойнее становится его речь.","По привычке замечает состояние здоровья окружающих: оттенок кожи, походку, дыхание, следы недосыпа и тд.","Не любит бессмысленную жестокость и считает ее признаком отсутствия самоконтроля.","Способен искренне доброжелательно зашить человеку рану, а через пару минут пустить ему пулю в лоб. Для него эти вещи не противоречат друг другу.","В быту аккуратен и педантичен.","Католик.","\"Будем же вежливы до последнего всхлипа своей жертвы.\"","\"Нет ничего хуже, чем человеческий фактор.\"","\"Jedem das Seine.\"","\"Ordnung muss sein.\""],"appearance":["\"Высшее образование на лбу написано\".","Высокий мужчина крепкого, подтянутого телосложения.","Волосы русые, коротко подстриженные, с естественной проседью. Взгляд спокойный и внимательный, мимика и жестикуляция весьма скупы. В состоянии покоя лицо может казаться даже доброжелательным.","Одевается дорого, но без показной роскоши, предпочитая вечную классику.","Сохраняет аккуратность и выправку человека с военным прошлым.","В целом производит впечатление успешного, воспитанного и вполне респектабельного мужчины. В нем довольно трудно заподозрить человека, способного без колебаний отнять чужую жизнь."]},"stats":{"Сила":5,"Ловкость":5,"Интеллект":5,"Харизма":0,"Восприятие":5},"tracks":["Королевство кривых — Пикник"],"photo":"images/hermann.jpg","archived":false},{"id":"darell-raven","name":"Дарелл Рейвен","aka":["Darell Raven"],"tags":["THE LAB"],"age":["31"],"role":["Врач-хирург.","Специализация: трансплантационная хирургия.","До попадания в клан работал хирургом-трансплантологом в подпольной североевропейской организации.","Не является наемником."],"orient":["Бисексуал."],"player":{"name":"Дарелл Рейвен","url":"https://vk.ru/play_with_black_cat"},"date":"25 сен в 1:19","epigraph":null,"sections":{"character":["Рейвен тревожный и старается действовать так, как требует того ситуация. Склонен прокручивать в голове возможные сценарии и заранее готовит алгоритмы действий. Часто использует сарказм как способ защититься от напряжения, страха или ощущения беспомощности, из-за чего способен говорить лишнее даже в ситуациях, когда разумнее было бы промолчать. К прямому насилию относится отрицательно, бессмысленную жестокость переносит особенно плохо. При этом профессионально устойчив к виду крови, тяжёлым травмам и мертвым, если воспринимает происходящее именно как медицинскую ситуацию. В конфликте предпочитает искать выход, договариваться, анализировать, а не вступать в прямое силовое столкновение. Под сильным давлением становится заметно раздражительным, резким и разговорчивым. Плохо переносит зависимость от других людей и особенно тяжело дается отсутствие контроля над собственной жизнью."],"biography":["Отец Дарелла — немец, мать — американка. Медицинское образование получил в Германии, после чего начал работать в обычной клинике и продолжил специализацию в хирургии. Основным направлением стала трансплантационная хирургия. К тридцати годам уже являлся квалифицированным хирургом и имел около года самостоятельной практики в сфере трансплантации. Во время работы в клинике одним из его пациентов оказался человек, связанный с крупной подпольной организацией, действующей преимущественно в северной и центральной Европе. Работа Рейвена заинтересовала организацию настолько, что вскоре ему фактически сообщили о смене работодателя. Возможность отказаться существовала только формально: попытка уйти, сбежать или обратиться за помощью означала смерть. Первое время он пытался искать выход, однако постоянный контроль и возможности структуры быстро показали бесперспективность подобных попыток. Со временем ему пришлось приспособиться. Работа хорошо оплачивалась, организация обеспечивала высокий уровень жизни, качественное оборудование и постоянную сложную хирургическую практику, поэтому внутри этой системы он постепенно выстроил относительно устойчивое существование, несмотря на отсутствие настоящей свободы.","На Окинаву был отправлен по рабочему заданию как хирург-трансплантолог для проведения операции непосредственно на месте."],"ability":["Холодная голова в стрессовых ситуациях","Знание анатомии. Оказание неотложной помощи.","Есть права на вождение мотоцикла.","Есть навыки владения холодным оружием, и огнестрельным на средней дистанции.","Повышенный болевой порог"],"weaknesses":["Бессонница. Страдает кошмарами. Тревожность. Клаустрофобия.","Маленькая социальная батарейка","Не умеет плавать.","Плохо понимает намёки","Страдает Анемией"],"hobby":["Свободная езда на мотоцикле","Паркур","Ходит в котокафе и контактные зоопарки","Ухаживает за своим котом"],"features":["За левым ухом расположена небольшая татуировка в виде буквы «T», являвшаяся знаком прежней организации. Там же находился отслеживающий имплант.","Есть большой шрам на загривке."],"appearance":["Рост/вес 180/70. Тёмные короткие волосы, зеленые глаза. Жилистый и ловкий. На задней поверхности шеи обширный шрам. Из-за худобы и недосыпа выглядит болезненным.","Прототип внешности.","ИИ"]},"stats":{"Сила":3,"Ловкость":5,"Интеллект":5,"Восприятие":4,"Харизма":3},"tracks":["Run — AIM WIND X","GASOLINE — Måneskin","Sound Of The Police — Bonka & Acina","Insurgent — BUKO feat. Edgars Bukovskis"],"photo":"images/darell-raven.jpg","archived":false},{"id":"dever","name":"Девер Брант","aka":["Dever Brand","Дев"],"tags":["TARGET ELIMINATION"],"age":["24"],"role":["Уборщик, в прошлом цветок HORTUS"],"orient":["Пансексуал. Никого не хочет, но готов со всеми, только вы с ним не готовы. И он этому рад."],"player":{"name":"'necessari 'arson","url":"https://vk.ru/nuwton"},"date":"23 авг в 22:34","epigraph":null,"sections":{"character":["Смурной и неразговорчивый молодой человек. Стал тенью и вполне вписывается в это понятие. Не так уж плох на характер, каким может показаться благодаря волчьему взгляду и образу. Мог бы быть острым на язык, вместо этого выражает все субтитрами на лице и неприличными жестами. Потрепан жизнью, потому цели на нее имеет крайне скромные. Жить пока дают и ловить момент."],"biography":["Детство и юность Дева не особо примечательное. Единственный ребенок в семье до 12 лет, потом подростковый бунт на фоне нехватки родительского внимания, старший сын больше не ребенок, помощник, нянька и самостоятельная личность. И чем взрослее личность, тем больше попыток из кожи вон вылезти, чтобы такого даже не думали подпускать к малышке.","Загулы начались примерно в то же время, когда вокруг глаз появился размазанный черный карандаш, а уши постепенно стали обрастать железками. Апогеем тусовок случился, когда та обдолбанная дура утянула Дева целоваться и с какого-то хера решила откусить парню язык. Это была даже не его девушка. Ему просто не повезло.","Больница и домашний арест в строгом режиме, родители были уверены, Девер и сам едва не сторчался в той компании. Забавно, что до наркотиков он так и не дошел. Уязвленная гордость и доверие не позволили убеждать предков в обратном.","Загадывать не нужно, каждый знает, что следует за таким отношением в семье. Девер оборвал все связи с концами, перебрался в комнатушку и устроился мойщиком в дрянную забегаловку. Пару раз случайно встречался взглядами с сестрой через детскую площадку, когда та уже успела пойти в началку. И шел мимо.","Не наученный горьким опытом, Дев продолжал прожигать жизнь между сменами и попойками. Одна из таких в закрытом клубе кончилась для него в очередной раз плачевно. Брант не помнит, что за люди это были, только отрывок посреди пустоты, как очнулся в гремящей темноте и утонул обратно. Очередные незнакомцы решили его судьбу, одобрили в качестве \"цветка\", сказали, что ему повезло, это лучшая из альтернатив. За время обучения и подготовки Дев успел свыкнуться с мыслями о предстоящем, старался искать плюсы и в этом положении. Это же не кастрюли драить за гроши.","А потом пошли заказы. Один из первых, он нарвался не на того ублюдка. Как и всегда, несправедливо невезуч. Эта сессия кончилась довольно однозначно, результаты анализов не дадут соврать. ВИЧ инфекция. Ему выдали красной тревожной кнопкой \"непригоден\". Так Девер до чертиков перепуганный оказался во владениях мясника.","Единственным по-настоящему везучим моментом в его жизни можно назвать именно этот, точнее конкретно тот, когда Шеф не начал ликвидацию, а вышел по зову других важных дел. Судьба подкинула возможность, воспаленный стрессующий мозг зацепился за налет и грязь инструментов. Вспомнилась та кухня, на которой он бесконечные часы оттирал горы кастрюль и ножей от жира. Дев все бы отдал, чтобы оказаться сейчас именно там. Вероятно, руки сами взялись за работу, чтобы мозг совсем не сошел с ума. Потому что задорный смешок Шефа отрезвил, как и комментарий, что такого можно и в качестве уборщика оставить. Случайность тогда спасла ему жизнь. Пускай в таких местах с таким диагнозом долго не живут, у него есть еще несколько лет впереди."],"ability":["За свою жизнь до Лиар не особо то в чем-то и преуспел, но во время подготовки обучился многим вещам, которыми цветок обладать просто обязан. Этикет, подача себя и образа, владение музыкальными инструментами.","Так же во время подготовки с ним занимался логопед, в следствии чего, удалось немного вытянуть произношение, уйти от совсем дефектного, прийти к варианту, при котором особенность еще можно было выдать за шарм."],"weaknesses":["ВИЧ инфицирован.","Невезуч по жизни, и это задевает до нервно сжатых челюстей.","За хмурым лицом и колючками прячется обиженный и напуганный ребенок, не готовый ко всему этому дерьму.","Первое время блевал в туалетах после уборок, надеется, что этого никто не видел.","Держится за шанс на жизнь, после того, как чуть не стал мясом."],"hobby":["Действительно любит музыку. Петь по понятным причинам не может, но умеет играть на гитаре и ударных. Пока был цветком, имел доступ кинструментам. Сейчас из доступного наушники с электро-панк-роком."],"features":["Из-за болезни крайне тщательно следит за средствами защиты во время уборки, запакован по максимуму во время работы.","Стесняется своего дефекта речи, поэтому привык молча выражать все, что обычно доносят словами через рот.","Деверу нравится подработка в автомойке, с машинами работать приятнее, чем с человеческими остатками.","После обнаружение инфекции и помилования очутился в закрытом блоке Лабораторий, под наблюдением главного врача. Провел там достаточно времени, прежде чем наконец приступить к своим новым обязанностям.","Чтобы не полесть со скуки на стены, в свободное от обследований время, читал доступные книги, рисовал и писал ноты в блокнот. Не так уж и плохо."],"appearance":["Рост 185, вес 70. Самой главной отличительной особенностью является частично отрезанный язык, левой стороны от кончика на 2 сантиметра нет, из-за этой деформации начал шепелявить. Имеет множество пирсинга на лице и в ушах, если на время бытия цветком мог отказываться от подобного антуража, когда стал более свободным в выборе образа, продолжает носить все украшения. На своих короткий почти черных волосах прядь окрашена синим.","Прототип: Хейден Кристенсен."]},"stats":{"Сила":5,"Ловкость":6,"Интеллект":5,"Харизма":2,"Восприятие":2},"tracks":["Pay For It — Mindless Self Indulgence","Animal — Mindless Self Indulgence"],"photo":"images/dever.jpg","archived":false},{"id":"esser","name":"Джеймс Эссер","aka":["James Esser","Куда чаще используют просто его фамилию – Эссер"],"age":["35 лет | 23.04"],"role":["THE LAB | Патологоанатом"],"orient":["Демисексуален."],"tags":["THE LAB"],"player":{"name":"Utoshka Nepivo","url":"https://vk.ru/i_could_have_stopped_it"},"date":"5 авг в 3:15","epigraph":null,"sections":{"character":["– Немного наблюдательности, терпения и осознание напрашивается само собой – Джеймс Эссер есть воплощение самой охоты, дикой и страстной, самозабвенной, а в том и мастерски исполненной от и до. Всяк существо, будь то человек разумный или же вольный зверь, может стать целью его поисков. Он рассудителен, спокоен и расчётлив, иллюзию собственного контроля распыляя точно яд – что блеф, что ложь, в сей деле инструменты все подходят.","Не проживёт долго тот, кто мыслит не об одном лишь себе – Джеймс прекрасно то знает, а с тем и беспокоится лишь о шкуре собственной, не обременяя себя заботами в лице людей сторонних. Не дарует хрупкую иллюзию власти над собой, лишая дозволения держать на поводке да помыкать, точно цепной собакой. Служить, впрочем, научен – с покорностью склоняет голову и указаниям последует, лишив и шанса свою выгоду узреть иным.","Хладнокровен в мере достаточной, чтоб жизнь чужую мерить сталью да не дрогнувшей рукой, к самой Смерти испытывая странную лояльность. Близость её – обыденная мелочь, а посему не беспокоят Эссера все проявления сей вечной."],"biography":["– Джеймс Эссер – человек без прошлого.","Если зарыться с головой во всевозможные документы, то можно обнаружить крайне неприятный факт – сей человек существует немногим более одной декады, а с тем и лишает возможности найти хоть какие-то жалкие крупицы, связанные с собственным прошлым. Настоящим прошлым, а не той выдумкой, что выдаёшь прямо на ходу, когда возникает подобная необходимость. А при жизни подобной она рано или поздно возникнет, вынуждая запоминать крупицы своей выдуманной жизни, лишь бы не позволить кому-то поймать себя на лжи.","Самое старое упоминание – и с тем одно из первых – клеймит Джеймса Эссера персоной нон-грата на территории туманного Альбиона. К чужому сожалению, да его личному счастью – официальных документов об инциденте, произошедшем в те годы, попросту не осталось, а само имя осело на языках немногих знающих, разумно распоряжающихся данной информацией. От того условному большинству остаётся лишь строить свои предположения относительно того, по какой причине человек может оказаться выставлен из страны не официально, угодив в ящик. Сродни тем, в которых представители иных стран наивно надеются пересечь океан, отыскав за ним новую жизнь.","О гробах разговор пойдёт несколько позже…","Немалый кусок жизни пришёлся на жизнь в США.","Всё же, когда ты буквально никто – это по-своему развязывает руки, разве нет? А когда разум, отравленный болью и странными устоями, начинает чувствовать эту свободу… резонно начать считать, что место сей человеку отнюдь не среди вольного народа, а где-нибудь за высокими ограждениями, да только отнюдь не на цепи. Максимум – среди мягкой обивки и крепкой вязи смирительных рубашек, да вот только для подобного Эссер оказался на редкость неуловимым и благоразумным, даже если потрошение ещё живых людей невозможно назвать благоразумием, как не крути.","Наверное, тогда их свело именно неблагоразумие.","Разделочный стол мясника сменился аккуратным столиком на двоих, обрастая ужином при свечах да неформальной атмосферой – почти интимной, если отголоски рычащего французского счесть чуть более возбуждающими, чем положено в рамках общей отчётности.","Это же самое неблагоразумие невольно сменило их роли за этим ужином.","А после, кажется, и началась та паскудная история, разве нет?","Чужое хрупкое эго не выдержало отказа – рассыпалось ворохом осколков и угодило в чужую глазницу, избавив от вещей столь необходимых человеку, как объемное зрение. Все ведь в курсе, что для осознания глубины пространства жизненно необходим второй глаз, верно? Джеймсу пришлось постигать эту истину горьким опытом уже после того, как он перестал истекать кровью и нести бред от её острой нехватки.","Признаться, он так для себя и не решился осознать, что более позабавило в том его вечную спутницу – сам факт бесчисленных неудобств, принесённых мсье Коллеру в лице разлитых жидкостей и роняемых вещей, или же паскудное положение самого Джеймса, занимающего хозяйское ложе и оставляющего багряные разводы на постельном белье. Собственная участь уж точно её не забавляла – какой инструмент вообще пожелает пылиться на полке, денно и нощно наблюдая за бездействием своего владельца? Вот и ей то было неугодно, как и местный хозяин, навечно покинувший список имён из дневника Джеймса Эссера.","Они разошлись мирно.","С угрозами, конечно же – куда же без них? – но мирно. Быть может, недостаточно лелея мысль о том, что новой встречи можно было не ждать.","А с тем и встретившись вновь.","За океаном, в совершенно иных декорациях и условиях – без охоты и выслеживания, без стараний угодить и подобраться ближе, без ледяной стали, выжидающей своего момента и уж тем более без планов, согласно которым ещё теплые лопатки пропитаются хладом разделочного стола. Но с предложением. Таким, от которых не принято отказываться по ряду причин, среди которых можно обозначить лишь две – истинную и выдаваемую за истину.","С тех пор забота о том, кто теперь есть Джеймс Эссер, полностью легла на плечи мсье Коллера, а имя самого Эссера оказалось в списке, но уже совершенно ином. Пусть то и не было привычной разделкой тел, но должность патологоанатома пришлась англичанину по вкусу – работать с мёртвыми было на порядок проще и приятней, чем с живыми, а потому сей факта и оказалось достаточно, чтобы задержаться на новом месте, покладисто исполняя все вверяемые ему задачи и поручения."],"ability":["– Охота – любимое хобби, которому время от времени отдаётся Эссер, уезжая в безлюдные дебри, дабы добыть очередной охотничий трофей, шкуры или вырезку. Обожает скорей сам процесс, нежели результат, да и навыками достаточными обладает, дабы умело обращаться с тушей. Стреляет достаточно метко, особенно для человека без объемного зрения.","– Умеет фехтовать и обладает достаточными навыками ведения ближнего боя, чтобы до сих пор оставаться живым. После потери глаза был вынужден переучиваться методом проб и ошибок.","– Владеет навыками выживания в дикой среде, быстро адаптируясь к условиям различных территорий своего обитания.","– Разбирается в некоторых диких травах. Не обладает какими-то сверхъестественными познаниями, но знает большинство народных поверий, связанных с ними, так же имея знания насчёт некоторых ядов и способов их добычи или изготовления.","– Прекрасно готовит и считает готовку скорей своим хобби, ведь сам процесс расслабляет и по-своему увлекает.","– Умеет ездить верхом и заботиться о лошадях. Несмотря на отсутствие глаза неплохо управляется с автомобилем и быстро обучается вождению другим транспортом, в том числе водным.","– Обладает достаточными познаниями в медицине и анатомии, чтобы ему можно было доверить роль патологоанатома. С живыми, впрочем, работать тоже может, но куда более поверхностно – заботясь в первую очередь об оказании первичной помощи, чтобы пострадавший банально дожил до прибытия специалистов.","– Его родной язык – британский английский, но помимо него Эссер также овладел французским и американским английским.","– Для поддержания статуса человека с достойным происхождением поверхностно изучил ряд наук, в основном – гуманитарных, куда сложней пришлось с техническими отраслями, к которым он расположен многим меньше. Обладает пониманием большинства наук исключительно в общих чертах, являясь носителем точечных глубинных познаний, что время от времени способен изречь как занятный факт, но не более."],"weaknesses":["– Страдает от батофобии – боязни глубины, а потому рядом с глубокой водой чувствует себя крайне некомфортно. Предпочитает лишний раз без весомого повода в воду не попадать.","– Потерял глаз благодаря стараниям мсье Коллера, из-за чего лишён объемного зрения и части угла обзора. И если с первым ещё можно справиться силой привычки, то вот второе, увы, уже не исправить.","– В одиночестве имеет крайне беспокойный сон, из-за чего предпочитает иллюзию компании, ну или же непосредственную компанию.","– Религиозен."],"hobby":["– Охота – главная страсть Эссера, если говорить о личных увлечениях. В большинстве своём охотится англичанин на людей, но для души, всё же, предпочитает вести охоту на зверя и с большим удовольствием выбирается на природу.","– Религия, пожалуй. Самобичевание, самоистязание, обеты и прочие прелести, вытекающие из странной религиозности.","– Разговоры с Мэри."],"features":["– Поклонник официальных обращений, не дозволяет себе вольностей в общении с кем-либо и всегда придерживается уважительного тона.","– Из алкоголя предпочитает бурбон, пристрастившись к нему за годы жизни на территории США. Из безалкогольных напитков отдаёт предпочтение чаю.","– Имеет привычку вести дневник, в котором довольно много пишет и даже рисует, пускай и не так часто.","– Поклонник театра и оперы."],"appearance":["– Данила Ковалев.","– Рост 178 см.","– Аристократичных черт да силуэта мужчина, обладающий средним ростом и довольно стройным телосложением. Мертвенная бледность контрастирует с тёмными, бурыми волосами, что едва вьются и тянутся ниже плеч – обыденно часть волос убирается с лица, собираясь в небольшой хвост. Черты лица угловатые, остро выражены скулы, нос награждён горбинкой – надломом старым, что изъяном лёг на лик мужской, да всё равно картины общей смертельно не портит. Глаза, выражающие спокойствие да холодом отдающие, фиалкового отлива, один глаз отсутствует – на его месте небольшая впадина, что прикрыта от глаз чужих повязкой. Тело хранит на себе множество старых шрамов, но самые яркие из них расположены на спине – следы истязаний собственных, дарованных самим собой за прегрешения непростительные.","– В одежде предпочитает классические костюмы и в целом является поклонником делового стиля. Держит гардероб собственный преимущественно в чёрных тонах, но бывают и исключения."]},"stats":{"Сила":3,"Ловкость":10,"Интеллект":5,"Восприятие":1,"Харизма":1},"tracks":["Broken Inside — Broken Iris","Where Butterflies Never Die — Broken Iris","On My Own — Broken Iris"],"photo":"images/esser.jpg","archived":false},{"id":"james-bucky-barnes","name":"Джеймс «Баки» Барнс","aka":["James \"Bucky\" Barnes","Зимний","Зима","Призрак"],"tags":["TARGET ELIMINATION"],"age":["38 лет, когда улыбается, выглядит значительно моложе"],"role":["Оперативник Шан, наемник","Sexual orientational:","Бисексуален, универсален."],"orient":[],"player":{"name":"Серж Ригель","url":"https://vk.ru/poshlovsyodalekonahuy"},"date":"5 окт в 13:44","epigraph":null,"sections":{"character":["В основном спокойный. Не любит ссоры ради ссор и спо ногое починить сам. Хорошо готовит и любит это делать, способен приготовить восемь блюд из одной картошки."],"features":["Крайне хозяйственен и запаслив как хомяк.","Не дурак вкусно поесть.","Способен перепить многих, почти не пьянеет.","Искушенный и выносливый любовник.","В далекой молодости серцеед и балагур."],"appearance":["Рост 188, вес 95 кг. Красив как картины Батичелли, холоден как андроид.","Высокий, рослый, широкоплечий и сильный. Рельефное и выносливое тело. Крепкий от природы. Светло серые, стального цвета глаза, шелковистые, мягкие, чуть вьющиеся темно-каштановые волосы почти до плеч, которые то и дело носит в пучке или хвосте. На левой руке огромный тату рукав: от кончиков пальцев до лопатки, закрывающий множественные шрамы.","Прототип внешности: Себастиан Стэн","С правилами ознакомлен"]},"stats":{"Сила":5,"Ловкость":5,"Интеллект":5,"Харизма":0,"Восприятие":5},"tracks":[],"photo":"images/james-bucky-barnes.jpg","archived":false},{"id":"douglas","name":"Дуглас Роуч","aka":["Douglas Roach"],"age":["47 лет."],"role":["капитан ликвидации."],"orient":["гет."],"tags":["TARGET ELIMINATION"],"player":{"name":"Kiss Urgently","url":"https://vk.ru/id860458894"},"date":"4 мая в 19:55","epigraph":null,"sections":{"character":["Дуглас - эталон спокойствия. Он не ведется на пустые провокации и не вмешивается в то, что его не касается, что делает его идеальным волком-одиночкой в стае настоящих хищников. Вежлив и обходителен, но чертовски прямолинеен — и не считает это грубостью, потому что для него честность — это про уважение, а не про желание обидеть. Он честен с самим собой и другими, но придерживается позиции, что говорить правду не всегда умно, особенно когда твоя жизнь зависит от каждой сказанной фразы. И тем не менее Дуглас никогда не требует от других того, что не способен выполнить сам.","В стрессовых ситуациях не ругается и не паникует, потому как на эмоции просто нету времени. Он думает и действует. Зачастую второе чуть опережает первое.","Он может казаться дружелюбным — умеет улыбнуться, поддержать разговор, создать иллюзию своего, но это скорее навык, чем природное свойство. Настоящая дружба для него — роскошь, которую он не может себе позволить. Он не ищет врагов, но и не боится их создавать. Умеет говорить ровно столько, сколько нужно, и молчать — когда молчание спасает жизнь.","Но честное слово, если вам удастся вывести его из себя, вы будете чертовски умным человеком, если сию минуту покинете страну. На недругов он не бросается как бешеная собака, а изводит, пока те сам не выпилятся.  Его гнев — редкий, холодный и абсолютно разрушительный. Дуглас имеет строгий и ответственный подход к работе, а также свои принципы, которым не изменяет. Он устал — в глазах та вечная тяжесть, которая бывает у людей, слишком долго смотревших в бездну. Но он не сломлен. И это, пожалуй, самое опасное в нем."],"biography":["Дуглас Роуч родился в маленьком шахтёрском городке, где все друг друга знали, а полицейский участок работал по принципу «своих не сдаём». Отец работал на шахте, мать — медсестрой. Никакого криминала в семье, никакого геройства. Просто бедность и скука.","В восемнадцать он поступил в полицейскую академию не по призванию, а потому что это был единственный вариант уехать из городка и не копать уголь. В академии его определили в усиленную программу тактической подготовки. Рукопашный бой, стрельба, тактика малых групп — он впитывал это как губка.","Первые десять лет — патруль, потом отдел по борьбе с уличной преступностью. Там он набил первые реальные шишки: ночные задержания, перестрелки и даже обычный мордобой. В тридцать его завербовали в отдел по особо важным делам, где тактическая подготовка стала основным инструментом.","Первое долгосрочное внедрение — байкерский клуб бонхедов. Полтора года. Дуглас быстро зарекомендовал себя как человек, который не пасует перед стволом и умеет разруливать силовые ситуации без лишнего шума. Он вышел чистым, клуб развалился, лидеры сели.","Второе внедрение — оружейный трафик. Два года. Там он впервые переступил черту — не убил, но позволил преступлению случиться, чтобы сохранить легенду. После завершения операции пришёл к начальству и попросил отстранения. Сказал: «Я больше не чувствую грань». Ему дали год на административной работе.","Но навыки никуда не делись. Он продолжал стрелять в тире, продолжал тренироваться — скорее по привычке, чем ради дела.","В сорок три ему поступило предложение. Клан. Серьёзный. Многолетняя операция. Агент под прикрытием провалился — его нашли с перерезанным горлом в лесу. Нужен был кто-то, кто умеет быть своим среди чужих, не теряет себя и при этом имеет реальный боевой опыт. Кто может не просто сидеть и слушать, а взять в руки оружие, когда потребуется, и не дрогнуть.","Дуглас согласился.","Подчинённые уважают его за то, что он не шлёт людей на верную смерть и нахуй. Если он говорит «отбой», значит, есть риск. Если говорит «работаем», значит, план просчитан до нескольких запасных путей. Никогда не задаёт лишних вопросов. Никто не знает, что на самом деле он собирает досье на каждого из них и что «подтверждённое устранение цели» в его отчётах для Клана выглядит иначе в рапортах, которые уходят наверх в департамент."],"ability":["- жилистое, сухое телосложение. Что не дает большой силы, но дает хорошую выносливость.","- высокий болевой порог.","- хорошая реакция.","- тактическое мышление, хорошая память.","- высокий эмоциональный интеллект и стрессоустойчивость.","- умеет работать с людьми, но предпочитает один, если есть возможность.","- хорошо владеет огнестрельным оружием, средне - рукопашным и ножом.","- контрнаблюдение - доверяет своему шестому чувству и ощущает, когда следят. Старается в такие момент «осесть» или устранить наблюдателя.","- способен оказать первую медицинскую помощь, но кости не вправит.","- хорошо ориентируется на местности.","- умеет водить машину и байк."],"weaknesses":["- короткие провалы в идентичности. Иногда забывается, на чьей он стороне.","- психосоматика. Слишком долго все держит в себе, из-за чего это выливается в бессонницу, тошноту, озноб и другие приколы с организмом. Может слышать то, чего нет на самом деле. Но это состояние приходит только ночью.","- нет якоря вне работы: ни семьи, ни детей, ни родни.","- шестое чувство не идеально — отлично чувствует слежку, но может принять паранойю за реальную угрозу. Дважды за карьеру ошибался и подставлял команду.","- некоторые старые травмы ноют в плохую погоду, особенно некогда раздробленное колено.","- плохо переносит жару."],"hobby":["- чай. Дугласа успокаивает процесс чайных церемоний, хотя он и не соблюдает все каноны.","- читает разную околоинтелектуальную и развивающую литературу. Книги вроде: «Беседы с богом», «Ненасильственное общение», «Чёрный лебедь» и др.","- любит кататься на мотоцикле. Не важно куда, просто само ощущение дороги, движения и одиночества."],"features":["- уже пять лет работает в клане и ни разу не дал усомниться в своей верности.","- видит яркие, осознанные сны и даже помнит их, но не все.","- соблюдает режим сна.","- не пьет, но курит.","- любит больше кошек, чем собак.","- легенда: бывший военный (не буду расписывать детали). Оттуда же — навыки, тактическое мышление и привычка не задавать лишних вопросов. Отсидел пять лет за непредумышленное убийство (конфликт в баре, по пьяни). Вышел — понял, что гражданка не для него, и пошел в наемники. Работал на разные контракты в Латинской Америке и Восточной Европе. В клане уже пять лет. Зарекомендовал как человека холодного, надежного и без лишних амбиций. Не болтлив. Не лезет на рожон. Работу делает чисто. Денег много не требует, но и за копейки не работает. Живет один. Семью не заводил (говорит — «не мое»).","- настоящее имя Джудас Кейн | Judas Kane."],"appearance":["- Рост 1.78 м. Вес  82 кг. Светлая кожа и глаза, тёмные волосы, зачастую засаленные и растрепанные. Мешки под глазами. Имеет несколько шрам от пуль и от лезвий, на руке — от укуса собаки. Пару партаков. Особенно примечательный — череп на левой кисти.","- Прототип внешности Норман Ридус."]},"stats":{"Сила":3,"Ловкость":5,"Интеллект":5,"Харизма":4,"Восприятие":4},"tracks":[],"photo":"images/douglas.jpg","archived":false},{"id":"iezavel","name":"Иезавель","aka":["Авель","Jezabel | Abel"],"age":["Биологический: 28 лет","Внешне: не дать и 22 лет."],"role":["Финансовый директор.","Вследствие прошлого умеет держать оружие, но лучше всего любит азартные игры и споры, а также допросы."],"orient":["Пансексуальна."],"tags":["THE BASE"],"player":{"name":"'the 'leviathan","url":"https://vk.ru/marinacatich"},"date":"26 июн в 18:15","epigraph":null,"sections":{"character":["Авель есть тот, кто был убит Каином за свою доброту. Но Иезавель, имея свое второе имя таким, заменяла Каина в истории. Меркантильность смешалась с надменностью. А миловидное личико обманчиво создает образ невинности. Только какая на самом деле Авель?","Никогда и ни при каких обстоятельствах не показывать свою слабость. Она спряталась под пеленой простого образа обыкновенной девушки. Разозлить, естественно, тяжело, но когда Авель в гневе, то улыбка становится слишком яркой и речи начинают пахнуть сладким. Она - опасность для тех, кто не может различить между правдой и ложью. Она есть демон среди человечества.","Нарциссично ведет себя. Любить может, но только когда это нужно. Живет и сама по принципу \"цель оправдывает средства\", не скупа потому на самые изощренные методы действий. Знает, чего хочет сама и человек, сидящий напротив, потому манипулирует. Начинает дергать за ниточки, чтобы привести того к нужному исходу. Разрушить брак или свести двух врагов... Никогда не узнаешь, где тут правда. Разлад, ссора и драка - последствия.","Актер спускается со сцены и все равно остается им же. Сыграть немощь? По щелчку пальцев. И люди в это поверят. Множество личностей для того, чтобы человек заплясал под дудку. И Вы не знаете, играет девушка сейчас роль или является самой собой. Она проведёт любого, по самым страшным вещам; окунет вновь в то, что не хотелось бы вспоминать. Ворошить прошлое, ради чего? Эмоции, они должны остаться яркими. Новый лабиринт души, потому её так ненавидят? За то, что она создает хаос и может привести к убийствам даже? Выбирайте: синяя таблетка - спасение собственной шкуры и смерть; красная - работа на больших теть и дядь. Они обе белые, действительно?","Она и сама порой боится сделать шаг. Как минимум не принимает, стоит молчать или же говорить? Ладно, молчать можно, когда идут совещания, а дальше собраться с одним великим сплетником, чтобы обсудить новости за бокалом чего-то крепкого. А после в новый день, с новыми давлениями на тех, кто молчит… Может стоит сделать ее “злым копом” на допросы? Все же ее иррациональное мышление погубит тех, кто к нему попросту не готов, но плата - собственная разумность."],"biography":["Жизнь Авель давно строится из Патров, как смесь горячей мексиканской мужской силы и греческой красоты женской натуры. Обычные стремления воспитать спокойной и красивой дамой, способной соблазнить искусно, а также блестнуть знаниями. Конечно, когда хотят воспитать лучшей во всем, постепенно что-то начинает темнеть. И в средней школе это открывалось как новый, неизведанный горизонт.","– Как думаете, сколько шрамов теперь на моей спине?","Дети иной раз жестоки. А богатство ее семьи, как и честь, может перечеркивать чью-то судьбу. Иначе не объяснить появление в жизни наемника. Тянулось со школьной скамьи до институтских знаний, а после дело времени. К сожалению заказ есть, его должны выполнить… Убить возможно всю семью, чтобы стереть их ген. Но увы, смерть приходит, и уходят те, кого считают красивыми. Или талантливыми.","Пропала одна фигура, умерла по бумагам, но появилась другая. Забитая в уголочек, страшащая любого шороха. Почему мужчине захотелось сохранить жизнь, никто из них не скажет, но появление Иезавели в стенах Клана ознаменовало явным присмотром со стороны. Приходилось уже с тех пор доказывать, что та не из робкого десятка.","– Я здесь, это не обсуждается. Иначе познакомитесь со второй версией меня.","Под присмотром приходилось изучать новое. Вникать в историю и профессию, местами принося пользу с технической частью. Доказать за пять лет, что она может быть полезна… А доверие со своим похитителем строится именно на их синергии работы."],"ability":["Иррациональное мышление сопровождает Иезавель всю свою сознательную жизнь.","Физические показатели слабее в силе. Преимущественно выигрывает за счет аналитики и ловкости.","При этом хорошо понимает анатомию тела, дабы защитить себя ударами по болевым точкам.","Сильна в стрельбе из малого калибра и арбалете, острота зрения позволяет.","Благодаря своему непосредственному начальнику смогла получить чуть больше знаний из области психологии и анализа.","Есть знания по оказанию СПМП.","Куда сильнее разбирается в химии, поступила на прикладную до “кражи”, ежели в гуманитарных науках.","Хорошо разбирается в технике, так как моложе остальных. И готова помочь освоить.","Общается свободно только на своем языке – греческом и испанском, с английским есть проблемы в некоторых словах."],"weaknesses":["Может из-за некоторой своей прямолинейности неправильно пошутить и задеть чувства и эмоции.","Гиперфиксация на абсолютном порядке и положении вещей. Если что-то стоит не так, как нужно, разбросано, то у Авель будет дергаться глаз.","Любой флирт в ее сторону не воспринимается всерьез. Признание чувств не для нее. Не умеет любить."],"hobby":["Слишком любит цветы, но увы, не может развести полисадник.","Довольствуется наличием двух кашпо искусственных цветов.","В качестве отвлечения выбирает игру на рояле.","Работает с одним наушником в ухе. Всегда, ибо без музыки, в тишине тяжело."],"features":["Слишком любит кислые фрукты. Виноград, гранат, цитрусовые… Все для нее.","Не пьет кофе, а бодрость получает в пуэре и смолах.","Не стесняется выйти в свет в пижаме, если посчитает ее спасением.","Факт выше происходит ввиду того, что Иезавель … сова. Просто сова.","Горячая греко-мексиканская кровь."],"appearance":["Она как маленькая серая мышка — едва приметная, едва яркая в одежде. Скромность в обличии. При ее метре шестидесяти остается все равно обладательницей стенического тела. Худоватые ручки, но при этом длинные пальцы. Невольно многие называют их пальцами музыканта или пианиста, но Авель даже не оскорбляется. Любовно улыбается и терпит разного рода оскорбления, особенно когда начинается сравнение с готический отродьем. Не всегда носит каблуки.","Худая, что немного выбивает из осознания, что уже не маленький ребёнок перед ними, а действительно девушка 28-и лет. Выглядит дай боже на двадцать. А на спине уже красуется татуировка в изгибах алых и чёрных паучих лилий, скрывая явные линии шрамов. На шее - число 7. На ключице – полумесяц и мелкие звезды. Вес, конечно же, всего 44 кг. А глаза темные, почти глубокого черного цвета, но обман зрения. Зрачки всегда расширены из-за увлажняющих капель.","Цвета одежды: чёрный, светло-бежевый, молочный, темно-синий, темно-зелёный, иногда акценты в алых цветах.","Длинные платья, иногда с корсетом. Брюки свободного кроя. Пиджаки. Топы.","Обычно ботинки, реже туфли на каблуках.","Парфюм: Tabacco Vanille (Tom Ford), Kirke (Tiziana Terenzi)","Alice Pagani , voice — Poppy","запас под хэды","III группа (В) Rh-"]},"stats":{"Сила":3,"Ловкость":5,"Интеллект":3,"Харизма":5,"Восприятие":4},"tracks":["Электролитургия — Гейл Дороти","Время сумерек — Детский метал-хор Всесоюзного радио, SOLNZE","Mikhail Popkov — SKYND","Forever Yours — The Villain Music","Bad Angel — Anyma, LISA","Church Outfit — Poppy","Sucker — Marcus King","Чёрное солнышко — pyrokinesis","ПАТОЛОГИЯ — di liberta, NKOHA","The Death Of Peace Of Mind — Bad Omens","Disassociate — Jutes","My Dark Disquiet — Poets of the Fall","Excuse Me — Nothing But Thieves","Toxic — VALORANT & KiNG MALA","ИЕЗАВЕЛЬ — ТЕППО"],"ageShort":"28 лет","photo":"images/iezavel.jpg","archived":false},{"id":"ian","name":"Йен Маршгрейв","aka":["Ian Marshgrave","Йо-йо, Топь"],"tags":["TARGET ELIMINATION"],"age":["44","когда побритый выглядит моложен своих лет"],"role":["Инквизитор Таргет"],"orient":["бисексуал"],"player":{"name":"Ian Marshgrave","url":"https://vk.ru/tellmebebe"},"date":"19 авг в 15:21","epigraph":null,"sections":{"character":["Холодно строгий, может долго наблюдать, слушать, но в моменте, без колебаний и жалости будет стрелять, если что-то идет не так. Для него нет своих, нет чужих, есть только правила и дисциплина.","И в тоже время он бывает нежен, бывает добр, в том случае когда и с ним так же. Работает по принципе зеркала, взаимоуважение, взаимопонимание, взаимопомощь (пусть с этим и есть некоторые проблемы в силу черты характера как «сам решу» и постоянное «полагаюсь только на себя»). Юморист, только с его лицом не всегда понятно шутка это или всерьез. Чаще делает, а не говорит. Малый эмоциональный спектр, некоторые эмоции он даже ещё ни разу не испытывал, поэтому и изобразить их не может. Но умеет ломать свою личность, чтобы что-то менять под окружение."],"biography":["Майями, бедный район. Слишком большая семья, чтобы ему уделяли должное внимание. Слишком безалаберные родители, чтобы заметить за ребенком, что он чаще не дома, а на улице не в той компании.","Сначала шестерка, потом вышибала, потом полноценный член банды района. Так начался его преступный путь. Долго он был таким, молодым горячим, ебанутым. С тех времен на нем висит слишком много преступлений, чтобы их перечислять, пусть он и не был пойман. Зато его поймал военком, который забрал его на службу после нескольких лет сбегания из-под призыва. Но это было зря. Так как Йен в неизвестном для себя приступе угнал военный вертолет и покинул армию..","Маршгрейв скрылся в Техасе, обосновался в небольшом городке на последние деньги и пошел работать охотником. Этого оказалось мало, потому что перестать кошмарить людей у него не получалось, и последний такой случай оставил за ним след из мертвых, но и в этот раз его не поймали, лишь пошел слух о серийном убийце. Он не оставлял отпечатков, не оставлял своих следов, а посл ировали в НЦБ Великобритании на пару лет.","жизнь, вроде бы, налаживалась, но как оно и бывает - ничто хорошее не длится вечно. при попытке расследовать очередное убийство, ниточки приводят её туда, куда не нужно соваться. Сандре было плевать, её цель - добраться до правды, и стоило ей копнуть чуть глубже, как она получила личный визит с настойчивой просьбой прекратить все попытки продолжить дело. угрожали ей не в первый раз, но Кассандра быстро смекнула, что имеет дело не с простой преступной группировкой, а с чем-то более тёмным и опасным. несмотря на это, она чётко дала понять, что отказываться исполнять свой долг перед государством она не собирается ни под каким предлогом. её оставили в покое, но выдохнуть и вернуться к делу не было суждено - по итогу главной подозреваемой в этом убийстве оказалась… сама Кассандра. разбирательств не было. был просто факт того, что её ищут, хотят кинуть за решётку и покончить с этим. покончить с ней. убрать, как назойливый сорняк.","без должности и полномочий, даже со связями и остатками доверия бывших коллег, Кассандра не смогла узнать достаточно подробностей, чтобы очистить своё имя. один из самых талантливых следователей Великобритании - и вдруг в розыске за совершение жестокого преступления. громкая новость среди работающих в охране порядка.","Кассандра в миг потеряла всё, без возможности вернуть обратно. за такое не прощают. за такое считают предателем. за такое вышвыривают, как ненужную псину, и закрывают дверь. иронично - уголовный розыск отказывается разыскивать тех, кто подставил их важного и нужного сотрудника. иронично и чертовски больно.","несмотря на не самое приятное знакомство с кланом, он был единственным местом, куда её были готовы принять и обеспечить безопасность, дать шанс на новую жизнь.","в клан её приняли как ту, кто знает изнанку чуть ли на интимном уровне. она не была частью мясорубки, но досконально её изучала и положила на это дело чуть ли не всю жизнь. её приняли, как ту, кого предала и выкинула система, ту, кого ударила и вышвырнула прочь кормящая рука."],"ability":["to bring the pieces back together, rediscover communication","• самое главное - внимание. без него Кассандра бы не смогла добиться того, что у неё имеется сейчас. мало что ускользает от её взгляда и некого шестого чувства следователя. она быстро схватывает, что что-то идёт не так. её взгляд - цепкий и крайне внимательный - выискивает всё до мелочей. так как она прекрасно знает, как преступники оставляют следы, она понимает как эти самые следы оставлять не стоит и каким образом их стоит убирать. как стоит себя вести, чтобы выудить от какого-нибудь отморозка признание в преступлении и как выяснить, что за этим преступлением стоит.","• из-за комплекции и генетики имеет хорошую толерантность к алкоголю. физически сильнее обычной женщины, да и подготовленному бойцу может вдарить от души хотя бы раз, если это потребуется, при этом не пренебрегая грязными и подлыми приёмами, хоть и предпочитает по большей части обходиться защитой и побегом, без лишнего насилия - курсы физ. подготовки и самообороны со времён вуза она помнит хорошо, да и опыт работы в полиции играет свою роль.","• общительна, красноречива, умеет располагать - душевности ей точно не занимать. она из тех, кто сначала может раздражать своей непринуждённостью и отсутствием фильтров, но позже ты выдыхаешь в её присутствии, зная, что она тебя примет, какие бы тараканы в голове ни плодились, предложит выпить с ней по бутылочке чего-нибудь вкусного и поговорить о наболевшем. быстро запоминает, что и кому нравится, кто какие напитки и литературу предпочитает, что для кого комфортно и удобно, чужие мелкие привычки и микроэкспресии. эмоциональная поддержка, дружеское плечо в трудный момент, возможность выговориться - это всё она готова предоставить в любой момент."],"weaknesses":["• на удивление плохо обращается с огнестрелом и его не любит. понимает, как перезаряжать, целиться и стрелять, но сама шутит, что может быть, даже сможет отличить дробовик от винтовки, в теории.","• достаточно сильна, но ловкость или скорость - это точно не её конёк. бегает не быстро, уклоняется с трудом.","• аллергия на цветочную пыльцу. несильная, но неудобств предоставляет достаточно.","• близорука, зрение -3, носит линзы.","• винит себя за всё. вообще за всё. любой мелкий прокол, любая ошибка - и Сандра начинает себя ненавидеть, что проявляется в неосознанном причинении вреда самой себе: отказа от сна и еды/переедание, отказ от развлечений, переработки, расчёсывание костяшек и кусание губ до крови. всё это проходит по флагманом установки “не заслужила, должна страдать, должна терпеть, должна понести наказание за ошибку”.","• из-за отсутствия связи с семьёй и бывшими коллегами, очень чувствительна к любой информации, связанной с родителями и друзьями с работы в CID."],"hobby":["• любит готовку, но для неё это больше медитативный процесс, чем попытки сделать какие-то изыски, хотя и поэкспериментировать она иногда тоже может. по большей части, именно готовка является её языком любви и заботы.","• увлекается коллекционированием \"Алисы в Стране Чудес\" и \"Алисы в Зазеркалье\" - ищет подарочные и редкие издания.","• поигрывает на гитаре, реже - на ударных, если есть возможность. за первое благодарит мать, а второе - наследие попыток создать рок-группу во время учёбы в университете.","• знает тысячу и один занимательный факт про нестандартные музыкальные размеры. когда задумывается, настукивает пальцами различные ритмические фигуры."],"features":["• курящая и выпивающая. очень любит джин-тоник, чаще всего предпочитая его другим алкогольным напиткам.","• католичка, но отношения с религией у неё очень неоднозначные.","• искренне любит вкусно покушать. еда для неё - это не просто источник энергии, а искусство и способ получить удовольствие. а ещё постоянно хрустит сырыми овощами - морковью, сельдереем, огурцами.","• знает британский язык жестов на продвинутом уровне.","• не ест острое, абсолютно не понимает удовольствия от поедания острой пищи.","• постоянно пытается изучить немецкий, но с такой же частотой бросает, сейчас почти дотягивает до уровня А2.","• говорит на шотландском английском, из-за чего её бывает трудно понять, особенно если она говорит быстро (попробуйте попросить её сказать purple burglar alarm - и вы станете её кровным врагом до скончания веков). знает гэльский, но начинает потихоньку забывать, потому что не с кем на нём говорить, кроме отца, с которым пришлось прервать связи по очевидным причинам.","• имеет удивительную способность засыпать в любой позе и при любых обстоятельствах, если нужно - последствие постоянных разъездов по фестивалям и концертам с мамой в детстве и подростковом возрасте.","• водит опасно. любителям спокойных поездок на машине с плавно меняющимися пейзажами за окном к ней лучше не обращаться.","• левша. правой рукой уверенно только мышку компьютерную держит."],"appearance":["внешность Сандры обманчива. она далеко не из тех, на кого посмотришь и скажешь \"да, это точно опытный следователь\". скорее, покажется, что она - харизматичная тётя, которую ты видишь на семейных застольях пару раз в год. Кассандра - низкорослая и крупная на вид женщина (рост - 155 см., вес - 85 кг.) с круглым лицом, светлыми кудрями и голубыми глазами, но не рекомендую вестись на дружелюбную внешность. Кассандра кажется полной, но на деле под массой жировой есть масса мышечная, так что удар она держит крепко и к физическим нагрузкам более, чем готова.","прототип | Никола Кохлан"]},"stats":{"Сила":3,"Ловкость":0,"Интеллект":5,"Восприятие":7,"Харизма":5},"tracks":["смех сисяндры — сто часов"],"photo":"images/cassandra.jpg","archived":false},{"id":"connor","name":"Коннор Блейк Харлоу","aka":["Connor Blake Harlow","Супермен"],"age":["37 лет"],"role":["Консул «HORTUS»"],"orient":["Бисексуал"],"tags":["ADMINISTRATION"],"player":{"name":"Connor Blake Harlow","url":"https://vk.ru/s_u_p_e_r_m_a_n_c_o_n_n_o_r"},"date":"21 мая в 21:21","epigraph":null,"sections":{"character":["— Характер сформирован абсолютным одиночеством, суровыми законами природы и несправедливостью человеческого общества. Видит себя «санитаром леса» в масштабах человеческого социума.","Тюремный опыт окончательно выжег в нем веру в человечество. Делит мир на хищников, жертв и «грязь». Считает своей миссией утилизацию человеческого мусора, и выполняет ее без капли сожаления. Работа в игорном бизнесе лишь укрепила эту философию: ежедневно наблюдая за алчностью и падением людей, он научился безошибочно вычислять «гниль».","Внутренний компас прост и жесток, как законы тайги. Обладает специфическим, пугающим милосердием: может выкупить долг человека, увязшего в «грязи», даруя ему ложную надежду, чтобы затем хладнокровно и спланированно его утилизировать. Для Коннора это не игра, а чистокровный акт очищения — он забирает долг жизнью.","Из-за детства в глуши и отсутствия романтического опыта абсолютно глух к социальным играм. Не умеет и не хочет сближаться с людьми. Концепция «отношений» и близости для него чуждая территория. Умеет часами выслеживать цель, затаив дыхание. Стрельба из лука научила его предельной концентрации, терпению и умению делать один идеальный, решающий выстрел. Не поддается панике, не злится в бою — просто устраняет помеху.","Говорит мало и только по делу. Не выносит пустой болтовни, роскоши и городских условностей. Ему комфортнее спать на жестком полу, чем на мягкой кровати. Прошлое в глуши сделало его автономным: он умеет выживать в любых условиях, рассчитывая только на себя."],"biography":["— Вырос в полной изоляции в глухих северных лесах, куда его увел скрывавшийся от прошлого отец. Не знал цивилизации, сверстников и материнской нежности. Отец обучил его главному — выживанию. Коннор научился читать следы раньше, чем алфавит, а к четырнадцати годам в одиночку убил крупного зверя. Охота развила в нем хладнокровие, терпение и скрытность. Из-за отшельничества романтического опыта не имел. В восемнадцать лет отец умер, оставив сыну нож, лук и завет: «Никогда не доверяй людям из городов».","В девятнадцать лет из-за нехватки ресурсов и любопытства вышел к людям. Город показался ему шумным и фальшивым, но пытался привыкнуть. Всё изменилось, когда спас девушку от группового изнасилования в подворотне. Воспитанный на первобытных законах, не рассчитал силу и насмерть забил вожака нападавших.","Суд оказался слеп. Нападавшие были местной элитой с адвокатами, а спасенная девушка не явилась из-за угроз. Коннор получил суровый срок за убийство. Тюрьма показала ему всю гнилость человеческой природы: общество неизлечимо больно, а большинство людей — мусор. В тюремных стенах не сломался, а сжался, как тугая тетива лука, готовая к выстрелу.","Выйдя на свободу в тридцать лет с холодным огнем мести внутри, ушел в теневой сектор. За семь лет стал пугающе эффективным ликвидатором. Чтобы иметь постоянный доступ к изнанке человеческих пороков, начал устраиваться в различные казино. Игорные дома стали для него идеальным фильтром.","Здесь он столкнулся с особой категорией «грязи» — должниками, которые ради наживы или дозы азарта предавали близких, воровали и опускались на самое дно. Коннор разработал собственный почерк: если должник оказывался конченой мразью, Коннор тайно гасил его долг из собственных кровавых денег, вырывая жертву из лап официальных кредиторов. Окрыленный «спасением» человек думал, что получил второй шанс, но Коннор лишь заманивал его в ловушку, после чего совершал идеальное, спланированное убийство. Из казино его никто не подозревал — ведь официально долг был закрыт.","Деньги его не волнуют — они идут только на покупку качественного снаряжения, стрел и на «выкуп» будущих жертв из долговых ям."],"ability":["— Отточил навыки стрельбы из лука до абсолюта. Без промаха бьет до 100 метров из классики и блочных моделей, стреляет из любых положений, мгновенно рассчитывая поправку на ветер. Передвигается совершенно бесшумно благодаря идеальному балансу и мышечной памяти. Под ногами не хрустнет ни ветка, ни старая половица. Способен на многокилометровые марш-броски и суточные засады на морозе или в сырости. Обладает высоким болевым порогом. Изящным техникам предпочитает звериную силу, армейские приемы, опыт жестких тюремных драк и мастерское владение ножом.","Эксперт по безопасности и психологии азартных игроков. За время работы в разных казино научился мгновенно считывать язык тела, отличать блеф от искреннего отчаяния и видеть, когда человек окончательно перешагнул черту человечности ради легких денег.","Отлично видит в темноте из-за привычки к ночной охоте. По звуку или едва уловимому запаху чует цель до визуального контакта. По примятой траве, пыли или следам протектора с точностью до минут восстанавливает хронологию событий. Мгновенно просчитывает снайперские позиции и пути отхода. Понимая физику света и тени, способен слиться с любой местностью так, что человек пройдет в метре и не заметит. Профан в искусстве, но эксперт в баллистике, анатомии. Знает, как убить мгновенно или заставить мучиться. Умеет ремонтировать снаряжение и создавать ловушки из мусора. Обладает абсолютной психологической устойчивостью. Тюрьма сделала его невосприимчивым к шантажу, угрозам, манипуляциям и провокациям."],"weaknesses":["— Абсолютно не понимает намеков, флирта и человеческих эмоций. Хронически одинок, не умеет работать в команде и доверять людям. Не умеет лгать, вести переговоры и идти на компромиссы.","Плохо разбирается в сложных гаджетах, хакерстве, цифровой слежке и современных системах безопасности. Хотя прекрасно ориентируется в слепых зонах камер видеонаблюдения в казино.","Его стиль — скрытность и один точный выстрел. Если зажать на открытой местности под плотным огнем автоматов, его лук станет бесполезен, а шансы на выживание резко упадут."],"hobby":["— Единственное хобби — ручное изготовление стрел. Ночами напролет кропотливо вырезает древки и клеит оперение."],"features":["— В тридцать семь лет не имеет никакого сексуального и романтического опыта. Считает эту сферу чуждой и намеренно избегает.","Не выносит мягкие матрасы — от них болит спина. Спит на жестком прямо на полу, сохраняя бдительность.","Регулярно меняет места работы, переходя из одного элитного или подпольного казино в другое, как только зачищает там «поголовье» грязных должников. Никогда не задерживается на одном месте дольше, чем на несколько месяцев.","Из имущества — оружие, инструменты для лука и достаточное количество наличных, которые хранит в хижине в лесу. Часть этих денег всегда носит с собой на случай, если потребуется экстренно закрыть чужой крупный долг перед ликвидацией.","Пользуется только одноразовыми кнопочными телефонами. Не знает, что такое соцсети, интернет и мемы.","Презирает фастфуд и ресторанную еду. Пьет только воду, ест простое мясо, орехи и ягоды. Алкоголь не употребляет.","В минуты концентрации замирает и может не моргать по нескольку минут, инстинктивно принюхиваясь к воздуху."],"appearance":["— Рост 215 см с массивным, тяжелоатлетическим телосложением. Широкие плечи, мощная грудная клетка и бугристые мускулы, развитые в ходе сурового физического труда и тюремных тренировок.","Обладает благородными, мужественными чертами лица: тяжелая волевая челюсть с ямочкой на подбородке, прямой нос и резкие скулы.","Внимательные, леденящие душу стальные, темно-синие глаза. Из-за привычки выслеживать цель может подолгу смотреть не моргая.","Темные, густые волосы, обычно небрежно подстриженные или отросшие. Лицо часто покрывает жесткая многодневная щетина, переходящая в короткую суровую бороду.","Кожа бледная, закаленная холодом. Старый рваный шрам от когтей зверя на левом плече и несколько ровных следов от заточек на ребрах и предплечьях в память о тайге и тюремных бунтах.","В рабочее время вынужден носить строгие черные костюмы, подобранную под его внушительные габариты. В этой одежде он выглядит как молчаливая, пугающая скала, идеально вписывающаяся в дорогой антураж, но глубоко презирающая его. Вне работы возвращается к прочным армейским брюкам, тяжелым берцам, простым темным футболкам и плотным курткам со шуршащим минимумом.","- Прототип внешности: Henry Cavill"]},"stats":{"Сила":7,"Ловкость":4,"Интеллект":6,"Восприятие":3,"Харизма":0},"tracks":[],"photo":"images/connor.jpg","archived":false},{"id":"leyla","name":"Лейла Рейн","aka":["Leyla Rain","Лея, Angel"],"age":["25 лет"],"role":["Ассистентка стратега - аналитика."],"orient":["исключительно гетеро"],"tags":["THE LAB"],"player":{"name":"L E Y L A","url":"https://vk.ru/id695368528"},"date":"4 июл в 19:34","epigraph":null,"sections":{"character":["— Лейла Рейн — сдержанная, интеллигентная и невероятно самообладающая девушка. Она привыкла сохранять спокойствие даже в самых критических ситуациях, ведь работа врача научила её принимать решения за считанные секунды. Лейла искренне ценит человеческую жизнь и никогда не проходит мимо чужой беды, независимо от того, кем является пострадавший. Она редко открывается людям, предпочитая сначала узнать человека, а уже потом доверять ему. Не любит ложь, шум, жару и бессмысленную жестокость. Несмотря на внешнюю мягкость, обладает сильным внутренним стержнем и не позволит собой манипулировать. Верит, что у каждого человека есть шанс измениться, но никогда не забывает причинённую боль."],"biography":["— Лейла Рейн рано осталась сиротой. После гибели родителей её вывезли во Францию, где она выросла в тихом провинциальном городе, вдали от преступности, насилия и любых связей с криминальным миром, под защитой своего опекуна. Она никогда не знала, кем были её родители на самом деле, и не пыталась искать ответы, предпочитая строить собственную жизнь.","С юных лет Лейла мечтала стать врачом. Годы обучения, практика и бессонные ночи сделали её высококвалифицированным специалистом в области экстренной медицины и фармакологии. Она привыкла бороться за каждую человеческую жизнь, не задавая лишних вопросов и не интересуясь прошлым своих пациентов.","Однако однажды поздним вечером судьба изменила всё. Жизнь столкнула её с неизбежностью где пришлось оказать первую помощь человеку нь, если в том есть выгода делу. Делает только то, что на его субъективный взгляд разумно, а значит делает то, что хочет.","До глубины души отвращает любое проявление чревоугодия, считает низшей слабостью человека, но тем не менее, лучшим инструментом для управления властной рукой.","Несмотря на черствую составляющую, Австриец предпочитает проявлять необходимую заботу, ведь проще своевременно поливать цветок, нежели покупать новый. Правда делает это неуклюже прямолинейно, что походит на гиперопеку, в какой-то книжке по психологии сказано, что семейные узы надёжнее рабочих, потому считает своим долгом воспитывать и оберегать, иногда подменяет понятия и путает с отношениями \"хозяин - питомец\". «Заболел? Я скуплю аптеку, а ты проглотишь все\". То же относится к торговле людьми, несмотря на психологическое насилие для большей покладистости, условия содержания едва ли не отельные. Не способный в эмпатию и комплексы, зачастую не видит границ: физических и ментальных, разве что догадается логически."],"biography":["Мужчина родился в Австрии — Зальцбург, в семье увядающих аристократов. Детство прошло среди окисленного фамильного серебра и сладкого лицемерия. Ребенок не понимал, зачем родители берегут капли благородства, если мир подчиняется лишь праву силы — этот закон он с рождения чувствовал кожей и не мог объяснить сопротивление ему. Однако чему-то важному родители все же научили сына перед тем, как проиграли остатки состояния — декадансу азартных игр. В 24 года Эдер оставил позолоченный склеп, предпочтя «интеллигенции» честную грязь.","С блестящим образованием он устроился администратором в ночной клуб будучи убежденным гедонистом с жаждой вкусить пороки, правда тот оказался низкосортным притоном, что с удовольствием увлек молодую кровь. Созерцая, как люди умирают в угаре, Лиард выводил формулы разложения личности, исследовал лучшие методы и считал прибыль с каждого тела, живого и мертвого. Следуя своим стратегиям, молодой парень довольно быстро стал экспертом в области и, желая обрести большее влияние на шахматном поле, подался правой рукой главы итальянской мафии, где позже познакомился с Арчи.","В попытке погасить долг оперативника перед конкурентной организацией, Эдер попал в Синдикат в своеобразное рабство, хотя решение пришло ещё к концу года — подставная смерть должника. Аарон ушел на дно, путешествуя и отравляя Юго-Восточную Азию сетью производства и сбыта психотропных веществ, а Лиард, закрепившись на рынке Европы и осев в Монако, наладил бывшие связи в эскорт-индустрии и возродил империю «элитного мяса» - HORTUS в рамках клана LIAR."],"ability":["— Высокий IQ. Математический склад ума, позволяющий анализировать массивы данных с машинной скоростью.","— Несмотря на телосложение и опыт, ближний бой оставляет желать быстрой смерти, — владеет огнестрельным оружием дальнего боя, в особенности снайперской винтовкой, на которой готов жениться.","— Дипломатия и Память: Обладает идеальным зрением и абсолютной памятью, высокоразвитый навык дипломатии и публичных выступлений.","— Выносливость: способен не есть и не спать трое суток, не теряя продуктивности."],"weaknesses":["— Трипанофобия: Панический страх игл и врачей. Предпочтет ходить с дырой в животе, нежели лечь в больницу.","— Часто страдает от мигреней. Из-за работы в вечно шумном и ярком месте сидит на синтетических седативных. Аллергия на холод и пыль. Анафилактический шок даже от слабой анестезии."],"features":["— Полиглот с языковым барьером: понимает речь на многих языках, но говорить — нет.","— Аскетизм: пьет лишь один вид алкоголя, не курит, практически не нуждается в физическом и ментальном отдыхе. Однако зависим от горького шоколада и острой пищи.","— В моменты сильной концентрации машинально отстукивает такт венского вальса - отголоски воспитания. В таком же случае способен часами смотреть в одну точку, не воспринимая даже прикосновения.","— Самостоятельно проводит все аукционы и участвует в отборе Цветов Сада.","— Есть приемный сын."],"appearance":["Фарфоровая кожа аристократа, в традициях высшего общества приподнятый подбородок и безупречная осанка. Рост 186 см, вес 84 кг. Темный каштан волос и серые грозовые глаза.","Поджарое телосложение, не отличающееся особой мускулатурой - физическому развитию уделяет гораздо меньше внимания, чем умственному. В одежде отдает предпочтение классике — индивидуальный пошив.","— Прототип - Ален Делон."]},"stats":{"Сила":4,"Ловкость":4,"Интеллект":8,"Харизма":4},"tracks":["Succession (Main Tittle) — Nicholas Britell"],"photo":"images/liard.jpg","archived":false},{"id":"marlo-mavridis","name":"Марло Мавридис","aka":["Marlow Mavridis","Буревестница"],"tags":["TARGET ELIMINATION"],"age":["34 года"],"role":["Оперативница «Шан»"],"orient":["Полисексуалка: предпочитает людей с женскими половыми органами"],"player":{"name":"Максим Цыбуля","url":"https://vk.ru/sauvansil"},"date":"14 сен в 19:48","epigraph":null,"sections":{"character":["Марло - это небрежно погнутая чьим-то зубом монетка с двумя сторонами. Честные, справедливые и искренние люди знают ее как золотистого ретривера, обнятого существованием в теле большого грозного человека, люди с сомнительным моральным компасом в первый (и, может даже, последний) раз лицезреют, как она гнет арматуры в крендель, гневно исходясь дымом из ноздрей. Она бескомпромиссно громкая и эмоциональная, будь то радость, грусть или злость, с живой мимикой, динамичным телом и малость неустойчивым вниманием. Она обожает жизнь со всеми ее плюсами и минусами, и обожает прямолинейно: любые попытки в недоговоренность вокруг нее обречены быть повешенными на пыльной виселице упущенности.","Ненавидит, если придется, она столь же страстно и изо всех сил, не обращая внимания ни на последствия, ни на ограничения собственного тела, напоминая этим бульдозер, что продолжит молотить, пока кто-то не нажмет на аварийный стоп.","Острая жажда справедливости сидит на ее шее тугими тисками и часто не дает ей спать по ночам. С недавних пор ей приходится учиться как уживаться с тем, что данная справедливость не всегда возможна, и даже если ты отдаешь абсолютно все, борясь за честное, доброе дело - этого, чаще всего, недостаточно. Оттого ночная кухонная философия практически всегда трет ее против шерсти, поднимая из недр намеренного забытья все то, что она так тщательно пихает обратно простой неотесанной повседневностью.","Однако, она упряма. Каким бы сложным ее стремление к исконной человеческой морали ни было, она продолжит тянуться к нему даже сквозь самую смолистую тьму."],"biography":["Марло родилась в большой и дружной цветной семье, скорбящей по забытым в угоду ассимиляции в штатах традициям. Она с детства отличалась рослостью и сбитостью - оттого и с детства занималась спортом. Родня вкладывалась в свою детину добросовестно и любяще, посему подметить что-то интереснее этого на ее счет не получится. С семьей у Марло все нормально, она все еще преданно звонит маме раз в неделю, где бы ни находилась.","Самая любопытная часть ее биографии начинается там, где стартует ее членство в мотоклубе, потому как последний очень быстро эволюционирует в благотворительную группировку, поддерживающую детей и маргинализированные группы. И видит Будда - Марло собой катастрофически за это гордится, ибо есть за что.","Годами она с товарищами собирала ресурсы на лечение зависимых, немощных и забытых, суды, убежища и простую поддержку всем тем, кому то необходимо, постоянно выступая медведицей-защитницей тех, кто по любым причинам не мог позволить себе защититься сам. Один меткий удар ее кулака стоил обидчикам как минимум одной трещины в черепе, ее всегда звали туда, где ситуация грязнела до рукоприкладства - потому что она попросту была в этом хороша.","Отсюда и родилось ее прозвище, ведь если порог помещения переступил запыленный ботинок Марло - быть, значит, в этом помещении буре.","Группировка существовала завидно долго, несмотря на все невзгоды, но, как и многие другие, посыпалась, не выдержав совокупность подкупов и предательств. Марло осталась в этой путанице крайней, ныне расплачиваясь за долги там, куда бы никогда не пошла добровольно, в надежде, что сумеет спасти хотя бы толику былого-","К сожалению, былое скончалось болезненно. Переполненная скорбью и сбитая с толку гневом, она поклялась, что сделает все, лишь бы отомстить предателям, отнявшим у нее любимое дело, а самое главное - семью, облаченную в протертые косухи.","Пока она, аки взбешенная гончая, вынюхивала следы своей новоявленной вражины, она совсем не заметила, как прокопала слишком глубоко и оказалась в мире, где разглагольствования о \"добре\" и \"зле\" безразлично мешали с кокаином и дорогими сигарами. В очень скором времени ее ударное безрассудное упорство привлекло внимание тех, кто наблюдал за дымом сигар с куда более пугающей вышины.","С тех пор она дала вторую клятву - в верности клану, новой семье, не носящей косухи, но способной помочь засунуть правосудие в глотку врага, и она не позволит себе об этом пожалеть."],"ability":["Пятнадцать лет профессионально занималась вольной борьбой и тяжелой атлетикой, затем перешла на муай тай для души;","Искренне стремится найти общий язык со всеми, несмотря на разность, что можно считать за развитый эмоциональный интеллект;","Смелая и категорически стойкая, так что ее затруднительно запугать, сломить, а чтобы вырубить или свалить - нужно бить по уязвимым точкам дважды... лучше трижды. Ее не останавливает ни боль, ни кровь, ни увечья."],"weaknesses":["Сдвг. Без риталина на нее, как на внимательную, вовлеченную в процесс сотрудницу, можно не полагаться. Да и с ним ее внимательность непостоянна и непредсказуема;","Сильное чувство справедливости. Ее легко шантажировать заложниками, а за жизнь ребенка она пожертвует своей, и не моргнув глазом;","Легкомысленна с деньгами и не очень хороша с числами. Для нее они имеют так мало веса, что она предпочтет отдать последнюю копейку, даже если ее последние трусы протерлись до сквозных дыр."],"hobby":["Мотоциклы. Она обожает мотоциклы, но техническую их часть упрямо игнорирует;","Муай тай (естественно);","Мейкап и грим, в последствии чего испытывает трепетный восторг к драг шоу и бурлеску;","Индастриал метал и экстремальный вокал. Неясно, для чего, но она умеет реветь как медведь, бурлить как ржавые трубы, издавать звуки скрежетущих друг об друга опорных балок шестиэтажного здания при семибалльном землетрясении, и очень любит это делать, хотя ни в каких музыкальных группах выступать не собирается;","Компьютерные игры! Особенно соревновательные, она в них не хороша, но ей дико нравится командный дух."],"features":["Имеет корни балканских арлия, но почти ничего о них не знает;","Однажды подняла свой мотоцикл на спор и сбросила его с обрыва. С тех пор у нее нет мотоцикла;","Еще со времен мотоклуба знается с неким человеком по кличке \"Че Гевара\", ныне довольно успешным пост-панк музыкантом и активистом, чем любит очень рандомно и не к месту хвастаться;","У нее есть хомячок, которого зовут Мардук-Победитель-Первобытного-Моря, точнее она называет так каждого хомячка, которого заводит - бедняги постоянно мрут от эмоциональных потрясений;","Не пьет, потому что предпочитает всякие разноцветные гламурные сладкие напиточки, но очень много курит, с чем тщетно пытается бороться;","При ней всегда есть эпипен (для себя, у нее аллергия на арахис, но она очень любит арахис) и спрей-налоксон (для других)."],"appearance":["Рост 1.98 (без обуви), 102 кг. Она широкоплечая, сложенная как колосс, женщина альтернативной внешности. У нее выдающийся подбородок, скулы, и четкая линия челюсти, горбатый нос, пухлые губы. Глаза серо-голубые, волосы черные, длинные, иногда она сама бреет себе виски.","Нос у нее проколот в трех местах, язык - в двух, в ушах туннели и куча бренчащих сережек, тело расписано татуировками, мейкап она предпочитает около-экстремальный и очень редко ходит с чистым лицом, одна из бровей у нее кривая, потому что однажды там тоже был прокол, но он зацепился за одежду и оторвался, бровь пришлось пришивать обратно.","Панк по призванию и духу, одевается соответствующе. Не брезгует платьями и каблуками.","Рея Рипли."]},"stats":{"Сила":7,"Ловкость":5,"Интеллект":3,"Харизма":4,"Восприятие":1},"tracks":["Skullcrusher — Combichrist","Set on Fire — HORSKH"],"photo":"images/marlo-mavridis.jpg","archived":false},{"id":"marta-cheglova-grad","name":"Марта Чеглова-Град","aka":["Marta Cheglova-Grad","Ведьма"],"tags":["HORTUS"],"age":["30 лет."],"role":["Цветок в Hortus."],"orient":["Гетеро."],"player":{"name":"Marta Grad","url":"https://vk.ru/marta_grad"},"date":"5 окт в 15:10","epigraph":null,"sections":{"character":["Девушка с добрым и нежным сердцем, которое всегда открыто для помощи и заботы о других. Она стремится делать добро и принимать каждого человека таким, какой он есть, без осуждения и предвзятости.","Марта — честный и преданный человек, который всегда стоит на своих принципах и верит в истину. Она не терпит лжи и двуличности, всегда откровенна и пряма в своих словах и поступках.","Однако у Марты имеется ещё одна сторона, скрытая от посторонних глаз. В погоне за важной для неё целью она не гнушается использовать свою привлекательность и хитрость в корыстных целях, ради личной выгоды.","Марта остается непреклонной, убеждая себя, что в этом мире жестокость и хитрость — необходимые инструменты для достижения вершины."],"biography":["Марта родилась в районе Богдановка города Пустобес. Ее происхождение окутано завесой тайны: сведения о матери практически отсутствуют, а отец, предположительно принадлежавший к инженерно-техническим или военным структурам, оставил после себя лишь смутные воспоминания родственников.","Карьерный путь Марты начался в 2016 году в Прокатном городе Пустобес. Вступив в структуру муниципального предприятия в качестве неформального архивариуса и временного подрядчика по оцифровке данных, она обнаружила свою истинную силу — способность восстанавливать утраченные цепочки связей, верифицировать забытые сделки и реконструировать хаотичные массивы информации. Именно этот талант привлек внимание Града, лидера организации «Вал».","Благодаря бесстрастной точности в работе с данными Марта быстро превратилась из технического специалиста в неформальный центр принятия решений внутри структуры. Ее экспертные навыки сделали ее незаменимым активом, обеспечивающим стабильность и контроль над информационными потоками «Вала». Однако, достигнув вершины влияния, она приняла стратегическое решение о дистанцировании от власти.","После консолидации системы управления после ухода Града Марта осуществила планомерную передачу полномочий своему брату, Власу Чеглову. Этот переход был проведен с деловой сдержанностью, ознаменовав окончание ее эпохи в подпольных архивах и расчетах долгов.","Оставив позади Пустобес, Марта перебралась на юг — в Монако. Смена декораций была радикальной: из мира сырых документов она переместилась в оазис показной роскоши. Здесь ее острый ум и безупречное самообладание стали инструментом новой игры. Вступив в орбиту влияния высших мафиозных кругов, Марта сменила статус на эскортницу для лиц, чьи капиталы сопоставимы с их тайнами.","Сегодня Марта Чеглова — образец изысканной и дорогой таинственности. Ее навыки чтения людей и управления вниманием стали валютой в мире, где каждый вечер является тщательно срежиссированным спектаклем, а цена пребывания измеряется не секретными данными, а бриллиантами и личным влиянием в высших эшелонах общества.","Личное дело: Биографическая справка № Б-413.","Объект: Марта.","Статус: Пациентка в состоянии частичной амнезии после критического инцидента.","История болезни и восстанавливаемые данные:","Жизненный путь субъекта характеризуется резким разрывом в хронологии, произошедшим вследствие попытки суицида (или намеренного причинения вреда здоровью), которая не достигла цели. В результате полученной травмы сознание Марты подверглось фрагментации: значительная часть личной истории была стерта из памяти как защитный механизм психики или следствие физиологического повреждения нейронных связей.","На текущий момент субъект пре
