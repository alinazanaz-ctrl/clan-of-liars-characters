бывает в состоянии когнитивного диссонанса относительно собственного прошлого. Она не способна идентифицировать ключевые фигуры своего близкого окружения: данные о брате и покойном супруге полностью отсутствуют в её сознании, превращая этих людей в безымянные тени, лишенные эмоционального веса.","Даже сам акт отчаяния, тот роковой день, когда она решилась на попытку ухода из жизни, стерт из памяти настолько тщательно, что Чеглова интерпретирует произошедшее как случайное происшествие, не связанное с её волей.","Тем не менее, в структуре сознания сохранились изолированные фрагменты профессиональной деятельности. Субъект демонстрирует высокую степень уверенности в том, что она была сотрудницей организации под названием «Хортус». Она четко осознает свою принадлежность к сфере эскорт-услуг и специфику этой работы.","При этом Марта не может вспомнить лиц или имен членов клана, с которыми взаимодействовала ранее. Для неё эти люди превратились в анонимную массу. Коллективный образ прошлого, который она помнит лишь как функциональную среду обитания, лишенную конкретных деталей и человеческих черт.","Заключение:","Личность Марты представляет собой мозаику из обрывков профессиональной памяти на фоне абсолютной пустоты частной жизни. Она живет в настоящем, которое строится на фундаменте выжженной истории, где единственной твердой опорой остается осознание своего былого труда в «Хортусе»."],"ability":["Марта полагается больше на умственные способности, чем на физическую силу. Её лидерские качества, аналитические навыки и эмоциональный интеллект делают её эффективным главой группировки — даже после потери памяти о близких. Рабочие навыки сохранились, личная история стёрта.","Физические способности:","Дисциплинированность [Она обладает навыками самоконтроля и выносливости, что помогает справляться с физическим и эмоциональным стрессом. Тело помнит режим, даже если разум забыл причину.]","Проницательность [Её способность к наблюдению может означать острую внимательность и быстроту реакции в критических ситуациях. Без личных привязанностей она читает людей быстрее и точнее.]","Привлекательность как инструмент [Она знает, что красива, но это знание лишено тщеславия. Внешность для неё — рабочий параметр: платье, взгляд, тембр голоса подбираются под задачу.]","Умственные способности:","Феноменальная память [Марта обладает способностью чётко запоминать детали: числа, даты, имена и важные факты. Однако рабочая память работает безупречно, а личная — выжжена: она не помнит лиц близких.]","Аналитические навыки [Она умеет восстанавливать процессы, связывать разрозненные кусочки информации, подтверждать или опровергать сделки. Это говорит о её высоких способностях к логическому и стратегическому мышлению.]","Архивное мышление [Уникальный навык, выросший из работы в Прокатном городе: способность реконструировать события по обрывкам данных. Она строит модели чужих биографий, сделок, преступлений — но не свою собственную.]","Эмоциональный интеллект [Обладая способностью замечать боль и состояние других, Марта умеет выстраивать доверительные взаимоотношения. Но теперь чужая боль воспринимается отстранённо — она не помнит своей.]","Манипуляция [Марта способна использовать свои качества как оружие, будь то красота, женственность или кажущаяся слабость, для достижения результатов. Раньше она убеждала себя, что это необходимость. Теперь просто делает.]","Слабые стороны:","Предвзятость к честности [Собственный принцип честности и непримиримость к лжи могут создавать уязвимость, особенно если враги знают об этой её черте и используют её против неё. Принцип остался — фундамент исчез.]","Тяжесть решения [Осознание, что иногда приходится «резать по живому», может увеличивать эмоциональное и моральное бремя. Раньше она знала, ради кого. Теперь жертвы есть, а смысла нет.]","Страх потерять контроль [Она может быть уязвимой в ситуациях, где события выходят из-под её контроля, так как придерживается строгой организации и порядка. После аварии мир уже однажды рухнул — и она это помнит телом.]","Разрыв личности [В ней живут две Марты: добрая, честная, нежная — и холодная, расчётливая, готовая на всё. Раньше она примиряла их целью. Теперь цели нет — только работа.]","Амнезия как брешь [Она не помнит брата, супруга, попытку суицида, лиц клана. Любой, кто знает её прошлое, держит в руках оружие.]","Одиночество [Она не помнит, что кого-то любила, но тело и сердце помнят пустоту. «Хортус» — единственное место, которое она может назвать своим.]","Johanna Herrstedt.","С правилами ознакомлена."]},"stats":{"Сила":2,"Ловкость":3,"Интеллект":5,"Харизма":8,"Восприятие":2},"tracks":["Dead Memories — Slipknot"],"photo":"images/marta-cheglova-grad.jpg","archived":false},{"id":"mateo","name":"Матео Леблан","aka":["Mateo Leblanc","«Деревенский мальчик», «Рыба»"],"age":["29 лет.","Выглядит заметно моложе - жизнь не оставила на нем своих следов, а все потому что он не интересовался жизнью."],"role":["Главный Технолог «THE LAB». Фанатик, одержимый стремлением создать собственный «философский камень» - идеальный, лишенный недостатков наркотик."],"orient":["Асексуален."],"tags":["ADMINISTRATION"],"player":{"name":"Семь Мертвецов","url":"https://vk.ru/semmertwetzov"},"date":"4 мая в 9:58","epigraph":null,"sections":{"character":["Матео родился с расстройством аутистического спектра с сохраненной речью; это проявилось ещё в детстве и осталось с ним и во взрослой жизни, пусть и несколько сглаженным или взятым под контроль самим Матео. Но в плохие дни и моменты потери душевного равновесия ему непросто устанавливать контакт с другими людьми, понимать намеки, эмоции, реагировать на новые ситуации. Иногда к этому добавляются стереотипные движения, увлеченность определенными деталями или необычные реакции на свет, звук, запахи. Матео слабо реагирует на обращение по имени, часто избегает взгляда «глаза в глаза», а порой, наоборот, смотрит слишком пристально - и взгляд у него неприятный, лишенный эмоций и интеллекта. «Рыбий».","Впрочем, чаще Матео деликатен в общении, очень внимателен к собеседнику и подстраивается под него. Ему нравятся, искренне нравятся люди, и он ищет человеческого общения. Матео - глубоко эмоциональный, неконфликтный человек, практически никогда не повышающий голоса, и ему легче согласиться со всем, а потом, если необходимо, сделать по-своему - или спокойно заявить об этом сразу, покорно приняв чужой гнев. Однако Матео умеет и беспрекословно подчиняться авторитетам, и искренне благодарен за все возможности, что даёт ему покровительство клана LIAR - его верность определяется не страхом, но благодарностью.","Матео может быть ограничен, может не видеть всей картины, но он не глуп - он не обманывается, знает, на каких условиях остается здесь и остается жив, знает, чем может поступиться, а какие правила нельзя нарушать нив коем случае. При всей своей беззащитности он дожил до своих лет и продолжает процветать, как таракан, там, где остальные провалились бы, и это уже что-то да значит.","Тихий и молчаливый, Матео предпочитает смотреть и слушать, но, если ему позволяют, охотно рассказывает истории, замолкая лишь когда речь заходит о нём самом. Он не любит себя и любит людей. Искренне любит, считая каждого человека неповторимой личностью и величайшей эволюционной драгоценностью, и даже «материал», разрабатываемый под его прямым контролем, всегда живет дольше и умирает легче, и Матео помнит каждого из них."],"biography":["— Матео родился в Провансе, на берегу Средиземного моря, в семье Эммы и Жюля Леблан. Мать была домохозяйкой, отец - бывшим профессором, и оба сознательно удалились от шумной городской жизни в глухую деревушку, куда ещё не дотянулась цивилизация.","Матео рос в совершенной обстановке провинциального очарования - неспешная жизнь, домашнее обучение в доставшейся его отцу от его предков бастиде: тайный колодец, винный погреб с двойным дном, знаки на поросших мхом камнях и заброшенная голубятня, где по прихоти Матео вновь завелись голуби.. Потайная алхимическая комната, дневники и книги, буквально рассыпающиеся в руках маленького Матео и пахнущие тленом. Пахнущие знаниями.","Очарование старинных гравюр и той тайны, что скрывалась за строчками старофранцузского языка, рассказывающими о духовных трансмутациях, иатрохимии и, конечно, Великом делании, поразила Матео так, что он твердо решил стать алхимиком.","И стал, правда, химиком, получив степень магистра в Высшей школе индустриальной физики и химии Парижа. Химия увлекала его, но казалась несовершенной.. словно бы лишенной смысла в вакууме формул и теорий, ведущих лишь к новым формулам и теориям. Матео искал чего-то ещё, и сам не понимал, чего, пока не попал на одну из тех вечеринок, что заканчиваются передозами в туалете. Закончившуюся. Он не смог спасти ту девушку, он не был врачом, но вместе с виной его поразило и иное, гораздо более сильное чувство.","Восторг. Он видел, как счастлива она была перед самой смертью - он видел это в её глазах, и, обычно с трудом понимающий людей, здесь он понял всё.","Она умерла, но умерла счастливой, из-за.. Наркотика в её крови. Могло ли всё закончиться по-иному? И было ли это, другое, лучше для неё? Её жизнь закончилась, но на какой высокой ноте!..","Это впечатляет Матео так, что, ещё не окончив ESPCI, он поступает на медицинский факультет Сорбонны, в конечном итоге блестяще оканчивая оба университета, и, вопреки ожиданиям, не отправляется работать в крупную компанию или именитую клинику, и не открывает частную практику. Он кочует по стране, устраиваясь в худшие из больниц, там, где у него был бы доступ к самым опустившимся наркоманам, самым тяжелым случаям, самым пропащим людям.","Матео действительно пытается помочь им. Кто-то под его руководством даже проходит все этапы излечения о наркомании и ресоциализируется. Кому-то.. везет меньше.","Однажды в этом углядывают злой умысел, которого не было, и Матео попадает за решетку, но ненадолго. Его таланты и специфический опыт не остаются незамеченным, а Матео решительно всё равно, на кого работать, лишь бы работать с людьми.","В конечном итоге, сменив множество сомнительных работодателей, Матео попадает в клан, на виллу-лабораторию, в число алхимиков - и влюбляется в это место практически мгновенно. Словно рак-отшельник, нашедший свою идеальную раковину, он на несколько лет уходит с головой в работу, и поначалу даже его обширных знаний едва хватает для того, чтобы держаться наравне со «старичками». Но он всегда был старательным. Ему нравится учиться, нравиться видеть, как его старания приносят ощутимые плоды, как разработанные ими наркотики влияют на людей - «материал», но Матео предпочитает ласково называть их «подопечными». С наибольшим вдохновением и фантазией он подходит к изготовлению дизайнерских наркотиков, веществ, приносящих удовольствие и галлюциногенных субстанций, подчас стараясь сделать их ещё и эстетически привлекательными или решительно оригинальными.","Ему нравилась его работа, нравится до сих пор, и за прошедшие несколько лет, пролетевшие как одно мгновение, он лишь единожды покидал клан, посетив похороны отца.","Мать осталась одна, но Матео не мог остаться с ней. Он сказал ей, что его ждет работа, и это действительно так - он вернулся, чтобы после скоропостижной кончины предыдущего Главного Технолога занять его место."],"ability":["— Обладает энциклопедическими и практическими знаниями во многих областях, подчас неожиданных, но чаще - тех, что составляют основные его интересы: химия и алхимия, история, медицина, наркология, анатомия, психология.","— Потрясающе работоспособен и готов отдавать себя всего очередному проекту.","— Аскет, легко обходящийся минимумом вещей, Матео способен приспособиться практически к любым условиям и продолжать работать даже при невероятных ограничениях.","— В разной степени, от свободного до понимания с переводчиком владеет многими мертвыми языками, на которых написаны большая часть интересующих его книг: древнегреческий, арабский, латынь, старые европейские языки. Гораздо хуже обращается с современными языками, ограничившись изучением европейских: способен отличить испанский от итальянского, свободно говорит на родном французском, выученном английском и немецком, взялся за изучение русского.","— Чуткое обоняние и осязание.","— Чудовищно вынослив, как физически, так и морально.","— Не курит, не пьет, не испытывает на себе свои разработки."],"weaknesses":["— Законченный пацифист и фаталист - со всеми старается держать если не хорошие, то нейтральные отношения, и практически неспособен дать отпор жестокости в собственную сторону. Он очень хорошо знает пределы собственного тела и может терпеть боль, пока понимает, что она не сломает в нём что-то необратимо, но угроза непоправимым увечьем - уже достаточный рычаг для Матео пойти на уступки.","— Не владеет ни одним видом оружия, не умеет и не желает драться.","— Живет в своем собственном мире, ограниченно воспринимая окружающую его реальность, и периодически проваливается в гиперфиксации.","— Близорук, носит для дали очки или линзы - зрение испорчено над книгами.","— Социально неуклюж, плохо врет, неспособен на интриги."],"hobby":["— Страстный меломан, слушает практически всё, от агрессивного блэк-метала до медитативного эмбиента, от строгой барочной классики до авангардного фри-джаза или кей-попа, на всех языках. Слушает музыку практически постоянно и собирает хаотичную коллекцию пластинок.","— Хорошо рисует, любит петь, когда никого нет рядом.","— Много и увлеченно читает, большую часть времени проводя в библиотеке.","— Бегает, каждодневно, увлеченно и много, подолгу, под конец едва ли не теряя сознание, но в итоге пробегая расстояние, немногим меньшее, чем у самых тренированных из наемников клана - физическое истощение помогает Матео успокоить мысли и спать без снов."],"features":["— Сам не тактилен к не зафиксированным людям и не любит, когда его трогают без спроса.","— Управляемая депривация сна, которую Матео применяет к самому себе уже долгие годы, привела к тому, что едва ли не каждую ночь ему снится его старый дом, места, которых уже нет, и люди, которые уже мертвы. После этих снов Матео разбит и расстроен, и ему требуется время, чтобы прийти в себя.","— Полнится скверными привычками, тиками и компульсиями, которые старательно пытается взять под контроль, но в моменты стресса они неизбежно вылезают наружу.","— Матео составляет расписанные до секунды расписания на каждый день, ведет множество блокнотов, которые заполняет шифрами, но послушно дает расшифровки по первому требованию. Наполняющие его жизнь ритуалы, дающие ему мнимое спокойствие, сам Матео диагностирует как развившееся ОКР, но сам держит его в удовлетворяющих его пределах.","— Не любит избавляться от старых вещей, будь то одежда, исписанные блокноты или даже нечто сломанное, но ещё способное принести пользу."],"appearance":["— 167 см, 57 кг.","Матео не любит себя и не заботится о своей внешности, не считая её важной, но заботится о здоровье тела, как об инструменте, замену которому ему не найти - поддерживает гигиену, ежедневно тренируется, следит за физическим здоровьем и лелет свою выносливость. Со стороны он кажется худым, даже тощим, бледно-изнеможенным и слабым, но под этой бледной кожей долгие годы формировалась сухая, с минимальным процентом подкожного жира и высоким содержанием мышечной ткани форма. Матео - в первую очередь физически выносливый, жилистый, с мышцами, развитыми настолько, насколько позволяет его строгая диета и аскетичные условия жизни.","Темно-карие, почти черные глаза практически всегда полуприкрытые и лишенные всякого выражения - «рыбьи». Лишь в особые моменты в них появляются эмоции, а с лица сходит обыкновенное равнодушие - Матео трудно выражать свои чувства социально приемлемым и ожидаемым образом, и оттого лицо у него почти всегда равнодушно-скучающее, а улыбка - фальшивая, даже если он искренен.","Светлые кудри, часто спутанные и неопрятные.","От правого уголка рта тянется длинный извилистый шрам практически до самого уха - Матео не сводит его совсем, но всегда, покидая комнату, тщательно замазывает, пряча от чужих глаз.","Говорит тихо, односложно монотонно, но, увлекаясь, усложняет формулировки и повышает голос - он у него хорошо поставлен и довольно приятен.","В одежде непритязателен, одевается глухо, многослойно, годами нося одно и то же, пока вещь буквально не развалится у него в руках.","— Прототип: Ксавье Долан-Тадрос."]},"stats":{"Сила":2,"Ловкость":6,"Интеллект":7,"Харизма":1,"Восприятие":5},"tracks":[],"photo":"images/mateo.jpg","archived":false},{"id":"miguel","name":"Мигель Кесада","aka":["Miguel Quesada","деревце, Миха, Мига"],"age":["24"],"role":["Архитектор HORTUS (склады)"],"orient":["Бисексуал"],"tags":["HORTUS"],"player":{"name":"Dark Cat","url":"https://vk.ru/horny_boobs"},"date":"3 июл в 0:24","epigraph":null,"sections":{"character":["— «Между нами есть какая-то.. недотраханность»","Его характер сложился из слишком хорошей жизни, вседозволенности и безнаказанности. Будто шут при короле, тот что ходит по лезвию, остро ощущая грань которую переступать нельзя. Развитая ирония и шутливость, природное обаяние и харизма сделали из него того ещё сердцееда. Не склонен к сочувствию, милосердию или жалости, особенно если человек ему не нравится. На него можно положится, сказанное обязательно выполнит, однако, не стоит забывать, что на что-либо он соглашается только в угоду себе и своим желаниям. Редко делает что-то от сердца, а если и делает, считай ты избранный и можешь претендовать на место того, кто может услышать Мигеля настоящим.","Актер до мозга костей: прикинется идиотом когда надо, когда надо поумничает. Но нет на этой бренной земле того, кто будет знать его настоящего или слышать его спокойную интонацию голоса не наполненную флиртом или иронией.","Не агрессивен, не конфликтен, и искренне считает что его стёб не может никого задеть. Тот, кого Мигель уважает - будет получать и вежливость, и учтивость, и приятную, не приторную, лесть и обольщение от сердца, а не актерскую отличную игру. Язык за зубами держать не всегда умеет и вполне может кому угодно  сказать в лоб что думает, однако, субординацию соблюдает, понимая от кого зависит его жизнь: кормящую руку не кусает, а лижет, но не подлиза. Кесада не станет подлизываться или вылизывать кому-то задницу (если это, конечно, не секс), предпочтет добиться желаемого собственным трудом и упорством. За что бы не взялся - доведет до идеала (а в работе выкладывается не на 100, а на 200%). Достаточно ленивый, собственно поэтому предпочитает сделать идеально, чем переделывать несколько раз.","С серьезными людьми максимально серьезен, ответственен. Со своими шут гороховый, отличает очень хорошо с кем и как можно общаться, а с кем нельзя. Стремится к идеалу, но вредный характер местами портит его."],"biography":["— Вполне себе хорошая жизнь, даже слишком, в какой-то мере. Испания, жаркий Мадрид, большой особняк, полуголые слуги, вечно раздетая мачеха, слишком молодая для отца..","Игрушки, Диснейленд, вкусняшки - в детстве; тачки, секс, путешествия - во взрослой жизни. Он мажорчик, самый настоящий, получающий всегда всё что захочет, никогда не нуждающийся, и никогда не пойманный ментами в пьяном состоянии за рулем, так как испытывает сильную неприязнь к алкоголю и наркотикам, сам никогда даже не пробовал, только обычные сигареты. Казалось бы, человек получал все что хотел, но настоящего счастья никогда и не было. У всего этого есть другая сторона, как и у медали: вечные репетиторы, наказания, требования быть идеальным, забитое время кружками и секциями, никакого детства, никаких друзей, никаких любовных отношений и даже первой любви, никакой нежности и поддержки родителей.","Поэтому по совершеннолетию выпросил у отца-мультимиллионера возможность жить отдельно, но тот поставил условие: это съемная квартира, за неё Мигель должен платить сам, раз уж в университет не пошел учится, значит пусть идет работать, а кем это уже его проблемы. Колледж Кесада закончил с отличием, но сам даже не до конца понимал, что за профессию получил.","Отец заплатил за первые два месяца, и Мигель расслабился, подумав что это шутка, ведь не может папа бросить сына вот так? Но все оказалось не столь радужно.. когда пошел второй месяц задолженности, парень понял, что отец не приедет и не скинет денег, так как даже на звонки не отвечал, а на смс коротким «сам решай». И пришлось искать работу.. кем он только не работал, но всё это было не то. Доставка, реклама, уборка, колл-центр, офисный планктон на бумажки, бариста. Кесада попробовал себя везде, где брали без образования, и понял, что не существует той работы которая ему бы нравилась.","Хотелось получать деньги за что-то типа: смотреть телик, просто жить, ну или хотя бы за секс (который парню полюбился ещё с 14 лет) .. все те знания которые он получил за жизнь, высокая эрудиция будто никому и не нужна была, смотрели на документы, школу и оконченный колледж. Всем было все равно, на то что он умный и без корочки, поэтому ели как сводя концы с концами, Мигель через год поступил в институт искусств, но сам, без помощи отца, на бюджет.","Там он не просто научился быть актером, стал танцовщиком и певцом, так как актеры обязаны уметь три вещи: петь, танцевать и играть. Вот Мигель и научился, выпустился, намереваясь идти работать, сниматься в кино возможно, но разочаровался в жизни уже третий раз. Ни одни пробы не прошел, не потому что плох в актерстве, а потому что такие же богатые мажорчики выкупили себе роли. Всё это так осточертело, что парень решил вернуться домой за поддержкой. Но в тот день дома была лишь мачеха, все ещё полуголая, в откровенно коротких шортах (у Мигеля даже трусы длиннее) и просвечивающей майке. Отнюдь, поддержку он нашел, в постели отца, драл дешевую сделанную куколку, которая клялась в верности, а как пасынок возмужал променяла старика на молодого. Никакого чувства, кроме отвращения к этой женщине он не ощущал, упиваясь тем, что она лишь отличный бесплатный способ потрахаться, ещё и всегда под рукой. И, наверное, он продолжил бы трахаться с мачехой ещё долго, если бы спустя несколько месяцев отец не вернулся раньше домой. Сына то он в дом обратно принял даже без работы, но после такого.. В тот день отец впервые поднял руку на сына, орал не в первый раз и был уверен, что это сын соблазнил жену, ведь та слезно просила прощения и оправдывалась, клевеща на Мигеля. С какими страстями и позором его выгоняли с дома - наверное весь коттеджный поселок слышал.","Шатался Мигель по Мадриду, ища работу и возможность хоть где-то ночевать, первое время это были коробки, заброшки, и ведь даже друзей нет у кого переночевать. На одной из своих стоянок Мигель все же встретил одного друга, который наверное, единственный не променяет парня на кого или что-либо. Потрепанный, раненный пес, да не абы какой, а породистый. Судя по следам, он был одним из тех кто участвовать в собачьих боях, и пса выкинули, чтобы утилизировать, но тот на зло выжил, а благодаря времени с Мигелем, который давал ему свою последнюю еду, мыл и помогал лечиться, стал более менее здоров и даже старые шрамы прикрыла новая шерсть. И теперь он блуждал не один, а в компании, так их дорога привела в бордель, как бы странно это не звучало, где хозяин нашел внешность испанца достаточно хорошенькой, предлагая за интимные услуги хорошее вознаграждение и даже крышу над головой и для него, и для кобеля. А что Кесаде, занимайся сексом, получай деньги, но он даже не представлял во что вляпался, так как клуб принадлежал одному испанскому клану, и он об этом не знал до поры и времени.","Обслуживали тут всяких разных личностей, и разочек, тот самый переломный в жизни Кесады, пришлось быть хостом для странного человека, и нет, дело было не в интиме, а в том что его наоборот не было. Была светская беседа, которую Мигель поддержал очень будь здоров, да на личико симпатичный, а за последний год что тут работал вернулся в свою лучшую форму. Что конкретно произошло парень так и не понял.. последнее воспоминание было о совместном выпивании какого-то напитка с тем самым человеком, а глаза открыл уже в Монако, и обрадовало его то, что пес был рядом, так как пытался отбить своего хозяина и видимо чтобы не привлекать внимание при похищении, пса забрали тоже."],"ability":["— Острый ум, о чем говорит высокий уровень иронии и шуток; высокая эрудиция на широкие, разные темы, так как обучен не только среднестатистическими знаниями, но и куда более глубокими темами, широким спектром которых владеет. Достаточно легко учит что-то новое.","Высокая выносливость для многих сексуальных забегов + танцевательная деятельность дает о себе знать, соответственно тело в хорошей, подтянутой форме. Не злоупотребляет ни алкоголем, ни наркотиками, иногда курит"],"weaknesses":["— математика. Пусть и закончил на отлично, но уже давно не практиковал, да и вообще все что с цифрами связано вызывает затруднение в мозгу и долгое переваривание. Так же из слабых сторон ловкость и поворотливость в силу роста и веса.","И конечно любимый пес, если можно назвать это слабой стороной. Четвероногий друг отличный объект для манипуляции. Так же можно отнести ведомость (хотя возможно это плюс), Мигеля легко в чем-то убедить и повести за собой, если в этом есть достаточно весомых и убедительно-выгодных ему аргументов."],"hobby":["— пение, танцы, а так же коллекционирование бокалов для напитков разных форм (пить алкоголь не любит, но безалкогольные коктейли и напитки любит)."],"features":["— Ненавидит сладкое, но обожает жгуче острое.","— аллергик.","— пишет песни, когда скучно и умеет играть на гитаре.","— знает Английский, испанский и французский.","— множество разных тату на теле, а так же пирсинг."],"appearance":["— Рост 205, вес 101. Смугловатая кожа, как положено испанцу. Черные волосы средней длины, стриженные каскадом с челкой ниже бровей. Крупные черты лица: ровный длинный нос, пухлые губы, большие глаза, но чаще прищуренные, с лисьим разрезом.","Фигура широкоплечая, узкие бедра, выраженные тазовые кости и прямые мышцы нижнего пресса. Большие ладони и длинные пальцы, очень видно рельефные вены на руках. Проколото одно ухо в котором обычная серебряная серьга-колечко. (P.S. Прикрепляю ещё голос Мигеля)"]},"stats":{"Сила":4,"Ловкость":4,"Интеллект":4,"Харизма":6,"Восприятие":3},"tracks":["ТЫ СУЩЕСТВУЕШЬ — XOLIDAYBOY"],"photo":"images/miguel.jpg","archived":false},{"id":"nam","name":"Нам Чхеён","aka":["Nam Cheyeon","Крестная мать — Madrina"],"tags":["HORTUS"],"age":[],"role":[],"orient":[],"player":{"name":"Dęssę Mortęllę","url":"https://vk.ru/y_a_me"},"date":"23 авг в 0:46","epigraph":null,"sections":{"weaknesses":["коулрофобия — боязнь клоунов.","инсомния — редкое, но меткое расстройство сна.","гипестезия — частичная потеря болевых ощущений вследствие детской травмы.","идеалистка, склонная к совершенству в любом. мир абсолютно гадок и не совершенен: это она и пытается исправить на людях. и работать она будет до конца, как и вы.","‘ hobby","утренняя зарядка, пробежка, обязательная чашка кофе.","постоянный уход за собой и контроль внешнего вида – она всегда презентабельна и собрана.","она правда любит цветы и у неё есть парочка видов.","‘ features","знание трех языков: английский (С1) итальянский (В2) и корейский как носитель.","амбидекстр: владеет обеими руками в идеале.","предпочитает официальный стиль, а за пиджаком на ремне покоится нож.","тактильная, относится к этому абсолютно нормально.","предпочитает минимализм: меньше деталей, только порядок и тихая роскошь.","‘ appearance","всё на фотографиях.","хан со хи // han so hee.","с правилами ознакомлена.","сила — три.","ловкость — четыре.","интеллект — семь.","харизма — шесть."]},"stats":{"Сила":3,"Ловкость":4,"Интеллект":7,"Харизма":6},"tracks":[],"photo":"images/nam.jpg","archived":false},{"id":"norman","name":"Норман Кристофски","aka":[],"age":["29"],"role":["роль в клане - Телохранитель Босса, Эдера."],"orient":["Латентный гомосексуал. Женат."],"tags":["TARGET ELIMINATION"],"player":{"name":"Кристофер Норман","url":"https://vk.ru/norm_kris"},"date":"16 июн в 15:12","epigraph":null,"sections":{"character":["—В целом, Норман добрый человек с обостренным чувством справедливости, привыкший лгать себе и другим. Он не сразу обнаружил себя внутри мафиозной группировки, не обладая должным любопытством, чтобы самому сделать выводы о своем боссе и его темных делах, но за годы службы даже свыкся с этой мыслью и привязался к коллегам и самой вилле. Он всегда приветлив, порой даже общителен, особенно, если ему кажется, что может помочь советом или делом. Постоянно с улыбкой на лице, весел и оптимистичен, впрочем, отличается и сдержанностью, ведь эта его черта воспитана окружением.","Норман сильно религиозен и старается придерживаться благочестивого образа жизни, однако специфика работы из раза в раз вынуждает его придумывать новые оправдания своим ужасным поступкам. Он истязает себя болью, чтобы облегчить душу, молится, чтобы избавиться от соблазнов и дурных мыслей. Это, на удивление, помогает.","Он бесприкословно предан Эдеру, однако с растущим доверием к телохранителю и росту его обязанностей, каждый новый приказ, жестче предыдущего, заставляет его задуматься, а готов ли он его выполнять. Сейчас цена ошибки или отказа - его собственная жизнь, но едва ли, согласно его вере, она ценнее тех, чьи жизни он обрывает."],"biography":["— Кристофски родился в семье религиозных предпринимателей в Юте, так что неудивительно, то в мальчика с самого детства было заложено правильное воспитание. Сначала он был милым румяным толстячком и даже подвергался буллингу, но благодаря активным занятиям боевыми искусствами и спорту, он смог превратить вес и рост в преимущество. Он неплохо учился и получил высшее образование (правда, успехи были в первую очередь спортивные, как и его стипендия), путешествовал в волонтерских миссиях и женился в 20 лет на девушке его же веры.","Будучи лишенным предпринимательских качеств, в качестве своей профессии Норман избрал охрану, и довольно быстро, по связям отца, получил первую работу в качестве помощника и телохранителя важного лица. Главным образом потому, что мужчина не служил в армии и не наемничал в горячих точках, получать хорошие предложения ему приходилось исключительно по рекомендациям. К Лиарду, который только пришел к власти, Кристофски попал по протекции от члена церкви, помог ему пережить пару смертельных стычек, и со временем занял должность секретаря и шофера, глубже вникая в дела Liar, порой против своей воли.","Периодически он вынужденно отпрашивается в отпуск, навещая семью, где растут его сын и дочь. Из-за чувства вины навещает их редко. Последнюю поездку пришлось прервать из-за отравления Лиарда - и Норман купил билет обратно в Монако, покидая гостеприимную Юту. Ему пора возвращаться к обязанностям."],"ability":["- Владеет греко-римской борьбой, тхэквондо, джиу-джитсу.","- Внимателен к деталям, хорошо запоминает имена, лица.","- Отличная интуиция. Считает это божественным даром в его деле.","- Выносливый. Пару раз словил пулю и выкарабкался. Редко болел. Быстро восстанавливался от травм."],"weaknesses":["- Слабохарактерный. Предпочитает не принимать решений сам, легко прогибается под более харизматичного собеседника.","- Излишне помешан на вере, пусть и не выражает это открыто.","- Имеет тягу к саморазрушению.","- Раненое в последней перестрелке колено до сих пор ноет. Норман старается не хромать, чтобы не потерять должность."],"hobby":["- Проводит все свободное время в зале. Его интересует бодибилдинг, тяжелая атлетика, джиу-джитсу, греко-римская и тхэквондо. Любит спарринги.","- Дважды в день Кристофски молится, по воскресеньям старается посещать церковь, однако от причастия отказывается - алкоголь категорически не пьет."],"features":["- Кристофски и его семья принадлежат к религиозному движению «Церковь Иисуса Христа Святых последних дней». Их община довольно консервативна, поэтому Норман старается не разочаровать близких и Бога дурным поведением.","- Любимые его самоистязательные практики - асфиксия, порка и кровопускание. Раны он самостоятельно обрабатывает, а следы тщательно прячет.","- Не испытывает влечения к жене, что считает очень даже благопристойным. Испытывает влечение к случайным мужчинам, что считает дьявольским соблазном.","- Большую часть зарплаты отсылает семье и на религиозные пожертвования.","- Согласно религиозным табу, не употребляет алкоголь, наркотики и даже кофе. Не курит. Иногда... иногда приходится нарушать."],"appearance":["— прототип Алан Ритчсон","Норман - настоящий великан. Рост 203 сантиметра, вес 120 килограмм. Впрочем, его лицо отражает дружелюбие, а приличные костюмы вроде свежевыглаженной рубашки с брюками намекают на то, что он вовсе не монстр, а настоящий джентльмен. У него нет татуировок и пирсинга, а шрамы почти не заметны. Глаза и волосы светлые, стрижка аккуратная, за бородой следит, считая, что это признак взрослого, уверенного в себе мужчины.","- очки характеристик"]},"stats":{"Сила":5,"Ловкость":3,"Интеллект":4,"Восприятие":5,"Харизма":3},"tracks":[],"photo":"images/norman.jpg","archived":false},{"id":"piter","name":"Питер Диггер","aka":["Piter Digger","\"Милашка\" Питти; \"Яма\" (Pit)"],"age":["39"],"role":["Цепной пес Консула Target.","Телохранитель, решала, наёмник."],"orient":["Гетераст (гомофоб)"],"tags":["TARGET ELIMINATION"],"player":{"name":"Teo Chance","url":"https://vk.ru/id223450884"},"date":"29 июн в 4:05","epigraph":null,"sections":{"character":["- \"Ты пойдешь со мной теплым или холодным\"","Питти не джентельмен. Питти ебаный ЧОРТ.","Сильный. Опасный. Уверенный. Надёжный. Дисциплинированная выдрюченная службой псина в шипастом наморднике. По команде выгрызет глотку и откусит жопу.","В работе - хладнокровный профи. Маячит за плечом босса, ласкового напоминая каменной рожей, что вы вообще-то не бессмертный. Присутствием интеллекта в глазах умеет сливаться с мебелью. Может показаться, что этот шкаф хорош лишь для того, чтоб перегородить им дверь. Но где-то на антресолях сухо стучит метроном холодного рассчета.","Образом тупого мордоворота успешно спекулирует, на деле наблюдательный, внимательный, не обремененный моральным кодесом и не склонный к сомнениями мудень.","Рациональный, но вспыльчивый, как динамит на коротком фитиле.","Если бы токсичная мускулинность была человеком, ее звали бы - Милашка Питти.","Предан БОССУ.","Босс это Царь, Бог и конфета-леденец на палочке. Готов облизать его всего с ног до головы. Без гейства.","Сдох бы ради Босса, но жить и въебывать ради него как-то прагматичнее.","Если Босс скажет гавкнуть, Питти спросит только насколько сильно должны все вокруг обосраться.","За работу держится, как пьяный за столб. Если собственное мнение и имеет - то жёстко, в сраку и придушив до скулежа.","Питти нравится, когда ему не нужно напрягать голову. Но если приходится ему, значит в системе какой-то проеб.","Методичные проебы заставляют Питти нервничать. А когда Питти нервничает, приходится закапывать трупы.","Стерпит многое, поджимая челюсть, но градус закипания будет постепенно накапливаться, пока фляга не засвистит.","Если романтизировать Питти - это рыцарь, цель жизни которого служить своему вассалу. Если насухо без смазки - Питти жестко проебался с осознанием своих желаний, вот и живет чужими идеями. Смысл находит в своей полезности. Он не человек - ботинки с винтовкой. Спать так получается крепче.","К жизни относится философски, к смерти тем более. Она для него ежедневная рутина, успевшая набить оскомину. С утреца мочилово, вечерком дрочилово. Можно наоборот.","Вообще Питти в своем познании преисполнился. Нашпигует вас сначала житейской мудростью, а потом пулями."],"biography":["В жизни каждого человека наступает момент, когда зашёл не в ту дверь..","Питти в нее не зашел. Он ее нахуй выбил чьей-то расквашенной харей.","Где родился, там не пригодился.","Папа алкаш вытащил хуй, стряхнул, и исчез за горизонтом. Мама любовь выдавала пиздюлями и нравоучениями, вытаскивая сына сначала из кабинета директора, потом из участков, потом из каталажек.","Путей у Питти было не много. Сторчаться, сесть или армейка.","В последнем неожиданно нашел призвание, покинув родной Ливерпуль и попутешествовав по горячим точкам в группе зачистки, дорожками снюхивая порох и кровь.","Оставшись контрактником, в Бельгии неожиданно встретил нужных людей, которые раскидали на пальцах, что убивать ради частных организаций выгоднее, чем ради государства. В следующей же операции в Ираке Питти \"на смерть\" подорвался на мине и стал наемником.","Миссия за миссией, он показал чего стоит, пока не попал в поле зрение Liar.","Вообще больше пришелся бы к месту на нарах или в картеле, а не в элитной организации, но песья преданность, трудолюбие и скрупулезность в работе, привели его куда надо.","Питти хороший убийца. Учился бы на сантехника - был бы хорошим сантехником, но не сложилось, не фортануло. Так что убивать у него выходит лучше чем чинить, а Питти ебать как любит, когда у него что-то хорошо получается."],"ability":["Машина для убийства.","Знает крав-мага, бакум и много других страшных слов.","В рукопашке и с холодным оружием играет грязно. Использует уличные техники, включающие опасные болевые приемы, воздействие на суставы и удары, нацеленные на калечащие травмы и жесткие клинчи. В ход идут уязвимые точки и подручные предметы. Насрать на методы, главное выживание.","Из огнестрела предпочитает родную беретту. Хотя терпения хватит и на долгий флирт со снайперкой.","Ненавидит возиться со взрывчаткой.","В гуще боя входит в адреналиновый раж, не замечая ран и способен банально истечь кровью.","...","Питти - это краткосрочная эффективная тактика, а не долгая хитровыебанная стратегия. Выиграет в шахматы, сломав доску о лобешник соперника.","Мастер переговоров. Потому что его жеваный британский кокни нахуй никто не разберёт."],"weaknesses":["- У Питти есть дочь. Его маленький семилетний ангелочек. Все хорошее, что вообще было в Питти - ушло через член в ее мамашу и превратилось в чудо.","Боготворит своего зайчонка. Скрывает ее подальше от глаз, потому что если придется выбирать между ней и организацией, скорее сам проглотит пулю.","- Дислектик. Пишет с дурацкими ошибками. Стыдится и обижается, когда в это тыкают. Мы мясники, а не доктора наук. Пасть завалите(","- Амбассадор кризиса среднего возраста","- Чувствует, как годы начинают потихоньку брать свое. Если раньше полагался в основном на бешеную мощь, то теперь вначале думает, как бы так выебнуться, чтоб сустав в тишине не хрустнул.","- \"Ну вы и мерзкий\" - \"Знаю, мне все психологи так говорят\". В досье зафиксированны проблемы с контролем гнева.","- Парадоксальное качестве в его ремесле, но Питти не любит несправедливость. Когда ее на квадратный метр слишком много - желваки начинают играть.","- Хочет сесть на диету, но никак не получается. Он не ебучее травоядное, чтоб жрать овёс!","- ... Ладно, дай сюда эту бляцкую спаржу."],"hobby":["- Психологи посоветовали вести дневник для профилактики гнева. Так что каждый день достаёт блокнот и карябает, как школьница:","\"Дарогой ебучий днивник, день 324. Вокруг меня все еще трутся сраные пидоры\"","- Совмещает пиво и качалку.","- Бешеный футбольный фанат \"Ливерпуля\". Если кружит с пеной у рта по территории и уничтожает груши в спортзале - \"Reds\" опять проиграли \"Манчестеру\"","- Завел в своем люксовом номере грядку, ходит с утра поливает помидорки и чешет яйца с видом на море."],"features":["С коллегами держится ровно, начальство боготворит, шлюх - слегка презирает, но охотно поебывает, когда можно. Когда нельзя поебывает ладошку или тех шлюх, которых можно.","Находит прелесть в простых бытовых ритуалах и ежедневной рутине. Побрился, покурил, покакал - чем не хороший день? Босс премию выписал - вообще буги-вуги.","Порядок его успокаивает.","Мама в доме престарелых с деменцией.","Навещает, хоть она его и не узнает.","Считает, что лучшее женское имя - Беретта. Хранит верность своей старой пушке, как женушке. Нежно зовёт ее \"Милосердие\"","Неиронично подписан на Стетхема.","Любит первобытную еблю в миссионерской позиции и маму.","Не любит - опоздания, чернослив и когда пидоры трутся рядом.","В детстве били геями. На дух их не переносит, но в силу профессии терпит, как неизбежное зло. Чем манернее и женственнее, тем больше фрустрируют.","Сильнее ненавидит только педофилов, но зарплата позволяет закрывать глаза на собственные принципы.","В бога верит, но поддерживает с ним деловые отношения. Иногда вслух торгуется.","Любимый фильм - Хатико. Разъебывается с него в лужу.","Где-то в глубине души неплохой человек, и за пределами работы старается жить по-человечески. Иногда даже получается."],"appearance":["Два метра мужичатины. Пахнет, как мужик. Выглядит, как проблема. Долговязый, мускулистый, угловатый и лопоухий.","Мечта, а не зять.","Лоска в нем, как в разъебаной бойцовской груше. Даже в смокинге за дохрелион деняг выглядит так, будто сейчас стрельнет сигу и трахнет вашу сестрёнку.","\"Дарагой ебучий днивник. День 224. Босс заценил галстук. Буду носить его до конца дней н̶а̶ ̶р̶у̶к̶а̶х̶\"","Взглядом вызывает инурез, потливость и скорую. Но все же есть на дне глаз что-то тоскливое.","Два зуба из дамасской стали.","Мог бы сделать нормальные, но так должники быстрее ссутся. Каждый раз рассказывает новую историю, как их потерял.","Нос фигурно перебит в двух местах  потому что Питти постоянно лупит физиономией чужие кулаки. Так что его редко можно встретить без синяка, пластыря и свежих швов. Если шрамы украшают, то он Анжелина Джоли в прайме.","Татуировок и пирсинга нет, потому что мама не разрешила.","Обрезан."]},"stats":{"Сила":9,"Ловкость":6,"Интеллект":2,"Восприятие":4,"Харизма":0},"tracks":["Да, я Дикий Мужчина - яйца, табак, перегар и щитина! — Ленинград"],"photo":"images/piter.jpg","archived":false},{"id":"richard","name":"Ричард Эдер-Джонсон","aka":["Richard Eder-Johnson"],"age":["целых восемнадцать лет – дожил до момента, когда на работу к отцу пускают без звонков и приглашений"],"role":["дипломат? сомнительно доверять ему дипломатию, но самое главное - вера. в себя у него определенно имеется, в мир, дружбу и жвачку – не факт"],"orient":["бисексуал – взгляд его, правда, пока только на девочек и направлялся, с иными же и пробовать страшно, кто знает, что батюшка с ним сделает, пойди что-то не так"],"tags":["ADMINISTRATION"],"player":{"name":"'white 'february","url":"https://vk.ru/id616496242"},"date":"14 мая в 2:32","epigraph":null,"sections":{"character":["« думаешь, у дьявола есть рога? »","очаровательная, чрезмерно яркая улыбка совершенно не вяжется с окружающим миром – грязным, темным, мерзким. то – его защита и оружие. визитная карточка, пропускающая в любые места: от дверей до сердец. аккуратный образ, сплетенный еще совсем юными пальцами, порезавшимися множество раз до крови: выверенная вежливость, дотошная своею чистотой; каждое просчитанное до мельчайших деталей слово – для собеседника, коего принимают скорее за загадку, ответ на которую будет его доверие и расположение, если то потребуется.","ричард – полотно, сотканное из противоречий. юное лицо с той нужной долей наивности, присущей людям его не столь большого возраста; опыт, непостижимый большинству даже взрослых, прячущийся на дне темных глаз, в сладостных улыбках, способных превозносить собеседника к выси, дабы в следующее мгновение словами, слетевшими с уст, смешать с грязью под ботинками.","и вновь он улыбается, будто и не понимает вовсе, на возраст – в кой тыкали и тыкают, вероятно – ссылается. ричард понимает – куда лучше, чем окружающие способны себе представить. ощущает настроения вокруг, знает, как довести и запутать. в том их ошибка – не воспринимать его всерьез, а он этим пользуется столь нагло, неприкрыто, строя невинный взгляд, стоит словить за руку на лжи.","театр одного актера. сцена вся для него: он и герой, и злодей; врач и убийца; ведущий и ведомый – растягивает уста в омерзительной улыбке, кланяется полному залу, заполненному людьми снаружи, уродливыми, лживыми, ничем не лучше него самого. выступает. как умеет, как учили, чтобы понравилось всем, не оставив ни одну душу без восхищения или отвращения к его сверкающей персоне. его так воспитывали: не ребенком, не человеком, а актером. искусным, выверенным, идеальным в своей игре и масках."],"biography":["обглоданная временем стена, краска, крошащаяся под пальцами, и омерзительный букет ароматов, начинающийся от дешевого алкоголя и заканчивая засохшей кровью от драки вчерашнего дня, кою увидеть не удалось, но след остался.","ему больно. женщина, коя должно быть должна зваться его матерью, тащит по сырому, пропитанному плесенью коридору, который не кончается. ее серьги противно позвякивают каждый шаг, каблуки глухо отбивают по бетонной крошке, грозясь вот-вот обломаться под весом от заношенности, а короткие ногти впиваются в детскую руку, оставляя следы полумесяцы. он уже не упирается, даже говорить не хочет, сжимает только губы в тонкую полоску, разглядывая причудливых людей вокруг: кому-то плохо, кто-то ползает, а иные орут, срывая глотку.","мать от них не отличается почти ничем, только если хрупкостью женской, визуальной. бьет она больно, наотмашь, царапает ногтями бледную щеку, кричит неплохо – уши не закладывает, как бывает, стоит голос повысить ее клиентам, но тоже достойно уважения.","его здесь и оставляют как бездомного котенка. старухи-деревенщины носят таких в мешках, к реке, топя под их жалобный писк; мальчик же принимает участь молча, заглатывая отравляющий воздух в легкие без лишнего звука, сглатывая лишь, стоит услышать очередное змеиное шипение женщины рядом с ним, когда поднял глаза, дабы вопрос задать. конечно, она не вернется. мальчик даже не уверен, что эта женщина осталась жива, стоило передать его в руки грязные, мерзкие, заляпанные чем-то, да и лица у них неприятные, будто тролли скалятся голодно, оголяя свои вставленные криво-косо зубы.","он никогда не был глупым. еще с малых лет научился пропадать, когда эта женщина, зовущая себя матерью, была зла; научился улавливать чужое настроение по звуку шагов, понял, как правильно подмазываться, когда та была в плохом расположении духа. здесь ему это тоже пригодилось, развилось скорее даже еще сильнее, отчего били чуть меньше, кормили чуть больше.","правда, мальчик думал, что это сыграет ему на пользу, будто отпустить его могут, поднять до звания им подобных, снять тяжелые цепи неволи; то сыграло с ним злую шутку, под звук громкой музыки, под танцы обнаженных тел и ухмылки на лицах восковых, безжизненных, готовых отдать больше денег за товар пригодный, прилежный и куда более приятный, нежели остальное стадо ревущих и кричащих. он просто стал дороже, но никак не полезнее, не выше в чужих глазах. ребенок, всего-то лет двенадцать от силы, с той холодной решительностью, коя встречается редко даже в глазах взрослых; это был план, быть может не столь идеальный, но определенно действенный. на кон ставят все или ничего. его продадут и больше шанса не будет. вопрос в глупой свободе, в том, чтобы хоть раз еще вдохнуть свежий воздух без чужого надзора.","покупатель – какая-то старая рухлядь, явно важная, так по-хозяйски оглядывающая его, касающаяся, что становилось тошно. они – хозяева ситуации. сидят так противно, возвышенно, не ставя его в счет – он разменная монета, товар без воли и мнения.","да пошли они к черту.","заточенный столовый ножик, украденный еще месяцами ранее, на одном из ужинов этих мерзких рожь, коим приходилось унести-подать, входит в складки жира так омерзительно легко, будто в масло; бутылка спиртного, вероятно дорогого, возможно дороже самого мальчика, разбивается с оглушительным звоном. его последний штрих, акт многолетнего несогласия, обжигающей ненависти и отвращения – стащенная у «надзирателя» зажигалка, падающая прямо в лужу спиртного.","это сенсация. это ужас, вскрики, паника, такая нужная ему, ради которой все и рассчитывалось. им – этим огромным мужикам у входа, кинувшихся тушить пожар, огромную тушку верещащей свиньи – не до него, маленького и юркого, ныряющего меж испуганных тел, прячущегося под слоем человеческой паники.","его свобода продлилась недолго – пара ночей, наивных дней растопленного сердца женщин у магазина и тем прекрасным ягодным мороженым, кое он стащил у мороженщика, пока тот сюсюкался с другими детьми. его возвращают в клетку ничуть не уважительнее, чем бешеное животное; за шкирку тащат, удивительно отчего-то не переломив тонкую детскую шею еще там, при встрече.","страшно? уже и нет. он прекрасно понимал, чем то кончилось бы. в мыслях только ягодное мороженое и лучи заходящего солнца, приятно греющие лицо перед возвращением в «ад». котел, отчего-то, холодный, а перед лицом не злобная рожа «надзирателя» – нет, там она тоже была, по левую руку от странного, слишком красивого и вежливого человека, которому этот хрыч что-то бегло и очень испуганно рассказывал – а кого-то совершенно иного, смотрящего на него впервые как-то иначе, не как на товар, быть может? мальчик такого взгляда еще не видел, он не понимает, не идентифицирует.","он возвращается почти к той же точке, откуда и начинал. только теперь клички и непонятные зовы сменяются четким, выверенным «ричард» от манерного мужчины, а поучительные уроки как быть удобным для взрослых меняются в стезю как быть н е удобным от друга сия мужчины. это все странно, непонятно, а мысль, что каждое чужое действо делается лишь для повышения его цены, не покидает душу – в их действиях, может, какая-то логика, ему доселе не понятная.","снова неволя, четыре стены – или чуть больше, в них есть окна, ванная комната и мягкая кровать с едой из холодильника – и «надзиратели». с ними уже чуть интереснее. он – ричард, мальчик с именем – учится выписывать каждую букву на белом листе, вслушивается в поучительные слова этих мало похожих на всех знакомых ему взрослых; они – его очередная публика, сцена, на коей ричард так старательно разыгрывает роль прилежного ребенка, как всегда то умел.","и вот стоило проскочить спокойствию, может доверию к его детскому лицу от взрослых людей, случается это: устроенный на скорую руку пожар – ему начинает это нравится – и попытка сбежать; ножик в бок манерного лиарда; растворитель в так заботливо приготовленную еду своего «родителя» и угон автомобиля. его каждый раз возвращали, за шкирку втаскивали в надоедливые четыре стены, по кругу наказывали, а после каждый из них делал вид, что ничего не произошло – они снова примерны наставники, а он – ребенок, так внимательно впитывающий их знания.","каждое утро – ожидание, что его продадут. вот уже, вот, последний урок, последний разговор, лиард придет не один, может, с аароном или очередным покупателем. ричард бьется от страха, как бешеное животное, неуправляемое, ждущее собственной смерти, коя отчего-то никак не приходила.","«угомонись».","мысль озвучивается четко, вслух, не оставляя места для сомнений и вопросов – не продадут[ если оправдаешь ожидания]. доверие? отнюдь. они переезжают – это первый раз, когда ричард не пытался исчезнуть в толпе на улицах, нырнуть в переулок или устроить саботаж. все наконец встает на нужные места в еще юной голове: больше его не учат быть товаром, его учат продавать. дают знания, кои подневольным не нужны – как бить, как быть. и это намного, невероятно, интереснее.","так проходит несколько лет, за кои тихий, почти что забитый, мальчик показывает зубы: все чаще идеи приходят не против, а за его «учителей», все чаще в планы взрослых вносят тонкую ниточку хитрости; ричард схватывает все налету, проникается тонкостям бизнеса, отравляет кровь доверием к себе, навыком, приобретенным еще задолго до этих людей. к семнадцати он их продолжение, такой же омерзительный, изворотливый, впервые вышедший на свет не как ученик, не как раб или товар – как наследник империи."],"ability":["— невероятно смышленый малый. схватывает и понимает все, повторять дважды не приходится, а уж умению анализировать и строить логические связи можно только позавидовать","— чуток к эмоциональному состоянию человека, но никогда не использует это для добра. вопиющий манипулятор, но зачастую все же неосознанный, наученный жизнью, а не холодным умом","— идеально поставленная речь и умение подать себя – его визитная карточка","— умеет и в ближний, и в дальний бой, но зачастую предпочитает бить и бежать. в долгих боях и тренировках он вечно проигрывал своему тренеру"],"weaknesses":["— самая огромная, невероятная проблема, которую ричард никак не может решить – проблемы с агрессией. то случается совершенно неконтролируемо, глупо, яркой вспышкой, почти стирая память волной агрессии. состояние аффекта. его не учили управляться со своими эмоциями, не показывали как те проживать. он терпит до последнего, сглатывает комок гнева, контролирует все и вся, дабы в один чудесный, непредсказуемый момент сорваться – ударить, швырнуть, уничтожить. и пусть подобные приступы бывают у него крайне редко, их неожиданность доставляет множество возможных проблем","— пусть аарон и обучал его ведению боя, физическая подготовка ричарда оставляет желать лучшего","— в столь юном возрасте уже подсел на собственный товар"],"hobby":["— с недавних пор занялся мотоспортом, стар уже, правда, дабы выступать где-либо, но сие занятие определенно приносит ему радость","— доводить до ручки всех его окружающих"],"features":["— откликается на множество различных имен. настолько привык врать каждому встречному в лицо, представляясь как-то совершенно иначе, рассказывая новый и новый факт о себе, что теперь дергается практически на любое имя","— еще при жизни с матерью научился красть. выходил на людные площади и обчищал чужие карманы ловкими ручками, покупая себе еду на вытащенные из чужих курток деньги","— за множество попыток побега от горячо уважаемых наставников научился вскрывать замки. по этой же причине часто носит с собой хоть что-то, способное помочь в этом деле","— любит всем рассказывать новые, совершенно нереалистичные истории из жизни. он вообще в этом спец, так красочно и ярко описывает, что сложно ему не поверить. но что из всех слов ричарда правда – остается только гадать","— за последний год удивительным образом успел найти себе столь же богатых друзей, вписаться к ним, будто всегда там был, отчего все реже бывает в монако и все чаще в других странах"],"appearance":["— 1.89м | 75 килограмм. карие, практически черные, глаза и каштановый цвет волос; на солнце кажется, что есть россыпь веснушек. крепким телосложением не отличается, но и худым не назвать – в меру сложен для человека, занимающегося спортом не первый год","— визуал: benji krol"]},"stats":{"Сила":2,"Ловкость":3,"Интеллект":5,"Харизма":6,"Восприятие":4},"tracks":["Devil in Disguise — Marino"],"ageShort":"18 лет","photo":"images/richard.jpg","archived":false},{"id":"rosaria","name":"Розария Ривер","aka":["Rosaria River"],"age":["26"],"role":["Цветок в HORTUS"],"orient":["Бисексуальна."],"tags":["HORTUS"],"player":{"name":"Розария Ривер","url":"https://vk.ru/rosary_river"},"date":"30 июн в 5:33","epigraph":null,"sections":{"character":["— Роза – оправдывает свое имя на все сто. В ней уживаются, казалось бы, несочетаемые грани. Острые шипы, но столь нежные лепестки...","С одной стороны, она когда-то окончила медицинский, и ее руки, столь же ловкие на руле мотоцикла, как и знания анатомии, физиологии, фармакологиии и умению зашивать раны. Способность сохранять хладнокровие в самых критических ситуациях – это ценнейший навык, отточенный не одним годом практики и не одними разорванными конечностями.","Минувший этап ее жизни – это рёв моторов и азарт гонок на байках и машинах, где скорость, риск и идеальное чувство машины были ее глотком кислорода. Этот опыт придал ей решительности, хладнокровной оценки опасности и умения принимать молниеносные решения, что не единожды спасало ее рыжую голову.","Вечерами, когда город засыпает, Ри-ри может уйти в тир. И там, в мерном щелканье выстрелов, раскрывается еще одна ее сторона. Точность, концентрация, идеальный прицел – она не просто стреляет, она чувствует оружие, становясь с ним единым целым. Но самое любимое— холодное оружие. Метание ножей. Это то, чем она гордится. Там важна не только сила, но и невероятная грация, умение считывать пространство.","В Ривер сплетаются дерзость гонщицы, смертоносная точность бойца и врачебная эмпатия.","Но далеко не всегда всё идёт гладко, иногда она просто не может перестроиться. В обыденной жизни она словно застревает на чём-то одном. Сегодня – дикая и бесстрашная, а уже завтра готова рыдать, утыкаясь в плечо, ведь её заедает чувство вины за излишнюю жестокость. И пройдёт всего пара дней, как она махнет рукой на всё и свернёт кому-то шею.","Ее способность постоянно перевоплощаться стала настолько естественной, что она потеряла связь с истинной собой. Сегодня она с удовольствием поддержит беседу о стихах и поэтах, словно истинный ценитель. А завтра, запросто разберет с вами автомобильный двигатель, притворяясь наивной и задавая абсурдные вопросы вроде \"Почему у свечи не горит огонек?\". Это лишь уловка, чтобы заслужить ваше доверие. Мечтаете о милом и покладистом существе? Поставьте перед ней блюдце с молоком и кусочек шоколадки. Но помните, ровно до момента, пока она не решит, что пора сбросить маску. И тогда она с  удовольствием вскроет ваше брюхо."],"biography":["— Что вы хотите узнать? Какие были ее родители и как она научилась ползать, а затем ходить? Гадайте сами. А мы окунемся в подростковый период, когда у человека появляется собственное мнение.","Школа... Тут много печальных историй, но наша не такова. Эта пора была самой ценной. Она научила ценить свое время. Обзаводиться хорошими приятелями. Вы не держите свое слово? Пошли к черту. Вы показываете силу, но лишь в отношение слабых? Вам не по одной дороге. Ри-Ри всегда выбирала тех, кто свое слово держит до конца. Сильных, но не дураков, коих было словно щебня на дороге. Она любила и любит, когда люди несут ответственность за свои слова.","Компания, в старшей школе была хорошим уроком. Алкоголь, сигареты... Безудержные танцы и прогулки до утра. Скандалы в семье на этой почве, но все прощалось. До одного момента. Кто же знал, что ночью, жизнь только просыпается в этом городе? Если бы она тогда включила мозг... Двое из ее компании, так и не были найдены в последние дни. Их тела не нашли. До сих пор молвят, что они просто оказались не в том месте, не в то время. А Ри даже слышать об этом не желает.","Именно после того случая, она замкнулась немного в себе. Ушла с головой в учебу. Цеплялась за все, лишь бы не видеть людей и не слышать их. Сидела в библиотеки часами, изучая книги до дыр.","Год... Два, затем и третий пролетел. А для нее все это лишь сон. Одна случайная встреча изменила все. Она столкнулась с какой-то фурией на дороге запачкала ее одежду тональным кремом... Спонтанная встреча, а ее словно заставили наконец-то вдохнуть.","Они проводили день за днем в разговорах. Устраивали вечера и слушали музыку. Даже угнали чью-то машину","... Один лишь бог знает, как им удалось не попасться. Ремонт разбитой машины стоил бы им как небольшая квартира на окраине.","Ри уже думала что влюбилась в девушку","Она в прямом смысле не могла без нее дышать, но... Она исчезла. Просто исчезла не оставив даже записки. В мотели сказали, что она съехала. Общие знакомы говорят, что уехала. А у Ри словно выдрали сердце оставляя ее с кромешной тьмой и пустотой внутри себя.","Именно тогда, она собрала вещи и уехала в Токио. Бросила работу в медицинском учреждение и оставила прошлое позади.","Уже там ее дороги пересеклись с местной бандой, которая нелегально участвовала в гонках. И в первый же день Ривер ебнула тачку одного из главного. Но мало того, что ей удалось выкрутиться, так она добилась того, что позже стала правой рукой главаря.","Именно на вершине, когда казалось, что весь ночной город лежит у её ног, а рев моторов - лучший саундтрек к жизни, всё и начало рушиться. Взлет был стремительным, словно выстрел, но закон всемирного тяготения для таких, как Ри, работает безжалостно и с удвоенной силой. Однажды вечером обычная разборка за территорию вышла из-под контроля, оставив после себя не только разбитый асфальт, но и трупы, замешанные на предательстве. В группе завелись крысы, которым они доверяли как себе, продавшие всех с потрохами полиции и конкурентам. Ривер и Черепу пришлось уйти под шквальным дождем, оставив позади не только позиции, но и куски собственной души, вдыхая гарью плавящегося металла. Забывая о том, на сколько они были свободны.","Каким образом она оказалась в Монако?","Все началось с жажды познать больше, проникнуть в суть вещей, пуститься во все тяжкое. Одна встреча, одна вечеринка, три дня – и вот она снова сменила свои планы, спешно собирая вещи. Осознавала ли она, к чему может привести такой выбор? Безусловно. Понимала ли риски, связанные с подобным шагом? Да.","Смогла бы она передумать? Нет.","Для нее существовал принцип: либо пан, либо пропал.","Ей нужно было вернуть долги. Неудивительно, ведь она помогла тому парню, который попал в передрягу с ножевыми ранениями. Как же его там звали… Кажется, Кристофер или что-то вроде того. Она бы точно вспомнила, услышав его имя. К тому же, появилась надежда снова увидеться с Мрачным и Песиком. Только вот главное – не называть последнего так в присутствии посторонних. Вряд ли охранники наследника","клана оценят ее прозвище для их босса. В любом случае, она решила отказаться от роли помощницы и доверилась заботе Сада."],"ability":["—  Физические: Благодаря компактному телу делает ставку на гибкость и скорость. Про выносливость вспоминает в последний момент. Если выбирать ближний или дальний бой, то выбирай второе. Прекрасно осознает, что ее могут снести одним ударом.","Умственные: Прекрасно концентрируется на поставленных задачах. В критических ситуациях привыкла действовать, а не поддаваться панике. Легко запоминает любую увиденную информацию."],"weaknesses":["— Частые головные боли. Для нее - лучше смерть, чем терпеть эту боль. Глотает таблетки пачками.","Причина: Защемление нерва.","Появляется резко и неожиданно.","(Можно использовать в ваших целях, но не на постоянной основе)","— Ближний бой.","— В свое время бросила употребление наркотиков самостоятельно. Ломки нет, но в случае употребление новой дозы может сорваться и отдаёт себе в этом отчёт. Из-за чего старается держаться как можно дальше от этой гадости."],"hobby":["— Любит готовить. Готова жить на кухне, если оценят по достоинству. Ей не важна сложность блюда, дайте рецепт и в указанный срок все будет готово.","— Садоводство. Пару лет назад её накрыло и она сажает цитрусовые, цветы и кактусы. Последние дохнут как мухи...","— Реставрация книг. В свое время решила, что это единственное, что достойно ее внимания и заботы."],"features":["— Вывих нижней челюсти. Настолько привыкла с этим жить, что сама вправляет в любой момент.","— Прекрасно играет на скрипке и пианино. В дождливый вечер предпочитает скрипку.","—Курит редко, но всегда имеет при себе пачку вишневых сигарет","— Водительских прав нет. Зачем? И без них ездить умеет.","— Носит с собой маленький нож и булавку.","— До ужаса боится пауков и паутину. Выберет все что угодно, но не их компанию.","— Высокий болевой порог. Сломаете палец? Закричит, но уже через пару минут будет сидеть с каменным лицом. Чаще всего привыкла терпеть боль со словами \" Хуйня, завтра не вспомню\"","— Знает испанский, финский, английский.","— Имеет навыки взлома, но максимум откроет простенький замок и наручники.","— За сладкое душу продаст, но не других."],"appearance":["—  Рост: 163см | Вес: 64 кг.","Ярко-рыжие волосы ниже плеч и серо-голубые глаза, что временами отдают дымчитым оттенком.","Подтянутая фигура с умеренной мышечной массой, имеются несколько мелких татуировок, часть из них перекрывают шрамы.","- Рената Валиуллина."]},"stats":{"Сила":1,"Ловкость":7,"Интеллект":3,"Харизма":4,"Восприятие":5},"tracks":[],"photo":"images/rosaria.jpg","archived":false},{"id":"sohwan","name":"Со Хван","aka":["По работе господин Со, в крайних случаях просто Со. В клане зовут полным именем, так же встречается обращение док и мозгодок"],"age":["34."],"role":["Психолог."],"orient":["Гей."],"tags":["THE LAB"],"player":{"name":"Коля Вуфву","url":"https://vk.ru/lasenblasen"},"date":"2 июл в 22:06","epigraph":null,"sections":{"character":["— С первого взгляда, как и со второго, Со выглядит ответственным и серьезным, даже немного чопорным, особенно когда дело касается работы. Так, собственно и есть, если взялся за дело, будь добр сделай качественно и, если понадобится, отдай свое время переработкам. Усердие, это то, что в нем воспитывали с самого детства, оно стало частью жизни.","С третьего взгляда, возможно, начинает проглядываться чувство юмора, зачастую тонкое, граничащее со стебом или даже игривостью. Там где кончаются должностные обязанности, начинается не такая уж и занудная личность.","Если заглянуть еще дальше, можно открыть в Со Хване резвую доминантность и вообще-то даже развратность , но до этого нужно постараться дойти.","И, на удивление, все эти составляющие это и есть сам Хван. Даже если покажется, что серьезность это лишь образ, на самом деле он не прячется под маской, хотя умеет это делать. Просто как и обычный человек держит дистанцию."],"biography":["— Со был усыновлен в возрасте восьми лет, неким порядочным господином, чью фамилию он когда-то носил, как клеймо.","Родом Хван из засушливого захолустья, в котором случалось слишком мало хорошего, чтобы в сознании остались приятные воспоминания о том месте. Родных не стало в бушующем природном бедствии. Он и сам едва остался невредим, а как все было, помнит плохо, разве что, как оказался после больничной койки в койке чуть пожестче. В детском доме мальчик пробыл не долго, почти сразу за ним пришел приемный отец.","Отцом того мужчину называть было чистой формальностью, за еду, кров над головой, и финансированием, господин взращивал полезного для себя помощника. И таких как Хван, было еще двое. Быть ушами и глазами, подстраивать события в угоду отцу, заводить стратегические знакомства, в этом всем юноша погряз в свои подростковые годы. Положение в обществе и состояние было приоритетнее над человеческой глупостью под названием мораль. Никогда не имевший розовых очков, Хван увидел достаточно грязи, чтобы вера в справедливость и прочий идеализм окончательно загнила. Слепая преданность инструмента и начала спорить с откуда-то взявшимся собственным мнением и ощущением мира, но не дальше роя мыслей в голове не выходила.","Из предоставленных отцом вариантов выбора образования психология оказалась заманчивее юриспруденции и прочих потенциальных должностей госслужащих. Удивительно даже, что направление не сочлось бесполезным и непрактичным, все-таки для отца он был обязан быть разносторонним, а тратить образование на такую специальность, могло показаться расточительным. Выбор не был импульсивным, как и полностью рационализированным. Наградой было пьянящее чувство, что твое слово наконец имеет вес и даже влияет на чью-то жизнь изнутри.","После получения диплома, жизнь, как не иронично, завела его на службу в бюджете. Со практиковал в качестве психолога на военном объекте. Возился с травмированными солдатами, копался в их жизнях и головах, раскладывал по полочкам. К таким людям в нем по большей части не было сочувствия, как и личного отношения. Положительные отзывы пациентов и коллег говорили за себя о качестве его работы.","Одним из переломных событий в жизни Со Хвана стала смерть отца. Не сказать, что он горевал, напротив, ощущал сброшенный с плеч груз, когда смотрел на бездыханное тело. Тогда он вдруг ощутил, что все это время дышать было труднее, словно этот мужчина отбирал часть положенного сыну кислорода. Кончина влиятельного в подпольных кругах человека не проходит бесследно, может, со стороны все и выглядело более менее органично, подозрения все равно пали на членов семейства в первую очередь.","Из-за очевидных проблем, Хвану пришлось по собственному покинуть пост на службе у государства, уйти к частникам, что готовы были предоставить чуть более надежную защиту, и усердно делать вид законопослушного господина, ни коим образом не связанного с незаконными махинациями. А он таким почти и стал, но, как говорится, можно забрать мальчика из деревни, но не деревню из мальчика.","В подполье не особо-то разгуляешься, не так много где требуются услуги, которые он в состоянии предложить, еще меньше, где обстановка и условия устроят его. В конце концов, когда удачное знакомство дарит ему рекомендацию в более перспективное место, Хван без угрызений совести покидает предыдущее неофициальное трудоустройство, не страшась строгого собеседования."],"ability":["— Как ни крути, многим своим способностям он обязан отцу. От занятий спортом, до уроков рисования и игры на фортепиано. В подростковые годы посещал секцию борьбы, в последствии остановился на обычном тренажерном зале и бассейне. На данный момент не особо подготовлен к бою, но оказать сопротивление при необходимости сможет.","Зато весьма неплохо владеет навыками макияжа и перевоплощений.","Что касается умственных способностей, прежде всего там аналитика, профдеформация к профайлингу. Разумеется, в его голове находится обширная библиотека знаний психологии, без них, он и не был бы специалистом."],"weaknesses":["— Хорошо знает, что такое, когда вся твоя воля и действия идут по чужой указке. Боится повторения истории, от того и начинает нервничать и даже показывать зубы, в ситуациях, когда ему начинает казаться, что его свободе угрожают.","— Серьезное отношение к работе и следование правилам может сработать против него, хотя те, кто пытался юлить с договорами систематически отбриваются.","— Слабости могут быть и приятными, ведь правда? Раз уж мы тут с вами секретами делимся, можно упомянуть, что Со бывает сложно устоять перед красивым телом, даже если их обладатель «тупое животное». [Редкое явление, разумеется, для Со недопустимо подобное поведение на работе.]","— Может сам того не желая привязываться и сопереживать младшим с тяжелой судьбой."],"hobby":["— До клана, не сказать, что редко, перевоплощался в женское обличье и ходил так по клубам. Ему просто нравится макияж, нравится ухоженный парик и дорогая, струящаяся по телу, ткань. А ещё нравится реакция мужчин, с которыми он заигрывался. Как и пьяное веселье.","В закрытых наглухо стенах в этом всем отпала необходимость, не подходящая обстановка, не подходящее время. Со принял как данность, что с переодеваниями придётся повременить, или даже забыть навсегда. Кто знает, одно из платьев все же висит в его шкафу.","— Чайные церемонии изначально были лишь очередным навыком, который привил приемный отец, однако, сейчас для него это один из способов расслабиться, позволить мозгам отключиться, а рукам работать на автомате."],"features":["— Никогда не гнался за властью, для него понятнее и увереннее всегда было работать эффективно и тихо в тени вышестоящих ярких лиц. А еще лучше в покое без страстей на личном.","— Психолог вам не друг. Чётко разграничивает рабочее и личное.","— Из-за того, что родом из засушливых мест любит есть рыбу, раньше она была недоступная и очень дорогая, теперь может себе позволить богатый морепродуктами рацион.","— Так же как требователен к себе, так и уважает четкие правила и границы других людей. Если сам погрязает в трудоголизме, абсолютно не требует его от окружающих. Веяние установки \"рассчитывать можно только на себя\", вероятно, хотя за этим не скрывается пренебрежение.","— Не обделен эмпатией, адвокат дьявола своего рода, не приветствует большую часть деятельности, но и не осуждает своих пациентов даже мысленно. Во всем есть границы, так и лёгкая досада в номере после тяжёлого дня от увиденного мельком не мешает Хвану спокойно спать по ночам, плотно завтракать и педантично работать с людьми.","— не может отказать себе в удовольствии подначивать и подстебывать своих партнеров, если к тому располагает неформальная обстановка.","— Один из его братьев в раннем возрасте оказался за решеткой. Поддерживать с ним связь было опасно, хотя по первости Хван помогал ему как мог, но акцию доброты быстро прикрыли. Сейчас уже потерял след, где может находиться брат. Со вторым иногда обменивается поздравлениями. Сухие открытки раз в пару лет с незнакомых номеров, их способ показать, что оба знают сухую выжимку из жизней друг друга.","— Не имеет предрассудков по поводу употребления запрещенных веществ, но для себя в них не видит интереса. Зато к алкоголю не привередлив, но есть и более предпочитаемые напитки."],"appearance":["— непримечательное симпатичное лицо, можно даже сказать среднестатистическое, единственное, что может быть подмеченным - под глазами на щеках симметрично расположились две родинки. Тело подтянутое, в спортивной форме. Для работы предпочитает классический стиль одежды, периодически носит очки, но может спокойно обходиться и без них. Рост 181.","- Прототип внешности.","Steve Noh Sang-hyun"]},"stats":{"Сила":2,"Ловкость":4,"Интеллект":4,"Восприятие":6,"Харизма":4},"tracks":["LOOKATME — Jann","Charisma — Jann"],"photo":"images/sohwan.jpg","archived":false},{"id":"sunny","name":"Сонни Винсент Кейн","aka":["Sonny Vincent Kane","Лютик"],"age":["27 лет."],"role":["Цветок. Исполняет роль «удовлетворения»: эскорт, работа с нужными людьми через близость. Но способен и убить, пользуясь обонянием, хитростью и людскими слабостями. Формально не наёмник, но по факту — да, если метод подходит."],"orient":["Бисексуален."],"tags":["HORTUS"],"player":{"name":"Sunny Day","url":"https://vk.ru/id1118466957"},"date":"9 июн в 21:46","epigraph":null,"sections":{"character":["— Циничный прагматик без розовых очков. В детстве и юности прошёл через отрицание, ярость и стыд (по другим причинам — бедность, предательства, жестокость), к 27 годам собрал себя заново. Его философия: «Сломалось? Починим. Не чинится? Выбросим и найдём замену» — касается вещей, денег, людей.","Фанат личного пространства. Свою комнату держит в идеальном порядке — это единственное, что он контролирует. Выборочно откровенен: на прямой вопрос может ответить леденящей правдой и сразу уйти с темы.","Не лезет в драку первым, считая рукоприкладство последним делом. Если вариантов нет — берёт умом, хитростью, внезапной жестокостью. Живучий, приспосабливается к любому обстоятельству. Флиртует профессионально, за игрой может скрываться что угодно — от скуки до искреннего желания."],"biography":["— Сонни не помнит родителей. Рос в бродячей группе хиппи, где рано научился выживать. В 15 сбежал с двумя друзьями — вместе воровали, перегоняли машины, работали на подпольных точках. Один стал известным художником, другой обрёл веру и семью. Сонни… остался.","В 22 года попал в церковный приход,","сначала работником, потом помощником проповедника. Там встретил мужчину, ради которого пошёл на убийство: стал любовником его жены, спровоцировал скандал, отравил её. Это все было спланировано, обговорено. Но мужчина повесился от чувства вины. Сонни бежал.","Год скитался по южным штатам, спал в машинах, хостелах, работал за еду, воровал. Выжил. Забрёл в город, где его заметил Вальтер Хард, человек из мафии — оценил внешность, странный шарм и полное отсутствие тормозов. Предложил работу «цветком». Сонни согласился, потому что другого места не было, кроме того это было выгодно альтернативой, ведь он попался на воровстве у Вальтера, а за это, как правило, руку отрубают.","Три года в клане. Научился лучше флиртовать, лучше красть; убивать тихо, красиво, незаметно. Своих не трогает, но если его обидеть — запомнит, отомстит."],"ability":["— Читает людей: желания, слабости, страхи — через взгляд, интонацию, микрожесты.","— Навыки отравлений и инсценировок естественной смерти (через близкий контакт).","— Живучесть, адаптивность, уличная смекалка.","— Психологическое давление. Может сломать человека словами, если постель не нужна.","— Умелый вор.","— Немного стреляет."],"weaknesses":["— Фанатичная потребность в контроле маленького пространства. Вторжение в его комнату  без приглашения — почти гарантия агрессии.","— Может переоценить свои силы, но на понт не поведется.","— Аллергия на цветы, вызывающая слезы. Но при этом глаза не болят и не краснеют."],"hobby":["— Фотография. Но редко кому показывает.","— Курит травку в одиночестве.","— Ведет онлифанс."],"features":["— Прячет заряженный револьвер (спёр когда-то у Вальтера) под кроватью.","— Умеет жить один, но не хочет остаться одиноким.","— Легко подбить на авантюру, особенно если есть хорошая оплата.","— На теле несколько тату, даже интимная.","— Мечтает однажды уехать в кругосветку.","— Обожает мятные шоколадки."],"appearance":["—  1.73 м. Вес 65 кг — худой, но с поджарой, жилистой худобой, без слабости.","Острые скулы, впалые щёки, огромные голубые глаза, которые могут выглядеть одновременно невинно и пугающе. Под глазами — тёмные круги. Губы тонкие, с выражением усталой иронии. Волосы тёмные, обычно небрежно отросшие и лезущие в глаза.","Одежда в жизни — простая, удобная, тёмных тонов, часто ношеная. На заданиях — элегантный, дорогой, умеющий подать себя.","Интерсекс-вариативный. У Сонни смешанная анатомия. Внешне он выглядит как парень, но гениталии у него женские, однако абсолютно бесплоден.","В нём есть что-то странно привлекательное, почти болезненное, но при этом острое — как лезвие, завёрнутое в красивую бумагу. Он может показаться уязвимым, но в следующий момент — холодным и опасным.","- Прототип: молодой Дэйн ДеХаан (период «Хроники», «Место под соснами», около 2012–2014)."]},"stats":{},"tracks":[],"photo":"images/sunny.jpg","archived":false},{"id":"takeda","name":"Такеда Нишимура","aka":["Takeda Nishimura","Таки","Горо Хартман — второе имя","Демон","Волк"],"age":["37 лет"],"role":["Гость"],"orient":["Би. Верх."],"tags":["THE BASE"],"player":{"name":"Takeda Nishimura","url":"https://vk.ru/id607210846"},"date":"28 июл в 23:46","epigraph":null,"sections":{"character":["-Характер сложный, многогранный и крайне тяжёлый, может впадать в состояние \"на грани \".","Первая крайность - интроверт, закрытый малообщительный тип, всегда себе на уме. Мстителен и крайне жесток, часто ставит психологические эксперименты над людьми без их ведома, помешан на философии и внутренних состояниях","Вторая крайность раскрывается как правило во время самого процесса экспериментов над толпой. Обладатель отменного чёрного юмора, местами очарователен, создаёт впечатление своего в доску чувака, принимающего решения ( обманчиво внезапно ), готового на всякие авантюры в одиночку и не только ,создавая впечатление отвязного чувака без чувства меры. Может впадать в крайности внезапно, от ёбнутого на голову расчётливого  психопата, до вдумчивого дипломата, который может договориться с любым человеком. Смены настроения резки и непредсказуемы, никогда не знаешь что ожидать в следующий момент ,но не стоит заблуждаться насчёт его хаотичных приходов, на самом деле у него всё продумано до мелочей.  Упорядоченный хаос, строго контролируется расчетливым умом, единственным   исключением бывают ситуации где он просто отрывается заставляя своих врагов гадать очередная ли это попойка или чётко спланированный ход не в их пользу. Любитель много и хорошо выпить закинуться таблетками и разной дурью при этом дымя как паровоз. .Очень внимателен к людям, но лишь для своих целей. Шуток не понимает, хотя хорошо чувствует настроение и состояние людей. Ненавидит бесхребетных особей без своего чёткого мнения и видения ситуации. Легко видит ложь и притворство в свою сторону делая вид что не понимает этого. Часто говорит загадками, что хрен разберешь, и вообще сложно понять  шутит он или нет. Вся суть общения с окружающими исключительно для собственного кайфа или решения конкретной задачи. Никакой пустой болтовни, обсуждение или осуждение других за их поступки, по его мнению, каждый делает то, что считает нужным в данный момент поэтому несёт ответственность за свои слова. Именно ситуация определяет, как и что будет сказано в зависимости от задачи на данный момент. А задачи демон ставит себе отнюдь не простые, где порой все способы хороши, но есть нюанс.. Его \"игры\" имеют настолько широкий и кровавый масштаб , что порой  приходится залечь на дно, пережидая последствия пиздеца, который сам же и устроил. В комфортных для себя условиях , как правило, добродушен и щедр. Презирает мелочных, без дела язвительных личностей, если за этим не стоит какая-либо игра, а лишь жалкое желание показать своё никчёмное э
