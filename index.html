 врачей. Операция по разделению прошла в Нью-Йорке, спустя четыре года. Однако, только одного из двух мальчиков забрали обратно во Францию, и им стал Астор. Брата усыновила другая семья, в Нью-Йорке.","Детство в любви и уважении, но никогда не баловали. К сожалению из-за выбора содержать только одного мальчика, Венсан ушёл из семьи. Отчим появился, конечно, но не сразу. Тоже известный, то не столь прославленного рода, как Колетт. Зато к нему ходили всегда за советом.","То, что он пойдёт по их стопам, было ожидаемо. Причём Готье не наседали с притягиванием мнения, он сам интересовался. Наблюдал часами за их работой после уроков или спрашивал, а почему плачут те тёти и дяди. Частые сеансы с ребенком переросли в новые знания. Со временем и сам догадывался, когда просил читать определенные книги из списка запрещенных. Выбор профессии, учеба, практика и наконец работа — классика жанра.","Во времена учёбы, когда искусство тянуло больше и больше, а ещё хотелось путешествовать, судьба решила сделать приятное. Поблагодарить за терпение. Улицы Марселя, пропахнутые лавандой и выпечкой. В тот миг, с фотоаппаратом в руках и кольцом теплым на пальце... Один взгляд и просьба : \"а можно вас сфотографировать?\" Кажется, не стоило смотреть через объектив и линзу. Мужчина, немного старше самого Астора, но сумевшего зацепить своим видом. Да, молодость все прощает, первые шаги в общении тоже показывают неумелость. И как согласились на съёмку...","Это лето, где произошел первый обмен контактами и началось общение. Последующий год до нового приезда мальчишка спрашивал, узнавал, а как живется в Америке, местами предлагал показать самые необычные места во Франции. Но каждый день - новое узнавание человека. Какого черта никто не дал наставления, что первые шаги будут такими опасными? Так стыдно, но он сблизился с Киллианом, до желания обнимать и чувствовать чужой запах. Так засыпать приятно. Подарок, скромное кольцо, сколоченное его собственными руками в качестве поддержки и оберега. И даже не несёт зла. Вместе с фотокарточкой, когда Моро снял мужчину в первый раз.","Первая влюбленность и она последняя. Общение поддерживали ещё долгое время, но и то сошло на нет. Первые волны волнения, потом осознание, что не стоило, и разговор с отчимом, где немного, но голова остыла, а чтобы окончательно забыть, погрузился в практику своей собственной профессии. Возможно, что именно это предательство сыграло злую шутку, из-за чего Моро полностью очерствел.","Переезд из Марселя в Нью-Йорк стал может чуточку спонтанным, но правильным решением для самого взрослого парня. Там больше знаний, больше возможностей. С лицензией и корочкой на все сложенные куски пазла. Сумел собрать крупицы, чтобы в новом месте стать полностью отстраненным. Последние почти 20 лет Астор посвятил только себе, только практике, только клинике. Заработав громкое имя, тот иногда решался помогать полиции, но оказаться в мафиозных кругах… Хорошо иметь своего специалиста, способного надавить на старые мозоли. Это и стало новым витком судьбы, раз один клан решился забрать такого мастера к себе под крыло.","Это что, кража? Торговля людьми?"],"ability":["физические и/ умственные способности вашего персонажа [ проверяется ]","выносливость есть, так как в путешествиях поднимается всегда на верхушки гор;","маньяк на записи, ведет дневник даже когда просто общается;","за счет мышечной памяти развита умственная, до фотографической;","умеет заговаривать зубы, переводя разговор в нужное для него русло;","Из-за собственных амбиций способен привить чужому организму определенные болезни, в которые после будут верить;","говорит свободно на французском и английском;","взял в привычку каждое утро употреблять только черный кофе."],"weaknesses":["стеническое тело, но к сожалению никого физически подготовленного завалить или вырубить;","аллергия на цитрусовые;","прихрамывает на правую ногу в особо дождливую погоду (травма, о которой не расскажет)."],"hobby":["фотографировать места, ставшие чем-то большим, чем обычные красоты;","от матери привил к себе любовь к искусству, но зарисовки делает только перьевой ручкой;","под каждого пациента свой образ и исторический прототип, но не показывает это знание;","с цветами дружит, но только сухостоями."],"features":["он был в отношениях, и теперь о них вспоминать не желает;","увы, но курит, крепко и часто;","остальные будут открываться постепенно, так как требуется время."],"appearance":["мужчина ростом под 197 см, с редкой сединой в уложенных волосах. В глазах читается усталость от бренного мира, без искр. Предпочитает костюмы, ежели что-то свободное. Свой стиль, свой вкус. И виноградная или вишневая жвачка.","Мадс Миккельсен."]},"stats":{"Сила":2,"Ловкость":3,"Интеллект":6,"Харизма":4,"Восприятие":5},"tracks":["Prequel — Falling In Reverse","Ameno — Era","GODMOTHER (feat. Eden Ben Zaken) — Noga Erez Eden Ben Zaken","Villain's love letter — The Villain Music","Негативное мышление — Три дня дождя feat. pyrokinesis","Burn Your Village — Kiki Rockwell","Яд — Эрика Лундмоен","Все только началось — Bones Of Grace"],"photo":"images/astor-moreau.jpg","archived":false},{"id":"bailu","name":"Бай Лу Вэнг","aka":["Bai Lu Wang","Химера"],"age":["26 лет"],"role":["наемный убийца","эксперимент под присмотром the LAB"],"orient":["асексуал"],"tags":["TARGET ELIMINATION"],"player":{"name":"'stockholm 'syndrome","url":"https://vk.ru/syndromesonar"},"date":"28 июн в 18:27","epigraph":null,"sections":{"character":["Её можно принять в первой встрече за ту самую бездушную куклу, не способную проявить ни одной позитивной эмоции. Работа, стремление быть под контролем, в руках сильных. « Назови ее глухонемой, и получишь лишь усмешку. Но бойся, когда та раскрывает оружие... » Бай Лу можно воспринимать именно как не слышащую, у которой нет языка до тех пор, пока не потребуется что-то сказать. Молчаливая на постоянстве, принимая в этом позицию, что излишняя болтливость — трата ресурсов. В основном та привыкла слушать, запоминая что-то новое. Именно этот навык в будущем будет позволять находить революционеров и подавлять многие бунты в системе, помимо охоты.","Интроверт. Не любит совершенно шумные места, в толпе людей, отдавая предпочтения больше обществу спокойных людей. Если выпадала возможность, то использовала время с умом: изучает дальше способы убийств, делая успехи, или же в чтении. Знание — сила. Даже по сей день просит что-то читать, запертая в стенах.","В ситуациях на деле прежде всего думает над ходом, а потом делает. Можете отдать приказ, объясняя тем, что сейчас лучше прислушаться к словам, иначе будет плохо, и Химера остановится. Любое отклонение от правильного и устава — и бросится на жертву. И бьет на поражение, за что не каждому нравится. Его рассудительность и преданность иногда переходят границы…","Иногда эмоции злости могут проскальзывать в химере. Она, вернувшись в стены клана, может поддаться плохому, взорваться и избить даже стену. Если долгое время накапливать, без выплеска, то начинает ломаться подсознание. И Бай Лу частично сходит с ума, хотя и скрывает эту черту. Может в порыве гнева разбить хрупкое, а потом же сам страдать. Что она не любит в людях, так это ложь. Даже если во благо. Она не понимает того, как можно лгать человеку прямо в лицо, но с участниками клана это далеко не так. В них девушка не видит той лжи, а она явно присутствует. Умеет любить, но как кого-то близкого. С отношениями тяжелее, потому что такого чувства та никогда не знала. Соответственно, очень многое под запретами лично ее самой."],"biography":["Родилась в Осаке, долгое время прожила в своей семье. Отец занимал пост главы клана, так что воспитание проходило в традициях и культуре. Только учили маленькую не только в школе, как подобает, но ещё и самообороне. Любовь к арбалету как раз уже с тех времен.","Переезд в Нью-Йорк стал делом времени. Наверное самый первый повод во всем этом — её желание как медика. Знания в Японии оказались малой частью, пришлось менять место жилья. Второй повод, отцовское слово. Он хотел, чтобы дочь уехала, но случилось это в момент перестрелки. Семью убили почти на глазах уже подросшей Бай Лу, которую насильно посадили в машину и уже увозили в аэропорт. С тех самых пор она не показывала открыто позитивные эмоции.","Среди убийц в клане оказалась после института. Сперва это работа в лаборатории, а потом уже собственная среда, без начальников и контроля. Ночами создавала новое, но щадя зверей и людей, вводила препараты себя. Это скорее была опора по борьбе с различными болезнями, к чему лекарства ещё не нашли, а у Бай Лу это реакция на лекарственные средства у людей с редкой группой крови, чтобы минимизировать переливания и поиски доноров. (Только часть лекарств оказались наркотиками, а она не знала об этом) По улицам в дневное время она ходила, осторожничала чаще всего, поправляя рукава рубашек, дабы скрыть следы от инъекций. Наверное момент беспамятства и случайной вспышки агрессии привело к тому, что за девушкой выехали службы.","Случай, когда из-за подобной реакции, драки и кровавых соплей без повреждений, почти в двадцать четыре года. Наверняка её коллеги заметили за работой, шепнули, кому надо, и вот не убили. А может чужой интерес захотел проверить. Отсрочка от решетки, ибо сумели успешно спрятаться. Отплатили может монетой кровавой, лишив девчонки руки. Точнее расскажут, что некроз тканей не повернуть назад, а безумие хотелось сохранить… Так появился протез, завязанный на сухожилиях и нервных окончаний. Вместо нормальной кисти руки – длинные пальцы лезвия, которыми она и могла убивать. Сперва это были мелкие заказы, а дальше только сильнее и сильнее. Правду говорят: серийные убийцы - заядлые наркоманы. Им нужно еще и еще.","Оказаться на территории клана – просто дело времени."],"ability":["Создавала лекарства, изучала на себе, вырабатывая иммунитет. Сейчас это отразилось на выживаемости и устойчивости перед наркотиками.","Развита наблюдательность.","Аналитический склад ума.","Может удерживать в памяти очень много информации.","Может долгое время смотреть в одну точку, в одну цель на расстоянии, не сближаясь. Подобно фарфоровой кукле.","Скорость чтения превышает понимание. Книгу в среднем на 500 страниц может прочесть за пару часов.","От отца переняла особое пристрастие к языкам: в идеале разговаривает на английском, дополнительно изучала латынь.","Гибкая, ловкая, больше напоминает змею в атаках.","Хорошо синергирует с протезом, атакует всегда этой рукой."],"weaknesses":["Из-за протезирования в местах соединения может коротить и кровоточить, порой специально, потому что Бай Лу способна в моменте ярости зацепить и там.","аллергия на строительную пыль и хлорсодержащие средства (в основном это хлорка для дезинфекции) . В первом случае дышать становится труднее, требуется очистка воздуха и как минимум вентиляция лёгких. Во втором кожа покрывается пятнами, может повышаться температура при высоких концентрациях или долгом нахождении с аллергеном.","Говорит мало, с хрипотой и зажеванностью в словах из-за повреждения связок. Они были травмированы в моменте, когда её поймали.","Чувствительный слух. все, что имеет высокие децибелы и даже простому человеку неприятные звуки по типу скрежета, для Химеры это мучительно. Чем выше, тем болезненнее. Она сдавливает голову, кричит подобно баньши.","Её реакция на лечение и препараты, конечно же, показывают хорошие результаты, но если не следить, то случаются приступы и отказ организма от медикаментов.","Проигрывает огнестрельному и холодному оружию в ближнем бою. Потому старается наносить резкие удары в момент сокращения дистанции и тут же увеличение оной. Потому лучше с ней быть сопровождению."],"hobby":["Мечтает освоить скрипку, но пока только лишь начала обучение. Инструмент помогает держать ту концентрацию, которая необходима при исследовании и введении новых препаратов.","Чтение книг, чтобы не терять концентрацию и сохранять разум холодной."],"features":["Она — машина для сохранения статуса клана в лице исполняющих долг. В этом есть своя изюминка, хотя в её поведении избиение до смерти двух сбежавших повергло многих в ужас и прибавило работы у медицинской стороны.","Химера - мифологическое чудовище с частями тел разных животных. В случае с Бай Лу это появления вместо одной руки протеза с длинными когтями, саму руку ей отрезали специально, но об этом ей не говорили."],"appearance":["Девушка с длинными темными, ближе даже к черному волосами. Карие глаза, которые иногда темнеют и блестят безумством.","Ростом 175 см. Худой комплекции, но ответить сумеет. Тем более маневренность повышается.","По телу множество растяжек и шрамов, самый яркий вдоль позвоночника.","Уже из досье известно, что протез правой руки. Его она скрывает под тканями китайских халатов — ханьфу.","Mable Siriwalee (доп.визуал), Rina Sawayama (осн.визуал для медиа-контента!!!), voice — SKYND","Да, изучено."]},"stats":{"Сила":7,"Ловкость":5,"Интеллект":5,"Харизма":2,"Восприятие":3},"tracks":["Волей моею — Sacrothorn feat. Marie Steiner","птицы — Варвара Рубановская feat. Super Collection Orchestra","Начало — Готэм","Heavens Gate — SKYND","Вопросы — Дельфин","Zalım — Ceylan Ertem","小红舞鞋 — DOUDOU","Craving — YMIR","Черные змеи (OST Канашибари) — ЙОКО","Portrait — Unprocessed","В первый раз (Из сериала more.tv «Фишер») — Shortparis","Johnny Kitagawa — SKYND"],"photo":"images/bailu.jpg","archived":false},{"id":"beslan","name":"Беслан Каган","aka":["Beslan Kagan","Цыган"],"tags":["TARGET ELIMINATION"],"age":["38 лет | ниче не старый, в самом расцвете сил!"],"role":["Таргет: оперативник “Шан”. Лаба: санитар."],"orient":["Натурал конечно же! Ладно, под крышей Аллах не видит, может и гетерогибкий."],"player":{"name":"Шило Фикс","url":"https://vk.ru/leka_tur"},"date":"18 авг в 19:29","epigraph":null,"sections":{"character":["В трех словах: супершумный, суперактивный, максимально-эмоциональный тип, которого практически невозможно остановить на пути к делам (по своему моральному кодексу) правым. Равно как и к ломанию дров.","Специфика психики Беслана такова: чем больше ударов судьбы он получает, тем сильнее становится. Ему чуждо само отчаяние, горечь и сожаления; он способен испытывать скорбь, но никогда не позволит ей затмить себе рассудок.","Ни к чему не привязывается слишком сильно, и не имеет никаких особых мирских ценностей или пристрастий, какие могли бы его завлечь.","Финансовый бездарь, горе цыганского семейства: как и положено, деньги не задерживаются, но и не “работают”, просто исчезают.","Наглый, бестактный. Он не видит ничего плохого в том, чтобы одолжить то, что плохо лежит; чтобы начать с кем-то жрать из его же тарелки или порыться в чем-то личном. Он не вор, просто настырный, плутоватый и достаточно бескомпромиссный.","В обратную сторону это тоже работает: если кто-то украдет шмотки Кагана — он не огорчится; если попытается убить — не осудит, не запомнит и не будет вынашивать план мести. Во многом других людей он воспринимает через призму себя самого: «ну, если мне нормально, то и другим должно быть».","Оптимист больше, чем пессимист; отсюда — непотопляемый и упертый. Нет драк, которые нельзя выиграть; нет безвыходных ситуаций; нет непобедимых. Он не боится смерти, но борется с ней до конца.","Беслан ставит себе утопические, зачастую невыполнимые цели, потому что стремиться к чему-то выполнимому и \"среднему\" — скучно.","Приятный сам по себе друг и собеседник: не склонен к осуждению или предвзятому мнению, за исключением случаев, когда вопрос касается каких-то национально-религиозных убеждений.","Принцип действия личности — подача эмоций изнутри в пространство; Беслана много и он мозолит глаз своим присутствием, даже если ничего не делает, и еще раз: ГРОМКИЙ. Его слышно прямо хорошо в любой области слуховой досягаемости. И это совершенно не работает в обратную сторону: он не впитывает эмоции от окружающих, хотя плюс-минус на интуитивном уровне может их распознавать.","В личностных отношениях полагается на эмпатию и интуицию. Его восприятие эмоционального мира имеет вполне конкретную форму: “в глаза мне смотри”; “я с тобой от души говорю, и ты со мной душой говори”. Психологии, как явления, для Кагана не существует; знает, что что-то такое есть, но никогда не базирует на этом свои разговоры. Для него все чертоги внутри человека имеют конкретное определение: душа. Ты либо человек, либо шайтан.","По нему не скажешь, но вообще-то он человек четких принципов и… ну, как минимум самого плинтуса морали.","Высоко ценит дисциплинированность и способность держать ситуацию под контролем. Ненавидит неопределенность и плохо переносит всех этих игроков “двойное дно под двойным дном”: он прямой, как шпала, и врать не умеет, скрывать что-то физически тошно, так что пути куда-то вверх ему по умолчанию закрыты просто потому что он скорее вломится в двери, чем подложит пакет с дерьмом под них и подожжет.","Отдыхает, как никто; от жизни кайфует всегда по максимуму. Все, что можно - значит возьмет вдвойне; все, что нельзя - значит, найдет способ достать. Ни в жизни не притронется ни к какой химии и наркоте, а вот алкоголь - это за милую душу. Аллах не одобряет, но под крышей не видит.","Человек действия, потом уже мысли; привык сначала закрывать “собой” проблему, а уже потом разбираться, как именно ее решать.","Максимально ориентирован на “свои”/”чужие”: своим можно все, чужим - ничего. Ничего общего с законодательством, если что; если Беслан принял вас, как своего, он затерпит любую херню, которую вы выкинете, пока это не станет унижающим достоинство беспределом. Унижение свое/чужое/семьи - национальный маркер, что пора изгонять такого человека из своего “табора”.","Открытый и доверчивый. По умолчанию новое лицо для него в рамках выбранного окружения заслуживает хорошего отношения, а вот когда это лицо сделает подлость ему лично - так же стремительно, как попал в “свои”, попадет и в разряд “чужие”.","Ответственность - достоинство; гиперответственность - недостаток. Этот человек - патологически старший брат, отец и друг, и ваши проблемы он возьмет, как свои собственные. Расшибется в лепешку, но решит.","Не обязательно ищет драку, но практически не умеет пройти мимо ситуации, которую воспринимает как угрозу “отсутствия беспредела” рядом с собой. Тогда он действует резко и физически, не успевая оценить последствия. Масса, сила и напор превращаются в инструмент защиты, а собственная боль перестает быть достаточной причиной остановиться.","Жесткая внутренняя граница между насилием как средством чего-то добиться/отстоять/защитить и бессмысленной жестокостью. Беслан способен запугивать, давить, ударить, но только если у этого достойный, по его лекалам, мотив. Совесть у него очень громкая. Огромный, грубый мужик, который способен снести дверь или прижать человека к стене, на деле - человек, которого мучает вопрос, поступил ли он правильно. Даже когда он злится, ему важно оставаться человеком.","Мусульманин на “спустя рукава”; не то чтобы фанатично следует рамадану, - как и все цыгане, удобно адаптировал предписания под свою модель жизни и нашел способы иногда ими пренебрегать так, чтоб всевышний не разгневался. Нет, религия для него не пустой звук, просто сохранилась как силовой мотивационный инструмент только там, где они совпадают с видением Беслана."],"biography":["Родился в большой домской семье на юге Турции! Нет, вы не поняли: БОЛЬШОЙ. Не по меркам даже одной страны; цыгане под фамилией “Каган” и близких к ней через двое-трое рукопожатий, других фамилий и родственных связей, но все еще входящих в понятие “семья” людей, как паразиты раскинулись очень много где, и постоянно перемещаются с места на место. Дом для Беслана с детства был не столько конкретным местом, сколько совокупностью людей, которых он считал своими; куда приехал - там и дом; где ему улыбаются - там и дом.","Мусульмане, хотя сам Беслан, да и ближайшая его родня, не отличаются особой набожностью. Религия присутствовала в быту скорее как часть уклада: праздники, пост, похороны, молитвы старших, запреты и бесконечные суеверия. Вера - не столько набор строгих правил, сколько еще один способ помнить, кто ты и откуда пришел.","Что не удивительно для цыган, были небогаты. Более того, в семье постоянно находились причины, требовавшие денег: нужно помогать старшим, содержать младших, оплачивать лечение, жилье, перевозки и многочисленные мелкие долги, которые в большой семье никогда не исчезают окончательно. Что есть у Беслана? Сила, здоровье и способность делать работу, за которую другие не хотели браться. Значит, как добывать деньги? Своими основными лучшими качествами.","Как старший сын, - и кстати отмеченный отцом, а он между прочим баро, как будущий новый баро своего небольшого табора, - быстро впрягся в решение финансовой проблемы “мировой” семьи за свой счет.","Подростком начал заниматься борьбой. Сначала просто дрался на улице, потом попал в спортивную секцию, но профессиональным спортсменом становиться не собирался: слишком мало денег, слишком много ограничений и слишком долго нужно ждать результата.","Первый раз уехав из дома ради заработка, понял, что за границей его способности стоят дороже. Брал в основном работу, связанную с охраной, сопровождением грузов и людьми, которым требовалась физическая защита. Иногда - совершенно обычные подряды, иногда - ну чутка (или не чутка) с подковыркой к закону. Не особенно интересовался тем, насколько красивым является источник заработка; если задача была понятной, а деньги достаточными - он соглашался.","Постепенно это стало привычной ролью внутри семьи. Когда Каганам требовались деньги - Беслан уезжал; когда какой-то умирающей тетке в другой стране надо оплатить лечение или похороны - Беслан уезжал; когда одному из родственников нужно открыть дело, перебраться в другую страну, закрыть старый долг, громко отпраздновать свадьбу или поздравить с рождением свое чадо так, чтоб улица тряслась - Беслан снова уезжал.","Он не считал это жертвой. В его понимании все предельно просто: у каждого человека есть то, что он умеет делать лучше остальных. Кто-то умеет торговать, кто-то договариваться, кто-то растить детей, а Беслан умел драться, охранять и оставаться живым там, где другим становилось неуютно.","Чем больше денег требовалось семье, тем дальше он был готов ехать, а расстояние уже стало больше приколом и челленджем “переберись через границу без гражданства”, нежели препятствием. Турция, Балканы, Ближний Восток, Европа; работа есть, значит едем. Семья оставалась неизменной, а сам Беслан становился человеком, который постоянно находился где-то еще.","Мьянма - очередной такой выезд. Что-то там какая-то работенка по вооруженной охране, как раз подоспел местный конфликт; ну, на пороховой бочке он жить уже привык и даже свой какой-то кайф от этого получал. Как-то так Беслан и оказался рядом с вооруженными группами рохинджа.","Они были чужими в собственной стране, опирались на религию и старших, помнили тех, кто был до них. И прежде всего - цеплялись за своих, потому что больше цепляться было не за что.","Не то чтобы Каган прямо проникся их идеологией и стал каким-то фанатиком, он вообще какие-то еще колокольни помимо собственной с трудом переваривает, но человечески ему было проще понять этих людей, чем большинство тех, с кем он сталкивался раньше.","Накосепорил. Кому-то тут нужны драматические подробности дельца, которое Беслан считает своим провалом? Вкратце: надо было людей вывести из опасной зоны, но одной жопой на все фронта не порвешься, сколько бы силы и выносливости в тебе ни было. Он просто столкнулся с ситуацией, которую нельзя было победить даже при недюжинном упорстве.","Что-то там в его голове после этого щелкнуло. Беслан продолжал жить так же: смеялся, пил, дрался, ругался, ел слишком острое и продолжал делать вид, будто его ничего не волнует. Он даже не стал более мрачным человеком.","Просто раньше он спрашивал: “ну че, где теперь устроить шторм?”, а теперь к этому добавился еще и неприятно-гнойный вопросик: “а зачем?”.","Деньги больше не казались достаточной причиной.","Семейный долг, ради которого он ездил по миру, постепенно перестал ощущаться прям таким уж фундаментальным и единственным смыслом. Беслан по-прежнему любил Каганов, по-прежнему был готов за них убить и умереть, но как будто понял, что всю свою жизнь прожил как человек, который постоянно куда-то идет, и совершенно не знает, куда именно.","Где-то на этом отрезке жизненного пути они пересеклись с Арчи.","Оставим тут место для неизвестного акта жизни, сделавшего Кагана более чем преданным новому делу и закинувшего его в оперативники “шан”, просто знайте, что такое каким-то образом и когда-то было.","А теперь там, где он есть, его приякорило к земле понимание: это не очередная поездка куда-то, а вполне весомая причина остаться."],"ability":["Самое очевидное, это сила. И в принципе телосложение. Беслан раскачался более чем хорошо; он выносливый, мощный, у него высокий болевой порог, большой интервал переносимости боли.","За плечами большой боевой опыт, и все - либо врукопашную, либо подручными средствами. Эти ваши ножи и пушки он не слишком приветствует, не по-людски это. Умеет, но не хочет. Может, когда совсем припрет.","Неутомимо-энергичный. Ишачить может за троих, и еще сверху успеет.","Умственно… ВЗДЫХАЕМ. Быть может не самый эрудированный (он тупой в рамках таборного воспитания и не особо высокого интереса к изучению чего-то “извне”, будьте готовы к этому), но достаточно смышленый и легко приспосабливаемый. У него живая смекалка и быстрая адаптивность; он очень хороший тактик, но провисает, как стратег, потому что за последствия не думает, и на два шага вперед - тем более. Живет в моменте."],"weaknesses":["Самый животрепещущий страх, какой у Беслана привился - это огорчение матушки. Никогда от нее звонков не пропускает, и все для нее у Кагана всегда хорошо; почтенная старая женщина, у ней сердце не выдержит, если у него что-то будет плохо.","Туда же следующий семейно-национальный давящий момент: унижение семьи. Ничего Беслан такого не сделает, что унизило бы его семью, кровную или избранную по названию; если и сделает, то неосознанно и потом от стыда провалится сквозь землю. С оглядкой на такой мотиватор почти все решительные действия и принимает.","Абсолютно не может находиться в одиночестве, без общества и без людей рядом; не то чтобы это превращается в какой-то психоз, но изоляция в долгосрочной перспективе может его сломать.","Страх не успеть, ошибиться, оказаться бесполезным, сделать НЕДОСТАТОЧНО, - во многом управляют его решениями и действиями.","Боязнь стоматолога. Не потому что трус, а потому что стоматолог - это человек, которому он добровольно отдает голову и разрешает ковыряться во рту инструментами. Для мужика, привыкшего контролировать ситуацию, это чет как-то стремно. Не рассказывайте ему про проктологов.","“СЛЕГКА” нестабилен в вопросах контроля собственного гнева. Просто… имейте ввиду: если ВДРУГ его удастся разозлить, последствия могут быть чудовищными.","Хреновый актер, врать не умеет. У Беслана высокая эмоциональность, легко читающаяся в нем всем, от мимики до жестикуляции.","Привычка расплачиваться за ошибки - физикой. Он относится к телу как к расходному материалу по личным соображениям: все ошибки должно помнить тело, а не башка; Беслан способен продолжать действовать тогда, когда разумный человек уже бы слег на лечение.","Импульсивность."],"hobby":["СПОРТИК с самой большой буквы. Не знаешь, что делать? Отжимайся. Нечего ответить? Иди на турнике повиси. Для него это способ прочистить голову от любого перегружающего шума.","Готовит убойно! Во всех смыслах, кроме буквального; Каган привычен готовить на табор, так что и порции ваяет огромные, и все, в лучших традициях, вкусно. Правда, зачастую это “вкусно” чисто на его оценку: он никогда специй не жалеет, если уж остро - то до изжоги!"],"features":["Человек всего мира: домари-цыган, они же “кавказские цыгане”: смесь армян и турков. По сути в Турции и родился, но нигде у него Родины на самом деле нет, а семья есть повсюду.","Успел породниться с рохинджа, они ни разу не цыгане, но их так классифицируют. Значит свои! Да и вообще типы ровные, какие к ним предъявы?","У него нет гражданства. Никакого.","Свое понятие справедливости: \"правильно/неправильно\" не всегда совпадает с законом, куда важнее, кто прав \"по-человечески\" и кто кому должен.","Кинестетик. Легко вторгается в личное пространство с тактильными поползновениями. Нет, вы не поняли! Это кинестетик из ТУРЦИИ, там совсем другой уровень физического взаимодействия.","Слегка суеверный. Не прям до шизы, но чисто на уровне культурного кода некоторые вещи может не говорить и матушкой не клянется.","ЖРЕТ ЗА ТРОИХ + тестостероновая бомба."],"appearance":["198 | 110","Почти двухметровый здоровый мужлан с хорошим рабочим загаром. Или это слой грязи? Черт разберет. Черные глаза, выдающийся горбатый нос, длинные черные волосы. Все естество выдает в нем цыгана: внешние черты характерны для южанина, да и акцент, и повадки. Испещрен и шрамами, и татуировками; тату старые, а вот шрамы совсем свежие. Подтянутый, жилистый; в меру, чтобы сохранить маневренность, и в то же время достаточно, чтобы гнуть руками подковы.","Seth Rollins"]},"stats":{"Интеллект":2,"Сила":8,"Ловкость":5,"Восприятие":3,"Харизма":3},"tracks":[],"photo":"images/beslan.jpg","archived":false},{"id":"boris-vlasov","name":"Борис Власов","aka":["Власов Борис Анатольевич","Vlasov Boris Anatolyevich","Севас"],"tags":["TARGET ELIMINATION"],"age":["37 лет."],"role":["Оперативник «Шан» | Инженер-оруженик."],"orient":["Гетеро"],"player":{"name":"Кирилл Кузьменко","url":"https://vk.ru/demon_of_greed"},"date":"1 окт в 23:22","epigraph":null,"sections":{"character":["Борис – харизматичный мужчина, которого не сломала война. Он компанейский и умный человек, который легко вливается в компанию, умеет поговорить по душам и не скрывает своих мыслей. Оружейник не привык слишком юлить, если только это не для дела, он может прикрыть товарища перед начальством, случайно «списать» рабочий глушитель вместе с хламом, который потом странным образом появится на автомате бойца, который по глупости его потерял или сломал на задании. Но Борис никогда не подставит в действительно важных моментах, так как его мелкий обман направлен только для прикрытия товарищей. Сам же по себе мужчина весьма прямолинеен, в диалоге и не говорит ничего лишнего, даже чтобы «сгладить» углы. Борис не привык прислуживать, он служил в обстановке взаимного уважения даже среди командиров и рядовых, а потому, когда кто-то пытается показать перед ним свой «авторитет» за счет унижение бойцов или его самого, он не станет молча слушать брань.","В работе механик особенно сосредоточен: в такие моменты сходить в эротическое пешее у него могут как сослуживцы, так и командир, если тот будет ему мешать заполнять капсулы стилетов или настраивать оптику новой винтовки.","На заданиях он сконцентрирован не меньше, чем на работе в мирное время, профессиональная дисциплина и четкое следование приказам для него залог выживания, но даже там, если группе ничего не угрожает, но может выдать какую-то шутку, а через секунду уже выслеживать цель, которая показалась на горизонте."],"biography":["Борис родился в Севастополе, в семье офицера ракетных войск и швеи. От отца ему досталась любовь к армии, особенно сильно мальчишка ценил различное оружие. С 8-ми лет Борис начала собирать свою личную коллекцию ножей, а по выходным ходил с отцом в тир или в часть, если отца вызывали на построения.","Его профессиональная карьера началась с момента, когда его не взяли в армию в 18 лет, в связи с плоскостопием. Погоревав полгода, Борис начал работать и по ходу дела тренироваться, дабы не потерять форму, и, когда ему исполнилось 22, он уволился с работы и уехал из дома, дабы вступить в местный ЧВК.","Следующие 8 лет он участвовал в различных конфликтах, первые годы службы он посещал разные небольшие конфликты, где он наконец вкусил что такое боевые действия и познакомился со многими специалистами по оружию. Именно тогда он уже пробовал модифицировать свое вооружение и вооружение товарищей, используя трофейное оружие и иногда проводя полевой ремонт. Тогда же он познакомился с Павлом Град, он тоже тогда был ещё рядовым, а познакомились они ближе в одном из окопов, когда Борис починил автомат Паши.","Следующей его точкой стала Сирия (2015-2017), куда он уже поехал полноценным специалистом по оружию. Зарекомендовав там себя как надёжный эксперт, который в полях помогал ремонтировать технику, участвовал при закупке оружия для ЧВК и активно воевал.","Последним его делом стала компания в Африке (2018-2019), где он вместе с группой охранял рудники. Тогда же он поймал себя на мысли, что с него пока-что хватит убийств, чем он поделился с Пашей, который предложил ему написать рапорта на окончание службы и поехать к нему в Пустобес. В том же году, по возвращении в Крым, он закончил службу. Купил родителям и себе по квартире, отдал матери часть заработка и уехал с другом в Пустобес.","Уже там они оба влились в криминал с головой, но не желая участвовать в разборках, Борис вступил в другую нейтральную группировку, которая занималась автомобилями и оружием. Имея за спиной знакомства, он частенько общался с бывшими сослуживцами и знакомыми и Америки, Ростова, Казахстана, Турции и Украины, он за два года сумел закрепиться как опытный оружейник, который способен достать комплектующие откуда угодно, были бы только деньги.","Паше же он заказывал оружие отдельно, да и частенько продавал оружие от своей группировки подешевле, по дружбе, прикрывая свои махинации.","В 32 года Павел женился на Марте, девушке, которую Борис шутливо называл своей невесткой, так как с Павлом они были практически братьями. Но счастье пары не было долгим и в тот же год кто-то пристрелил Град. Мужчина всеми силами поддерживал Марту, особенно когда она встала во главе банды вместо мужа, пообещав снова взять в руки оружие, если потребуется.","Спустя 5 лет, когда Марта уехала в Монако, Борис вскоре оказался под прицелом: кто-то узнал о его махинациях на заводе и его решили убрать. В тот же день мужчина пришел к брату женщины, дабы тот помог Борису бежать из страны. Бежать мужчина решил в то же Монако, надеясь, что невестка сумеет ему помочь подыскать местечко, где его умения и связи оценят."],"ability":["Борис – профессиональный стрелок, уверенно работающий из штурмового оружия на дистанции до 400 метров, способный при необходимости вести огонь из снайперского оружия до 600 метров и эффективно действующий в ближнем бою с ножом и в рукопашной.","Как оружейник-механик он диагностирует неисправности по звуку и отдаче за секунды, восстанавливает любое стрелковое оружие в полевых условиях из подручных материалов, модернизирует стволы под конкретного бойца, изготавливает глушители и настраивает баллистику, знает устройство всех основных образцов постсоветского и натовского вооружения. Обладает тактическим мышлением, мгновенно читает местность, способен действовать самостоятельно в критических ситуациях и импровизировать на ходу.","Владеет русским, украинским (разговорный), английским (технический) и базовым французским.","Имеет отлаженные логистические каналы по России, Украине, Казахстану, Турции, США и Африке, разбирается в ценах на оружие и качестве комплектующих, постоянно мониторит рынок новинок и всегда в курсе технического оснащения передового вооружения пехоты."],"weaknesses":["Плоскостопие 3 степень. Не позволяет ему долго и эффективно бегать, обычно ноги болят уже после 2-х км бега трусцой, решает эту проблему особой обувью и стельками, что в целом позволяют ему эффективно выполнять задачи. Слишком зависим от своей обуви.","Не знает меры в алкоголе. Если есть возможность выпить, будет пить до состояния овоща, если позволит объем.","Глубокая привязанность к Марте. Жена его покойного друга ему важна не меньше, чем Паша, он воспринимает её как сестру, которой у него никогда не было."],"hobby":["Листать новости о новом вооружении. Для него это такое-же обыденное и успокаивающее дело, как для многих чтение газет по утрам.","Стрельба. Постоянная практика с оружием для него уже не только способ улучшить навыки, но и возможность расслабиться и привести мысли в порядок.","Игра на гитаре. Самоучка, который любил сыграть что-то от скуки по вечерам."],"features":["Борис курит лишь самокрутки","Он довольно внимателен к окружению, машинально запоминает звук и темп шагов окружающих его людей, отчего заранее понимает кто к нему подходит со спины или за дверью.","На его шее, помимо жетона висит так же патрон, который он никогда не снимает.","Помимо небольших шрамов по телу, от осколков, на его левой стороне, под рёбрами, красуется особенно большой шрам от близкого взрыва гранаты.","По боли или покалыванию шрама он может предсказывать погоду.","Пьет только чай, считая, что кофе только для штабных и гражданских.","Способен с большой точностью определять оружие по звуку выстрела.","Страсть как любит апельсины."],"appearance":["Рост: 195 см | Вес: 98 кг. Высокий, жилистый, с широкими плечами и длинными руками. Мускулатура сухая, накачанная годами работы с железом и оружием. Коротко стриженые волосы. Серые глаза с цепким, внимательны взглядом. На левом плече красуется татуировка в виде якоря с надписью «Севастополь». Походка чуть перекатистая, широкая. В повседневности носит простую, удобную одежду: тёмная куртка, свободные джинсы, высокие ботинки с жёсткой подошвой.","Прототип: Павел Чинарёв."]},"stats":{"Сила":4,"Ловкость":7,"Интеллект":3,"Харизма":2,"Восприятие":4},"tracks":[],"photo":"images/boris-vlasov.jpg","archived":false},{"id":"brock","name":"Брок Рамлоу","aka":["Brock Rumlow"],"age":["50 лет"],"role":["Телохранитель Консула Hortusa - Коннора Блейка Харлоу."],"orient":["Гомосексуал."],"tags":["TARGET ELIMINATION"],"player":{"name":"Брок Рамлоу","url":"https://vk.ru/brock_ramlow"},"date":"9 июл в 18:25","epigraph":null,"sections":{"character":["Характер Брока это смесь холодного расчета, харизмы и хорошо подвешенного языка. На легкими ухмылками, скрывается человек который любит издеваться над людьми. Быть их тенью, ставить их врасплох своими действиями. И убирать если встают на его пути. Тихо или кроваво, тут уже как карта ляжет. Отличается любовью отдавать приказы."],"biography":["Родился в Америке, в семье итальянца сбежавшего из Италии. Мать с отцом умерли когда парню было 13 и его усыновил родственник военный. В 16 Брока отправили в Военную академию США. Которую он закончил с отличием. После чего поступив в армию, он начал медленно но верно идти по карьерной лестнице. Показывая свой колючий, кусачий характер.","В 28 лет его заметили люди из закрытой провительственной организации. И пригласили на работу. Скрытые задания в разных точках мира, связи с теневым бизнесом... В который он ушел, после своей \"смерти\". Мафия платила больше, наемничеством зарабатывать оказалось интереснее. В клан пришел по"],"ability":["Хорошо развит физически, умеет стрелять и драться. Берет обоянием."],"weaknesses":["Много курит, пьет алкоголь и не пьянеет. Хорошо стреляет."],"hobby":["Любит собирать информацию, читать книги, изучать людей."],"appearance":["Рост 178, вес 78. Волосы у него жесткие черные с проседью. Прическа обычно андеркат, глаза обычно светло карие, практически желтые.","Прототип: Фрэнк Грилло."]},"stats":{"Сила":5,"Ловкость":4,"Интеллект":5,"Харизма":6,"Восприятие":2},"tracks":[],"photo":"images/brock.jpg","archived":false},{"id":"valentino-viento","name":"Валентино Виэнто","aka":["Valentino Viento"],"tags":[],"age":["25 лет"],"role":["механик OUTCAST","наёмником не является"],"orient":["бисексуален, больший уклон к мужчинам."],"player":{"name":"Valentino First","url":"https://vk.ru/not_saintt"},"date":"вчера в 2:56","epigraph":null,"sections":{"character":["Характер холодный во время работы и вспыльчивый вне её, весь темперамент сам по себе очень яркий, громкий, заметный везде, однако почти полностью лишён эмпатии."],"biography":["Биография отсутствует, нет прошлого, нет будущего, есть только настоящее, в котором надо выжить."],"ability":["Ближний бой на руках и с оружием (нож, кастет, бита, топор)","Владение огнестрельным оружием (пистолет, обрез, ружьё, винтовка, что используется крайне редко)","Самая разная работа с автомобилями и мотоциклами: от простой починки до тюнинга с установкой защиты, пуленепробиваемого стекла и прочего.","Знание международных языков: немецкий и китайский, в качестве давнего хобби - корейский (используется редко)","Хорошая реакция.","Вождение автомобиля и мотоцикла"],"weaknesses":["В бою предпочитает биту, однако её тяжело пронести или спрятать, в случае, когда для боя приходится использовать нож, атаки медленнее из-за непривычки.","Хорошо ориентируется на дороге, но в открытой местности (водоём, поле, степь, лес) шансы на выживание почти нулевые."],"hobby":["Разряжать и снаряжать магазин пистолета/автомата по несколько раз по кругу, такое занятие считает расслабляющим.","Активно развивает навыки боя с лёгким топором для нанесения фатальных ударов.","Стрелять - хорошо, стрелять тихо - идеально; осваивается со спортивным луком, пока только на неодушевлённых мишенях.","Копаться в любых автомобилях, запоминать их звуки и отличительные черты. Это помогает подбирать транспорт по ситуации (скорость, скрытность, степень защиты)"],"features":["Есть молодой, но очень говорливый попугай Сезе.","Никогда не ест с чужих рук, первое правило личной безопасности. По тем же соображениям не берёт любые предметы из чужих рук голыми руками, носит чёрные хлопковые перчатки.","Украшает себя не только металлом, но и татуировками, ими усыпано всё тело, включая спину, торс, руки и ноги. Исключение - лицо и шея.","Прикосновения - табу, настолько, что даже волосы ровняет сам, пускай и получается порой криво."],"appearance":["Рост 185 сантиметров, телосложения не крупного, но достаточного, чтобы защитить себя или носить тяжести. Волосы тёмные, как и глаза, а кожа контрастно светлая.","Прототип внешности: Николай Спесивцев"]},"stats":{"Сила":5,"Ловкость":6,"Харизма":4,"Восприятие":5},"tracks":[],"photo":"images/valentino-viento.jpg","archived":false},{"id":"walter-kron","name":"Вальтер Крон","aka":["Walter Kron","Кайзер","Крон","Kaiser"],"tags":[],"age":["60 годков","Дата рождения: 20 ноября 1965 года.","Визуальный возраст: около 60–63 лет."],"role":["Алхимик"],"orient":["Бисексуал, к романтическим отношениям относится довольно прохладно. Не считает ориентацию чем-то, что определяет личность человека, поэтому практически никогда не обсуждает собственную личную жизнь."],"player":{"name":"Безумный Король","url":"https://vk.ru/fox_leontius"},"date":"вчера в 0:03","epigraph":null,"sections":{"character":["Он производит впечатление человека холодного, собранного и практически невозмутимого. Редко повышает голос и предпочитает спокойный разговор даже в конфликтных ситуациях, ведь крики это пустая трата энергии которую можно было бы потратить на исследования. К людям относится настороженно, однако не испытывает необходимости постоянно демонстрировать своё превосходство. Обладает выраженным саркастическим чувством юмора и часто использует его в самых неподходящих ситуациях. А главной чертой его характера является болезненное любопытство: неизвестность интересует его значительно сильнее, чем возможные последствия её изучения. Он способен часами работать над одной задачей, забывая о сне, еде и времени, если считает её действительно важной.","При этом не является бездумным безумцем — напротив, он привык просчитывать возможные последствия своих действий и крайне не любит совершать ошибки. К чужим знаниям относится с уважением и способен признать собственную неправоту, если ему действительно предоставлены убедительные доказательства, а если нет, то не тратьте ни свое ни его время. Не терпит пустой бравады, некомпетентности и людей, которые используют научные термины исключительно для того, чтобы казаться умнее.","Ну, а в стрессовых ситуациях становится ещё спокойнее, чем обычно, из-за чего его реакция часто кажется окружающим пугающей. Он способен привязываться к людям, однако старается этого не показывать и предпочитает держать эмоциональную дистанцию, ведь это может помешать его исследованиям. Да и он не считает себя хорошим или плохим человеком — для него гораздо важнее то, что именно человек делает и зачем он это делает. Ведь поступки гораздо весомей слов, даже если ты какой-нибудь убийца."],"biography":["Вальтер Крон родился 20 ноября 1965 года в Гамбурге, Западная Германия, в семье врача и фармацевта.","Его отец работал хирургом, а мать занималась фармацевтическими исследованиями, поэтому интерес к медицине и естественным наукам появился у него ещё в детстве.","Он рос довольно спокойным ребёнком и большую часть свободного времени проводил за книгами, экспериментами и попытками разобраться в устройстве различных механизмов.","В школе особенно хорошо ему давались химия, физика, биология и математика. Учителя быстро заметили его привычку постоянно задавать дополнительные вопросы и ставить под сомнение объяснения, которые казались ему недостаточно полными.","В начале 1980-х годов он окончательно решил связать свою жизнь с химией. В 1984 году он поступил в Гамбургский университет, где начал изучать химию.","За годы обучения он постепенно сосредоточился на органической и медицинской химии, а позднее заинтересовался токсикологией и воздействием различных соединений на нервную систему. После окончания университета продолжил научную карьеру и несколько лет занимался исследованиями в области медицинской химии и фармакологии. В конце 1980-х — начале 1990-х годов он успел поработать в нескольких лабораториях Германии, постепенно приобретая репутацию специалиста, которому поручают наиболее сложные и нестандартные задачи. В 1990-е годы его интерес к токсикологии стал значительно сильнее. Всё больше занимал вопрос о том, насколько сильно может измениться воздействие вещества при небольшом изменении его структуры. Вместо того чтобы ограничиваться уже известными научными методиками, он постоянно искал новые подходы и экспериментальные решения. В 2000-е годы Крон получил доступ к закрытым исследовательским проектам, где его знания оказались востребованы значительно больше, чем в академической среде. Именно тогда он впервые столкнулся с миром, в котором научные исследования существовали не ради публикаций и научных премий, а ради конкретного результата. В одном из таких проектов он провёл ряд экспериментов, которые не были предусмотрены первоначальным протоколом. Произошедший после этого инцидент привёл к серьёзному расследованию и окончательно испортил его отношения с официальными научными структурами. Крон не был признан виновным в намеренном причинении вреда, однако после произошедшего его карьера в официальной академической среде фактически закончилась.","Следующие годы он провёл в частных и закрытых лабораториях, работая консультантом и специалистом по сложным химическим исследованиям. Постепенно Крон оказался всё дальше от официальной науки и всё ближе к теневой стороне исследовательского мира. Он успел поработать с людьми, для которых лаборатория была не университетом, а инструментом получения власти, денег и влияния. Именно тогда он научился не задавать лишних вопросов о заказчиках и тщательно отделять работу от личных отношений.","В Клан пришёл уже человеком шестидесяти лет, обладающим почти четырьмя десятилетиями профессионального опыта. Его привлекло не отсутствие правил, а возможность работать там, где результат ценится выше красивой научной репутации. Он не стремился получить высокую должность и не просил особого отношения. Он просто занимался тем что нравится.","До Клана несколько лет сотрудничал с закрытыми структурами и частными исследовательскими группами, среди которых были люди, связанные с криминальным миром. При этом официально членом какого-либо мафиозного клана он не являлся.","Этот опыт научил его главному правилу:","«Не спрашивай, зачем человеку нужен результат, если тебя наняли только для того, чтобы его получить»."],"ability":["Он сохраняет для своего возраста хорошую физическую форму: высокий, сухощавый и жилистый, обладает умеренной силой и хорошей координацией движений. Благодаря многолетней работе в лаборатории у него развита точность и мелкая моторика, поэтому он способен аккуратно работать даже в стрессовых условиях. Хоть он и достаточно вынослив и может долго сохранять концентрацию, однако продолжительные физические нагрузки переносит хуже, чем интеллектуальные. Скорость реакции и вижения у него средние, что закономерно связано с возрастом. Он владеет базовыми навыками самообороны и обращения с оружием, полученными за годы работы в закрытых структурах, но профессиональным бойцом не является и предпочитает избегать прямого физического столкновения. В бою его сильной стороной остаются хладнокровие, наблюдательность и способность быстро оценить ситуацию, а не физическая сила."],"weaknesses":["Возраст. Шестьдесят лет неизбежно сказываются на физической скорости, реакции и восстановлении после травм.","Физическая сила. В прямом столкновении с молодым и хорошо подготовленным противником Крон окажется в невыгодном положении.","Здоровье. После неудачного эксперимента ухудшилось обоняние и теперь какие-то запахи он чествует притупленно, а какие-то наоборот слишком ярко","Одержимость работой. Если задача действительно заинтересовала его, Крон способен забыть о времени, сне и собственном состоянии.","Чрезмерное любопытство. Иногда желание получить ответ оказывается сильнее здравого смысла.","Эмоциональная закрытость. Практически не умеет открыто говорить о собственных чувствах.","Недоверие. Ему трудно полностью довериться человеку, даже если тот доказал свою лояльность.","Самоуверенность. Огромный профессиональный опыт иногда заставляет его слишком сильно полагаться на собственные выводы.","Плохая работа под чужим руководством. Он способен уважать компетентного руководителя, но не терпит приказов, смысла которых не понимает.","Нарушенный режим сна. За десятилетия лабораторной работы организм привык к ночным сменам, из-за чего нормальный режим практически отсутствует."],"hobby":["коллекционирование старых научных книг;","виниловые пластинки и старый рок;","шахматы;","коллекционирование минералов и необычных образцов стекла;","ночные прогулки;","ведение личных записей;","чёрный кофе;","чтение исторической литературы о развитии науки и медицины."],"features":["Старые механические часы, которые он получил от отца на восемнадцатилетие, практически никогда не снимает.","Не пользуется парфюмом и предпочитает естественные запахи лаборатории.","Практически всегда пьёт чёрный кофе без сахара.","Может работать всю ночь, если заинтересован исследованием.","Не позволяет другим людям переставлять предметы на его рабочем столе.","Ведёт несколько личных записных книжек и никогда не расстаётся хотя бы с одной из них.","Любит давать проектам музыкальные названия: Prelude, Encore, Requiem и т. п.","Может несколько минут молча смотреть на реакцию или эксперимент, прежде чем произнести хоть слово.","Не любит электронные устройства без необходимости и предпочитает механические часы, бумажные записи и физические образцы.","Помнит имена большинства людей, с которыми работал за последние сорок лет.","Иногда намеренно использует старые научные термины, чтобы проверить, действительно ли собеседник понимает тему.","Не любит, когда его называют «стариком».","Знает 4 языка: Немецкий (родной), Английский (свободно), Французский (разговорный), Русский (хороший уровень владения, но говорит с акцентом)."],"appearance":["Мужчина шестидесяти лет, высокого роста, около 187 см. Телосложение сухое, жилистое, сохранившее заметную физическую крепость несмотря на возраст. У него светлые, местами поседевшие волосы, коротко подстриженные по бокам и более длинные сверху. Волосы часто выглядят слегка растрёпанными после многочасовой работы.","Лицо резкое, угловатое, с выраженными скулами, глубокими мимическими морщинами и высоким лбом. Возраст заметен, однако выглядит скорее суровым и опытным мужчиной, чем физически немощным пожилым человеком. На лице — короткая седая или светлая борода с усами. Взгляд тяжёлый, внимательный, немного изучающий. А на руках имеются небольшие следы старых порезов и ожогов, оставшиеся от многолетней работы.","В одежде предпочитает тёмную гамму: чёрные рубашки, жилеты, длинные пальто, тёмные брюки, но иногда может изменить себе и одеть что-то спортивное. Лабораторный халат носит только тогда, когда это действительно необходимо. В остальное время предпочитает выглядеть скорее как человек, который случайно оказался в лаборатории.","Прототип внешности.","Yes","Ловкость: 5 (ловкость рук и никакого мошенничества)"]},"stats":{"Сила":3,"Интеллект":8,"Харизма":4},"tracks":[],"photo":"images/walter-kron.jpg","archived":false},{"id":"walter","name":"Вальтер Харш","aka":["Walter Harsch","Немецкое прочтение, но по ошибке часто читают на английский манер как Уолтер, а фамилию как Хирш"],"age":["32 года."],"role":["Арт-директор премиального клуба HORTUS. Главный Селекционер."],"orient":["Асексуал, но с парафилией. Возбуждение вызывает насилие над человеком, но не сам человек. В сексуальную связь вступать брезгует."],"tags":["HORTUS"],"player":{"name":"Walter Harsch","url":"https://vk.ru/f_ck_you_biest"},"date":"4 июн в 11:58","epigraph":null,"sections":{"character":["— Улыбается? Значит добрый.","Вальтер дружелюбен в общении, улыбчив и доброжелателен. Такой стиль ведения дел с людьми он находит забавным. Одинаковое обращение к тем, кто ему интересен, и к тем, кто проверяет крепость его терпения. Улыбается, довольный результатами; улыбается, внутренне закипая; улыбается, иронизируя и принижая между строк. Для его перфекционизма это идеальная формула: контроль над собой становится фундаментом контроля над ситуацией. От и до.","Ему когда-то сказали: усмири свои порывы, направь в нужное русло, и ты превзойдёшь толпу. Харш запомнил. И направил на слабых и безвольных свой садизм, а вместе с ним уязвлённое эго, ярость от критики, всю кипящую под кожей злобу. Научился быть осторожным, чтобы не сказать и не сделать лишнего с людьми, которые полезны, неприкосновенны, сильнее — и после отыгрываться на тех, кто ничего не сможет ему сделать. Только выпустив пар через жестокость, он может искренне улыбаться и смеяться.","Трогать людей он, однако, сам не любит. Как и не любит, когда касаются его.","Чистоплотность порой доходит до абсурда: после чужих телесных жидкостей долго и упорно отмывается, шоркая кожу до содранных слоёв эпидермиса. Ворчит, когда мокнет под дождём. Не наденет одежду дважды, пока её не постирают. Отправит на химчистку обувь, которой, не дай бог, наступит на говно.","Та же брезгливость, с добавкой раздражения, охватывает его, когда имя читают неправильно, называя Уолтером. Слишком мягкое звучание. Но куда большее бешенство вызывает коверканье фамилии: это грубейшее хамство вместо «Суровый» называть его «Оленем» (Хирш)."],"biography":["— Любящая немецкая семья, заботливые братья, уютный дом – такое Вальтер видел только на картинках. С тех ранних лет, как он начал себя осознавать, он запомнил и печальную правду: он нежеланный ребёнок. Право слово, лучше бы и правда мать сделала аборт. Жаль только, что плод обнаружили на поздних сроках.","Вальтер родился с пороком сердца (не мудрено при образе жизни родителей). Он знал, что если орган откажет, домочадцы только обрадуются. Ведь в старом доме, пропахшем кислым пивом и немытой посудой, было и без него уже тесно. Вальтеру приходилось ютиться в небольшой комнате с двумя братьями, постоянно срывающимися на нём. Насилие разного толка, от психологического до сексуального, было частью обыденности. Привычно. Даже банально.","Вальтер копил злость, ненависть, но терпел. Стиснув зубы, буравя пол взглядом, продолжал оставаться в отчем доме, ожидая окончания школы. Сбеги он из дома раньше срока, вряд ли без аттестата получил бы должное образование. А он хотел. Ведь слабое тело можно было компенсировать только умом.","Гамбургская высшая школа изобразительных искусств, разрыв контактов с семьёй, незаконные подработки по ночам, великолепная успеваемость через перфекционизм и труд. Тогда же он открыл для себя, что насилие над кем-то приносит колоссальное удовлетворение. Лекарство от аритмии, накрывавшей его при любом, даже малейшем, осознании провала. Во время проникновений в богатые дома и кражи дорогих произведений искусства, Харш не упускает возможности заодно проявить свои наклонности, избивая тех, кто попадётся под руку. Лишь насилие детьми им не приветствовалось – сказывалась личная травма по этому поводу.","Удача и только удача провела его через эту рискованную дорожку (и это с его-то здоровьем и одышкой от недолгого бега). Вальтер становится арт-дилером краденого, лицом и посредником в перепродаже антиквариата и произведений искусств на подпольных аукционах. Нанимает людей, принимает заказы, ищет клиентов. С появлением первых крупных денег дотягивается до подола госпожи Роскошь и мира без грязи. Прекрасные апартаменты, фарфоровые чашки, костюмы под заказ, зажимы с драгоценными камнями. Предметы богатства, которыми он старался себя окружить, скупая их даже на последние деньги.","Но страсть к эстетичному насилию оставалась при нём, всегда и неизменно. Именно она притянула его в клуб HORTUS. И предложение стать его арт-директором он запомнил как момент почти идеального удовлетворения."],"ability":["— Бог создал людей неравными, но оружие — это демократичный уравнитель. С маниакальным упорством отточил стрельбу до той степени, что пистолет стал продолжением его перфекционизма, тем компенсируя слабое тело.","— Прекрасно образован в сфере искусства и истории. Разбирается в живописи, скульптуре, антиквариате и подделках — часто лучше, чем сами эксперты. Более 10 лет в подпольной торговле, знает всех игроков: скупщиков, коллекционеров, посредников, фальсификаторов. И, конечно, знает как «отмыть» историю предмета поддельными сертификатами, подставными аукционами и липовыми экспертизами."],"weaknesses":["— Порок сердца, из которого вытекает множество последствий: быстрая утомляемость, аритмия в стрессовом состоянии, одышка от физической активности и отдельный список побочных эффектов от лекарств. Он презирает своё тело, презирает неидеальность в чужих телах, завидует здоровым. Отсюда же мания контроля над ситуацией, собой и людьми, раз сердце контролировать не может.","– Ухудшение памяти после перенесённого микроинсульта, отчего Вальтеру приходится записывать важную информацию и перечитывать её, чтобы освежить знания. Не так критично, как было, например, с чумой бессонницы в «Сто лет одиночества», но собственная забывчивость выводит его из себя.","– Перфекционизм. Не может отпустить ситуацию, если результат не идеален. Слишком зациклен довести дело до конца, чего бы это не стоило. Но он никогда не доволен полностью и раздражается, если кому-то удаётся со своей критикой или простым комментарием указать на пятно неидеальности."],"features":["— Имеет просторную квартиру в Монако и коттедж на юге Франции в пригороде Антиба.","— Воздерживается от алкоголя, а курение презирает за слишком въедливый запах от дыма.","— При знакомстве с новым человеком оценивает его как экспонат, мысленно примеряя позу живой статуи.","— Искренне влюблён в картины с сюжетами разрушений.","— Сам трогать людей не спешит, поэтому рукопожатия лишь терпит как обязательный костыль в социуме. В остальных случаях использует подручные средства, если нужно нанести кому-то травму или скорректировать чужую позу.","— Сексуализированное насилие в детстве навсегда отбило у него интерес к плотским контактам, заодно и к романтическим отношениям. Флиртует разве что в качестве социальной игры, но не более. Хотя, может приказать кому-то подрочить при нём, если за этим стоит как минимум психологическое насилие.","— Ненавидит свою семью. И хотя сейчас имеет ресурсы вернуть им всё троекратно, Вальтер предпочитает самолично приехать в родной городок в Германии и из машины наблюдать, как они продолжают барахтаться на социальном дне. Ему неоднократно угрожали смертью родственников – это искренне его веселит каждый раз.","— Принимает апиксабан и бета-блокатор два раза в день, в одно и то же время и где бы ни находился. Из-за лекарств легко появляются синяки, долго не останавливаются кровотечения из мелких порезов, мёрзнут руки. Он ненавидит каждую таблетку, но ещё больше боится повторения микроинсульта. Визиты к кардиологу раз в две недели – отдельный круг ада. На приёме приходится смириться, что его касаются.","— Неоднократно уже покупал людей для своей фантазии: живых статуй, часами стоящих в одной позе в его личной галерее. Безвольных экспонатов у него было уже пятеро, которыми он любил любоваться за чашкой кофе. Истязал их до смерти, морил голодом, вводил смертельные инъекции, подвешивал в петле – ведь нет ничего приятнее уничтожения прекрасного. Но самой интересной диковинкой за многие годы стал Итан Деверон, прошлый арт-директор HORTUS. Приобрести человека, который некогда был так высоко, а теперь находится на самом дне? Удовольствие для собственного эго – смотреть на такую картину чужого падения."],"appearance":["— На первый взгляд – породистый, элегантный мужчина с безупречными манерами. На второй – что-то не так. Слишком правильная улыбка. Слишком неподвижное лицо. Слишком холодные глаза. Он выглядит как дорогая восковая фигура – красиво, но неестественно.","Светло-голубые глаза, почти прозрачные, с тяжёлым, немигающим взглядом. В них нет тепла, только холодная оценка. Бледные губы почти всегда сложены в лёгкую вежливую улыбку. В моменты истинного бешенства губы сжимаются в линию, но улыбка остаётся. На Вальтере всегда дорогой костюм, сшитый на заказ в Лондоне или Милане, а под ним синяки. Зажимы для галстука — антикварные, с драгоценным камнем.","— Рост: 188 см. Вес: 75 кг.","— Прототип внешности: Билл Скарсгард | Bill Skarsgard"]},"stats":{},"tracks":[],"photo":"images/walter.jpg","archived":false},{"id":"vincent-lamorak","name":"Винцент Ла’Морак","aka":["Vincent La’Morak","Ви"],"tags":["TARGET ELIMINATION"],"age":["28 лет"],"role":["Инженер","Наёмником не является"],"orient":["Бисексуален"],"player":{"name":"Serpent Moon","url":"https://vk.ru/the_horny"},"date":"23 сен в 14:56","epigraph":null,"sections":{"character":["Характер скверный, не женат. Довольно спокоен, открыт к новым знакомствам, но сам первым не полезет, не любит драки без веской на то причины, оскорбления в свою сторону. В коллектив вливается постепенно, предпочитая изучать, кому стоит доверять, а кого обходить стороной."],"biography":["Винцент родился и вырос в довольно обеспеченной семье, и в целом эту жизнь можно было назвать обычной до определённого момента. Он вырос, отучился на инженера, хотя и хотел на другую специальность, однако менее востребованную в обществе, после учёбы почти сразу армия, где Винцент научился обращаться с оружием и средствами связи, модернизировать их, чинить и улучшать. Главной целью в жизни всегда были деньги, как можно больше денег, однако, как оказалось, большие деньги водятся только среди преступности и насилия, но это не проблема. Не важно, как появились эти деньги, важно их количество, деньги не пахнут, на них не остаётся чужая кровь. С этой установкой он сразу после службы, оборвав любые связи с семьёй и прошлым, влился в нужные преступные круги и своим умением понимать чужие желания, ожидания, и умением молчать, когда не спрашивают, дошёл до не просто преступной группировки, а до настоящей мафии, разросшейся куда больше, чем все предыдущие места «работы». Во время выполнения своей, казалось бы, рутинной работы, он и сам не подозревал, что уже привлёк внимание влиятельных людей, с одним из которых случайно пересёкся. Лишь потом Винцент узнает его имя, Лиард Эдер, когда тот пришлёт приглашение в свой клан. Отказываться нельзя, да и к тому же умелые и ловкие руки, оказывается, всем нужны."],"ability":["огромные познания в сфере инженерии, радиотехники, видеоаппаратуры, оружия самых разных калибров и видов.","умеет обращаться с огнестрельным оружием, самым любимым является снайперская винтовка.","имеет стопроцентное зрение и развитую мелкую моторику рук, что позволяет без особых проблем выполнять свою работу.","навыки рукопашного боя и боя с ближним оружием (нож, кастет, иногда цепь)","умеет водить автомобиль и мотоцикл","высокая гибкость всего тела, гнётся в разные стороны и при желании может уместиться в маленьком пространстве без особого дискомфорта.","знает японский, корейский, немецкий языки"],"weaknesses":["любые навыки ведения боя испаряются в воде, он абсолютно не умеет плавать, а на воде держится слабо","удары в нижнюю часть тела (бедро, колени, голеностоп, под коленями) серьёзно выводят из состояния, приходится ждать какое-то время, чтобы вновь иметь возможность быть в бою.","звуки взрывов, гранат, свето-шумовых в том числе, надолго выбивают из колеи из-за чувствительного слуха."],"hobby":["стрельба из лука, не профессионально, не на поражение, просто тихое развлечение","изготовление ювелирных украшений вручную, иногда в них инкрустируются не только камни, но и жучки, маленькие камеры и прочие мелкие средства связи.","готовка самых разных блюд.","умеет бить татуировки.","спать. спит всегда, везде, в любых положениях. спать это жизнь."],"features":["предпочитает есть только то, что готовил сам, либо еду из вакуумных упаковок и упаковок с пломбами, если такой возможности нет, то есть начнёт самым последним, смотря за реакцией других людей.","есть аллергия на кошачью шерсть, однако кот тоже есть, корниш-рекс, гипоаллергенная порода со своим очарованием и шармом. Кота зовут Пиксель, но сам хозяин его чаще называет «скотина» за скверный характер животного.","любит сакуру и всё, что с ней связано: рисунки, запах, вкус, эфирные масла, принты на одежде, еда с добавлением цветов.","никогда не пит алкоголь и не пробовал наркотики, категорически их отвергая. Алкоголь заменяет чаем, любимы сорт - молочный улун.","ненавидит (или просто боится) врачей, будет терпеть до последнего, но к специалистам не обратится самостоятельно.","ходит тихо, почти беззвучно, если не носит обувь на массивной или жёсткой подошве","высокая гибкость тела, благодаря чему гнётся во все стороны","спит в самых неестественных позах тела, иногда свесив голову почти к полу, задрав вверх ноги или закинув одну из них на другую"],"appearance":["Рост 182, вес около 75-76 килограмм, тело скорее ближе к худому, однако сила в нёс всё же есть.","Предпочитает большое количество украшений на шее, руках, запястьях и пальцах, все цацки мира можно наблюдать в одном месте.","Прототип внешности - Валерий Ковтун."]},"stats":{"Сила":5,"Ловкость":5,"Интеллект":6,"Восприятие":1,"Харизма":3},"tracks":[],"photo":"images/vincent-lamorak.jpg","archived":false},{"id":"vladimir","name":"Владимир Леонидович Стрелецкий","aka":["Vladimir Streletsky","Влад / Зеро (Ноль)"],"age":["27 лет"],"role":["Оперативник «Шан»"],"orient":["би"],"tags":["TARGET ELIMINATION"],"player":{"name":"Lucky Bunny","url":"https://vk.ru/id645878079"},"date":"17 июл в 11:38","epigraph":null,"sections":{"character":["Внешне довольно спокоен и собран. Владимир убивает и пытает без жалости, хотя для него боль — не самоцель, а инструмент. И он использует ее мастерски.","Владимир прекрасно впитал все то, что в нем воспитывало его окружение. Насилие для него — естественная среда обитания. Он не привычен к простой, “гражданской” жизни.","Его речь часто язвительная, резкая. Владимир может казаться уверенным и циничным. Он способен запугивать и давить, даже не применяя физической силы. Чаще всего его насилие не несет. В себе ничего личного.","Это просто работа.","Он способен подчиняться даже тому, кого не слишком уважает. Однако при этом не обязательно будет демонстрировать уважение вместе с послушанием. Владимир всегда ищет авторитет. Его преданность всегда проистекает из разных причин: из благодарности, из чувства долга или просто из неимения другого выбора, но самое важное во всем этом всегда — его внутренняя потребность во внешнем ориентире.","Владимир — первоклассное оружие. Способное, безжалостное, не задающие вопросов. Возможно, иногда слишком острое на язык, но это вполне можно держать в узде. Пес, которого можно держать на цепи покороче."],"biography":["Владимир родился в России, в Тверской области.","Еще с девяностых его отец вел криминальный образ жизни. В основном он выполнял роль обычной шестерки. Человек, не брезгующий запачкать руки и готовый выполнять любую работу за деньги. Такой образ жизни привлекал его куда больше, чем честная работа на заводе за копейки. Начало двухтысячных принято концом худших времен. Но для Твери это было совсем другое время. В тот момент местное ОПГ — Тверские волки, только начало набирать обороты. Группировка превратилась в мощную боевую организацию. На их счету заказные убийства, вымогательства и устранение лидеров других ОПГ. В это время большинство местных преступных группировок перешло под покровительство Александра Костенко, одного из основателей “Волков”. Леонид был одним из тех, кто находился под влиянием Костенко еще до формирования группировки и с приходом правления “Волков” его место только закрепилось.","Детство Владимира прошло в атмосфере постоянного насилия. По сути, он является идеальным продуктом того, что в него вложили. Насилие было просто фоном обычной жизни.","Владимир был слишком мал, чтобы понимать все, но как любой ребенок, впитывал окружающие его реалии как губка. Этому способствовал и подход Леонида к воспитанию. Он делал все, чтобы слепить из сына “настоящего мужчину” в своем понимании, разумеется.","Влияние волков выходило далеко за пределы Тверской области. Через Александра Костенко группировка поддерживала связи с криминальными структурами Москвы и Санкт-Петербурга.","Но вечно это длиться не могло. С шестого по девятые года было арестовано большинство лидеров и участников группировки. В их числе оказался и Леонид.","Владимиру на тот момент было всего десять. Временно его отправили под опеку бабушки. Кто знает, смог бы он стать обычным ребенком после всего этого. В любом случае, судьба не дала шанса проверить это. Потому что на горизонте появился добрый “дядя Степа” — тогдашний босс отца, решивший взять мальчишку под свое крыло. Чуть позже Владимир понял, что был не целью благотворительности, а заложником, рычагом давления на отца, который знал достаточно, хоть и не был самой крупной фигурой. Но это не имело значения. Владимир хорошо учился.","Он был способным, быстрым, выполнял приказы без вопросов. Он возвращался к бабушке со сбитыми костяшками пальцев, иногда пропадая целыми днями. Иногда он слышал, как она молилась за него перед сном. По воскресеньям иногда таскала его в местную церковь. Но бог не защитил никого из них.","Степан хорошо его вышколил. Он был одновременно кормящей и карающей рукой. Но это была не хаотичная злость отца. Здесь была система. Владимир понимал за что хвалят, а за что наказывают и научился делать так, чтобы хвалили его больше.","Он наконец нашел того, кому мог принадлежать.","С каждым годом Владимир показывал себя все лучше, зарабатывая репутацию исполнителя, которому можно доверять. В это время уличная, бесконтрольная преступность и бесчинства ОПГ, обросли оболочкой легального бизнеса. Теперь всем заправляли не те, кто умел лучше убивать, а мужчины в деловых костюмах и с дорогими часами. И Владимир на удивление быстро адаптировался под новую реальность.","Ему было семнадцать, когда бабушка умерла. Единственная ниточка, связывающая его с этой нормальной, законопослушной жизнью оборвалась, оставив после себя только воспоминания и серебряный нательный крестик, свой последний подарок.","Прошло время. Владимиру поручали все более сложные и ответственные задания. Степан называл его едва ли не “приемным сыном”. Он обучил его, кормил и одевал. Владимир же в свою очередь отвечал верной службой, всегда стоя рядом, пока Степан все больше расширял границы своего влияния. Владимир успел побывать во многих городах и регионах. Степан настоял и на изучении иностранного языка. Он не планировал останавливаться на России.","И вот, поворотный момент в жизни Владимира. Самое ответственное задание. Его отправляют в Монако с важной миссией. Хотя по сути своей, она не отличается от большинства других заданий. Очередная сделка с новым партнером. Все должно быть быстро и чисто.","“Я ведь могу доверять тебе, верно?” - спрашивает Степан, сжимая плечо его не совсем по-отечески, немного крепче, так что это ощущается как давление. Владимир кивает.","На бумаге все чисто. Виза на три месяца, оформлена как командировка через фирму Степана, загранпаспорт.","И все проходит гладко. Сделка заключена, договоры подписаны. Все хорошо до одного звонка. Старый друг предупреждает о том, что возвращаться нельзя. Все донельзя просто и почти также сложно. Степан в ярости. Что-то пошло не так. Ему хана, если вернется.","И вот, Владимир застрял в чужой стране, с просроченной визой, не в состоянии вернуться домой под угрозой смерти. Щенок остался без хозяина, даже не зная, за что именно его выбросили. Возможно, ему суждено было сдохнуть, влипнуть в неприятности или наткнуться на иммиграционную службу. Но если чему-то Владимир и научился лучше, чем драться, так это выживать и адаптироваться. Он нашел старого знакомого своего крестного отца, русского эмигранта, имеющего связи в местном “бизнесе”. Завалился к нему домой, без денег, без документов, понятия не имея, что делать дальше. Тогда впервые в жизни ему пришлось умолять о помощи. И ее он получил. Знакомый посоветовал его кандидатуру одному из местных, представив как парня, на которого можно положиться. Того, кто не будет болтать и не доставит неприятности. А если доставит — прикрыть его некому. Здесь Владимир начинал все сначала. Мелкие поручения, чтобы проверить его на прочность и готовность запачкать руки. Он снова стоял на коленях, клянясь в верности, в своей полезности, в том, что не доставит хлопот.","Когда он начинал ему было двадцать три. И вот, спустя четыре года он неплохо освоился и продвинулся по карьерной лестнице. Хотя при этом он все еще остается русским нелегалом, крепко привязанным цепью к своему новому хозяину. Не только потому что верен, но и потому что пойти ему больше попросту некуда."],"ability":["• Физически вынослив.","• Огневая подготовка: Владение различными видами стрелкового оружия (автоматы, пистолеты, снайперские винтовки), стрельба навскидку, в движении и из неустойчивых положений.","• Обращение с холодным оружием: использование ножа для бесшумной ликвидации, самообороны и выживания.","• Рукопашный бой и самооборона: Использование приемов боевых искусств для нейтрализации противника голыми руками или подручными средствами, а также защита от вооруженного нападения.","• Специальные навыки: высокая стрессоустойчивость, умение работать с техникой связи, оказание первой медицинской помощи в боевых условиях.","• Навыки выживания в дикой среде.","• Знание языков: русский на уровне носителя, свободное владение английским, посредственное знание французского и испанского (знает некоторые фразы, в основном касающиеся работы или уличный жаргон).","• Развитое тактическое мышление: способен принимать быстрые и рациональные решения в условиях ограниченного времени и под давлением."],"weaknesses":["• Зависимость / пассивность: крайне зависим от своего командования.","• Отсутствие цели: он выполняет то, что ему прикажут.","• Связи с русской мафией: ему опасно попадаться на глаза своим же. На родину он также вернуться не может.","• Нелегальное положение в стране.","• Низкий уровень рефлексии: Владимир очень “телесен”. Он плохо понимает собственные чувства, опираясь скорее на физические ощущения и окружающую обстановку.","• Плох в долгосрочном планировании: при давлении может сделать то, что улучшит ситуацию в ближайшей перспективе, но навредит в долгосрочной.","• Плохо действует автономно, если не поставить перед ним конкретную задачу.","• Почти всегда напряжен, даже если не замечает этого. Иногда это может сказываться на его эффективности."],"hobby":["• Изучение языка: носит с собой англо-французский словарь. Читает его в свободное время, учит некоторые слова.","• Чистка оружия: пересобирает и чистит оружие. Всегда держит его в идеальном состоянии.","• Просмотр передач на разных языках с субтитрами.","• Спорт: изнуряет себя физическими тренировками, особенно если долго сидит без дела. Помогает ему поддерживать форму и избавиться от ненужных мыслей."],"features":["• Спит на тонком матрасе, на полу.","• Телефон всегда в беззвучном режиме, на вибрации. Когда засыпает, кладет его в металлическую кастрюлю, чтобы просыпаться от гудка.","• Пользуется старым кнопочным телефоном.","• Очень чутко спит.","• Часто слушает песни на русском.","• Иногда засыпает, прислонившись спиной к двери."],"appearance":["—","Рост — 187см; вес — 83кг.","Изначально довольно худощав, сейчас  имеет атлетическое телосложение, выглядит довольно крупным из-за роста и одежды. Серые глаза. Цвет волос изначально темно-русый, обычно бреет их под тройку. Не любит щетину и всегда старается убирать ее полностью.","На теле есть множество тату и шрамов: пулевые раны, исполосованная спина, сбитые костяшки, шрам над бровью, крупный ожог на животе и множество других мелких несовершенств. Всегда носит с собой почерневший серебряный крестик, доставшийся от бабушки.","Прототип внешности — Francesco Cuizza"]},"stats":{"Сила":4,"Ловкость":5,"Интеллект":3,"Харизма":4,"Восприятие":4},"tracks":["Постпанк про Питер — Felice Rivarez feat. Шуми"],"photo":"images/vladimir.jpg","archived":false},{"id":"hermann","name":"Германн фон Рихтгофен","aka":["Hermann von Richthofen","Герр, Док."],"tags":["TARGET ELIMINATION"],"age":["46 лет"],"role":["Комендант Цитадели","Не является наемником."],"orient":["Гетеросексуален."],"player":{"name":"Hermann Von Richthofen","url":"https://vk.ru/richthofenh"},"date":"14 авг в 1:39","epigraph":null,"sections":{"character":["Про таких говорят \"харизматичная сволочь\". Он спокоен, вежлив, эрудирован и без труда располагает к себе собеседника. Обладает хоть и специфическим, но развитым чувством юмора и хорошими манерами.","А за маской доброжелательности скрывается холодный циник, который безупречно логичен и абсолютно безнравственен. Он самовлюблен, самоуверен, высокомерен и убежден в своем праве приказывать и вершить суд.","Жестокость и чужой страх для него — это лишь инструменты для установления и поддержания контроля. Власть он не столько любит, сколь считает чем-то естественным и принадлежащим ему по праву. Свой садизм он предпочитает называть наведением порядка и восстановлением справедливости, а иногда единственный способ сделать это — лишить человека свободы, достоинства или жизни.","Собственные поступки он никогда не подвергает сомнению и не испытывает внутреннего конфликта в момент принятия решения, потому что у него слишком много уверенности в собственной правоте и слишком мало веры в саму возможность чужой. При этом он чтит субординацию, способен выполнить почти любой приказ без вопросов и поставить интересы клана выше своих, потому что выше порядка стоит лишь верность."],"biography":["А еще про таких говорят \"родился с серебряной ложкой во рту\". Он родился в богатой немецкой семье со старой аристократической родословной, а его будущее было решено задолго до самого момента зачатия: престижное образование, место в семейном бизнесе, затем его управление и, в конце концов, наследство. Отец был человеком строгим и авторитарным. И считал, что сыну достаточно дать правильное воспитание, чтобы тот вырос достойным продолжателем фамилии. Мать умерла рано, а нанятый после ее смерти воспитатель оказался человеком жестоким и с одобрения отца использующим весьма консервативные методы воспитания.","Пожалуй, именно поэтому первая серьезная борьба с отцом началась с довольно безобидной вещи — он решил стать врачом. Не юристом, экономистом или будущим управляющим семейной империей. Нет. Врачом. Отец воспринял это как подростковый протест и отказался оплачивать обучение, рассчитывая, что сын не справится со вступительными на необходимый для стипендии балл и быстро передумает. Но он недооценил упрямство собственных генов.","Германн не только смог поступить в Берлинский университет своими силами, но и действительно полюбил медицину. Она хорошо подходила его характеру:
